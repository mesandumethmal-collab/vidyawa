<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Science WOW Tute</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: glass sticky header, dark gradient hero with live stats, colour-coded unit rows of lesson cards, lesson page with segmented tabs, MCQ trainer with result ring. One hue per unit. */
:root{--bg:#f5f6fb;--panel:#ffffff;--ink:#12172b;--mute:#667089;--line:#e3e6f1;--soft:#eef0f8;--accent:#4f46e5;--on:#fff;--good:#12805c;--goodbg:#dcf5ea;--bad:#c2334a;--badbg:#fde6ea;--glass:rgba(255,255,255,.78);--shadow:0 1px 2px rgba(18,23,43,.05),0 8px 24px -12px rgba(18,23,43,.18);--hero1:#1d1b4b;--hero2:#0b1030}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e1d;--panel:#131933;--ink:#eaedf9;--mute:#9aa3c4;--line:#252d52;--soft:#1a2142;--accent:#9a95ff;--on:#0a0e1d;--good:#5fe0aa;--goodbg:#10372b;--bad:#ff8fa3;--badbg:#401a24;--glass:rgba(19,25,51,.78);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0e1d;--panel:#131933;--ink:#eaedf9;--mute:#9aa3c4;--line:#252d52;--soft:#1a2142;--accent:#9a95ff;--on:#0a0e1d;--good:#5fe0aa;--goodbg:#10372b;--bad:#ff8fa3;--badbg:#401a24;--glass:rgba(19,25,51,.78);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Noto Sans Sinhala","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance;font-weight:800}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--glass);backdrop-filter:blur(14px)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font:800 17px/1 "Inter",sans-serif;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.brand span{background:linear-gradient(90deg,#4f46e5,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.sbox{position:relative;flex:1;min-width:0;max-width:460px;margin-left:auto}
.sbox input{width:100%;font:inherit;font-size:14.5px;padding:9px 14px 9px 38px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink)}
.sbox svg{position:absolute;left:13px;top:50%;translate:0 -50%;width:16px;height:16px;color:var(--mute)}
.ic{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:50%;flex:none}
.ic svg{width:18px;height:18px}
.res{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);max-height:70vh;overflow:auto;padding:6px}
.res a{display:block;padding:10px 12px;border-radius:10px;text-decoration:none;font-size:14px;line-height:1.55}
.res a:hover,.res a:focus-visible{background:var(--soft)}
.res small{display:block;color:var(--accent);font-weight:700;font-size:12px}
.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(60% 90% at 85% 0%,rgba(236,72,153,.38),transparent 60%),radial-gradient(70% 90% at 0% 100%,rgba(79,70,229,.55),transparent 60%),linear-gradient(160deg,var(--hero1),var(--hero2));padding-block:56px 44px;margin-top:calc(-1 * env(safe-area-inset-top,0px) - 0px)}
.hero .wrap{position:relative}
.hero .tag{display:inline-block;font:700 12px/1 "Inter",sans-serif;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 12px;border-radius:999px}
.hero h1{font-size:clamp(34px,7.5vw,66px);margin-top:16px;letter-spacing:-.01em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#8ab4ff,#f0abfc,#fdba74);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:56ch;color:rgba(255,255,255,.78);margin:14px 0 0;font-size:17px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:700;text-decoration:none;background:#fff;color:#1d1b4b;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:none}
.btn.pri{background:var(--accent);color:var(--on)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:34px}
.tile{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px 16px;backdrop-filter:blur(6px)}
.tile b{display:block;font:800 30px/1.1 "Inter",sans-serif}
.tile span{font-size:13px;color:rgba(255,255,255,.72)}
.tile.ring{display:flex;align-items:center;gap:12px}
.sec{margin-top:40px}
.sec h2{display:flex;align-items:center;gap:10px;font-size:22px}
.sec h2 i{width:12px;height:12px;border-radius:4px;background:var(--u)}
.sec .sub{color:var(--mute);font-size:14px;margin:2px 0 14px 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;text-decoration:none;min-width:0;box-shadow:var(--shadow);overflow:hidden;transition:transform .18s,border-color .18s}
.card::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--u)}
.card::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--u);opacity:.09}
.card:hover{transform:translateY(-3px);border-color:var(--u)}
.card .no{font:800 13px/1 "Inter",sans-serif;color:var(--u);letter-spacing:.1em}
.card .nm{font-weight:700;font-size:17px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;background:var(--soft);color:var(--mute);border-radius:999px;padding:2px 10px;font-weight:600}
.pb{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:auto}
.pb i{display:block;height:100%;background:var(--u);border-radius:4px}
.fin{margin-top:44px;border-radius:24px;padding:28px;color:#fff;background:linear-gradient(120deg,#4f46e5,#ec4899 70%,#f97316)}
.fin h2{font-size:26px}.fin p{margin:6px 0 16px;opacity:.92}
.crumb{padding-top:20px;font-size:14px}.crumb a{color:var(--mute);text-decoration:none;font-weight:600}
.lhead{margin-top:14px;border-radius:24px;padding:26px 24px;color:#fff;background:linear-gradient(135deg,var(--u),color-mix(in srgb,var(--u) 55%,#000))}
.lhead .no{font:800 13px/1 "Inter",sans-serif;letter-spacing:.14em;opacity:.85}
.lhead h1{font-size:clamp(26px,5.5vw,42px);margin-top:8px}
.lhead .chips{margin-top:14px}.lhead .chip{background:rgba(255,255,255,.2);color:#fff}
.tabs{display:inline-flex;gap:4px;margin:20px 0;padding:5px;background:var(--soft);border-radius:999px;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 18px;border-radius:999px;font-weight:700;color:var(--mute);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.note{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:15.5px;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere}
.note.def{border-top:4px solid var(--u)}
.note.def h3{font-size:16px;color:var(--u);margin-bottom:4px}
.note.tip{background:var(--goodbg);border-color:transparent}
.note.fire{background:linear-gradient(120deg,#fde68a,#fdba74);color:#3b1d00;font-weight:700;border-color:transparent}
.note.full{grid-column:1/-1}
.h4{grid-column:1/-1;font-size:20px;margin-top:16px;display:flex;align-items:center;gap:10px}
.h4::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--u)}
.ess{background:var(--panel);border:1px solid var(--line);border-radius:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.ess>summary{cursor:pointer;padding:16px 20px;font-weight:700;list-style:none;display:flex;gap:12px;align-items:flex-start}
.ess>summary::-webkit-details-marker{display:none}
.ess .n{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--u);color:#fff;font:800 15px/1 "Inter",sans-serif}
.ess .mk{margin-left:auto;flex:none;font-size:12.5px;background:var(--soft);padding:2px 10px;border-radius:999px;color:var(--mute)}
.ess .in{padding:0 20px 18px;max-width:80ch}
.ess .q{margin:12px 0 4px;white-space:pre-line}
details.ans{margin:6px 0 12px;border-radius:12px;background:var(--goodbg)}
details.ans summary{cursor:pointer;padding:8px 14px;font-size:14px;font-weight:700;color:var(--good)}
details.ans div{padding:0 14px 12px;white-space:pre-line}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tools .sp{flex:1}
.sbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600}
.meter{height:8px;background:var(--soft);border-radius:5px;overflow:hidden;flex:1;min-width:120px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--u),var(--accent));transition:width .3s}
.mq{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:14px;max-width:80ch;box-shadow:var(--shadow)}
.mq .n{display:inline-block;font:800 12px/1 "Inter",sans-serif;letter-spacing:.1em;color:var(--u);background:var(--soft);padding:6px 10px;border-radius:999px}
.mq .st{margin:10px 0 14px;font-weight:500}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;line-height:1.65;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--u);background:var(--soft)}
.opt b{flex:none;width:28px;height:28px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font:700 13px/1 "Inter",sans-serif}
.opt:disabled{cursor:default;color:inherit}
.opt.ok{background:var(--goodbg);border-color:var(--good)}.opt.ok b{background:var(--good);color:var(--on)}
.opt.no{background:var(--badbg);border-color:var(--bad)}.opt.no b{background:var(--bad);color:var(--on)}
.exp{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:15px}
.exp strong.g{color:var(--good)}.exp strong.b{color:var(--bad)}
.result{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px 22px;margin:18px 0;box-shadow:var(--shadow);max-width:80ch}
.result h3{font-size:20px}.result p{margin:2px 0 8px;color:var(--mute)}
.pn{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.pn a{flex:1;min-width:200px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 18px;box-shadow:var(--shadow)}
.pn small{display:block;color:var(--mute);font-size:12.5px;font-weight:700}
.pn .r{text-align:right}
.empty{color:var(--mute);padding:20px 0}
footer{color:var(--mute);font-size:13px;padding-block:44px}
.view{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.card{transition:none}html{scroll-behavior:auto}}
@media (max-width:520px){.brand b{display:none}.hero{padding-block:40px 32px}}
</style>
<header class="top"><div class="wrap bar">
<a class="brand" href="#home"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#4f46e5"/><g fill="none" stroke="#fff" stroke-width="1.7"><ellipse cx="16" cy="16" rx="9" ry="3.8"/><ellipse cx="16" cy="16" rx="9" ry="3.8" transform="rotate(60 16 16)"/><ellipse cx="16" cy="16" rx="9" ry="3.8" transform="rotate(120 16 16)"/></g><circle cx="16" cy="16" r="2.2" fill="#fbbf24"/></svg><b><span>Science</span> WOW</b></a>
<div class="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" autocomplete="off" placeholder="සොයන්න: වචනයක්, ප්‍රශ්නයක්…" aria-label="සොයන්න"><div class="res" id="res" hidden></div></div>
<button class="ic" id="theme" aria-label="තේමාව මාරු කරන්න"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>

වේ දැක්වේ. 2 වන අවස්ථාවේ දී\nට්‍රොලිය මත ක්‍රියා කරන සම්ප්‍රයුක්ත බලයේ විශාලත්වය හා දිශාව ලියන්න. (ල. 2)\nඅවස්ථාව A තුලා වේ පාඨාංකය B තුලා වේ පාඨාංකය\n1 3 N 3 N\n2 3 N 7 N\n3 7 N 7 N\n\nපිළිතුර විශාලත්වය : 7 N − 3 N = 4 N (ල. 1). දිශාව : B තුලාව දෙසට / වැඩි බලයේ (7 N) දිශාවට (ල. 1).\n(iii) 1 හා 3 අවස්ථා වල දී ට්‍රොලියේ චලිතය පිළිබඳ ඔබ බලාපොරොත්තු වන නිරීක්ෂණය කුමක් ද? සම්ප්‍රයුක්ත\nබලය ඇසුරෙන් එයට හේතුව දෙන්න. (ල. 2)\n\nපිළිතුර ට්‍රොලිය චලනය නොවේ / නිශ්චලව පවතී (ල. 1). සමාන බල දෙකක් එකම රේඛාවක් ඔස්සේ විරුද්ධ\nදිශාවලට ක්‍රියා කරන නිසා සම්ප්‍රයුක්ත බලය ශූන්‍ය වේ (ල. 1).\n(iv) 2 වන අවස්ථාවේ දී මෙන්, ශූන්‍ය නොවන සම්ප්‍රයුක්ත බලයක් ක්‍රියා කර ට්‍රොලිය චලනය කරවන විට, එම\nබලය හඳුන්වන පාරිභා ෂික නාමය කුමක් ද? (ල. 1)\n\nපිළිතුර අසංතුලිත බලය / අසමතුලිත බලය (Unbalanced force). (සඵල බලය, සාමූහික බලය යනු සම්ප්‍රයුක්ත\nබලයට ම තවත් නම් ය — ශූන්‍ය සම්ප්‍රයුක්තයකට ද යෙදෙන නිසා ලකුණ නොදෙන්න.)\n(v) A තුලා වේ පාඨාංකය 7 N ලෙස තබා ගෙන, ට්‍රොලිය A දෙසට 2 N සම්ප්‍රයුක්ත බලයකින් ඇදී යාමට නම් B\nතුලා වේ පාඨාංකය කොපමණ විය යුතු ද? ගණනය කිරීම පෙන්වන්න. (ල. 2)\n\nපිළිතුර A දිශාව (+) ලෙස ගත් විට : 7 N − B = 2 N (ල. 1) ⇒ B = 5 N (ල. 1).\n(vi) කඹ ඇදීමේතරගයක දී කඹය ඇදී යන්නේ වැඩි බලයක් යොදන කණ්ඩායම දෙසට ය. සම්ප්‍රයුක්ත බලය\nඇසුරෙන් මෙ ය පැහැදිලි කරන්න. (ල. 2)\n\nපිළිතුර කණ්ඩා යම් දෙක කඹය මත එකම රේඛාවක් ඔස්සේ විරුද්ධ දිශාවලට බල යොදයි (ල. 1). සම්ප්‍රයුක්තය\nබල දෙකේ වෙනසට සමාන වන අතර වැඩි බලයේ දිශාවට ක්‍රියා කරන නිසා කඹය එම දිශාවට ඇදී යයි (ල. 1).\nභෞ තික විද්‍යාව · 10 ශ්‍රේණිය I කොටස ·"},{"t":"ව්‍යුහගත රචනා ප්‍රශ්නය 2 9.3 සමාන්තර බල දෙකක සම්ප්‍රයුක්තය ලකුණු 10","b":"තිරස් මේ සයක් මත තැබූ ලී පටියක x, y හා z සිදුරුවලට A, B හා C නිව්ටන් තුලා තුනක් සම්බන්ධ කර, තුලා\nතුන එකිනෙකට සමාන්තරව ද ලී පටිය ඒවා ට ලම්බකව ද තබා ගනිමින්, පටිය නිශ්චලව පවතින පරිදි අදින ලද\nආකාරය රූපයේ දැක්වේ. A හා B තුලා දෙකේම පාඨාංකය 3.5 N විය.\nx\nz\ny\nA\nB\nC\nලී පටිය\n(i) A හා B බල දෙක ඒක රේඛීය බල නොව සමාන්තර බල ලෙස හඳුන්වන්නේ ඇයි? (ල. 2)\n\nපිළිතුර බල දෙක එකිනෙකට සමාන්තරව එකම දිශාවට ක්‍රියා කරයි (ල. 1). නමුත් ඒවා පටියේ වෙනස් ලක්ෂ්‍ය ුත්ව කේන්ද්‍රය G මුළු බරම ක්‍රියා කරන තනි ලක්ෂ්‍ය ය","එල්ලා ඇඳි සිරස් රේඛා හමු වන තැන","• බල දෙකක් යටතේ සමතුලිතතා වට අවශ්‍ය තාතුන : සමාන · ප්‍රතිවිරුද්ධ · එකම රේඛා ව ආධාරක / දුනු තරාදි දෙකක් මත දණ්ඩ හා ලෑල්ල : ආධාරකයක් වටා ඝූර්ණ ගෙන නොදන්නා බලය හා දුර (ඒකාකාර නම් බර මැදින්)","• ඒකතල සමාන්තර බල තුනක් : F1 + F • 2 = W (ඔන්චිල්ලාව, මීටර කෝ දුව)","• සමාන්තර නොවන ඒකතල බල තුන : ක්‍රියා රේඛා එකම ලක්ෂ්‍ය යක හමුවීම (එල්ලූ පින්තූරය)","• තල ආස්තරයක ගුරුත්ව කේන්ද්‍රය : ස්ථාන තුනකින් එල්ලා සිරස් රේඛා හමු වන ලක්ෂ්‍ය ය","▸ සම්ප්‍රයුක්තය 0 → නිශ්චලයි → සමතුලිතයි","කඹ ඇදීම : දෙපසට සමාන + ප්‍රතිවිරුද්ධ → කඹය","▸ එක් පසක් වැඩි → වැඩි බලයේ දිශාවට · සම්ප්‍රයුක්තය = වෙනස (20 N ←, 25 N → ⇒ 5 N →)","▸ බල 2, 3 හෝවැඩි ගණනක් යටතේ ද සමතුලිත විය","▸ එන්ජිම ක්‍රියා විරහිත රථය තල්ලු කිරීම → සියලු දෙනා එකම දිශාවට → සම්ප්‍රයුක්තය = එකතුව","🔥සමතුලිතතා වට අවශ්‍ය තාතුන ක්‍රියාකාරකම 1, 2 (මුදුව / ලී කුට්ටිය + තරාදි 2) → නිශ්චල විට පාඨාංක සමානයි · එක රේඛා වේ නැත්නම් සමතුලිත කළ නොහැ ක","▸ නවත්වන්න → සම්ප්‍රයුක්තයට සමාන + ප්‍රතිවිරුද්ධ බලය එකම රේඛා වේ (20 N → ⇒ 20 N ←)","▸ බල සමතුලිතතාව","12.3 ඒකතල සමාන්තර බල තුනක් 1. බල තුන ඒකතල විය යුතු ය.","2. එක් බලයක් අනෙක් බල දෙකට ප්‍රතිවිරුද්ධ දිශාවට ක්‍රියා කළ යුතු ය.","3. බල දෙකක සම්ප්‍රයුක්තය තුන්වන බලයට විශා ලත්වයෙන් සමාන හා දිශා වෙන් ප්‍රතිවිරුද්ධ විය","F1 + F2 = W උදා හරණය ඉහළට ↑ පහළට ↓ දණ්ඩේ එල්ලූ කැන ලණු 2හි බල කැනේ බර ආධාරක 2 මත දණ්ඩ අභිලම්බ ප්‍රතික්‍රියා 2 දණ්ඩේ බර මීටර කෝ දුව තරාදි F1, F2 කෝ දුවේ බර ඔන්චිල්ලා වේ ළමයා කඹ 2හි F1, F2 ළමයාගේ බර ගණනයට : දණ්ඩ / ලෑල්ල (ඝූර්ණ සමඟ) ඉහළට බල එකතුව = පහළට බල එකතුව දක්ෂිණාවර්ත ඝූර්ණය = වාමාවර්ත ඝූර්ණය","නිදසුන 2 m සැහැල්ලු AB, කෙළවරවල ආධාරක · A සිට 0.5 m දී 40 N → A වටා : RB × 2 = 40 × 0.5 → RB = 10 N · RA = 40 − 10 = 30 N නිදසුන මැදින් ආධාරකය ඇති සැහැල්ලු ලෑල්ල · 300 N ළමයා 2 m දී → අනෙක් පසින් 400 N ළමයා : 400 × d = 300 × 2 → d = 1.5 m · ආධාරකයේ බලය 300 + 400 = 700 N","💡 මතක ක්‍රමය : නොදන්නා බලය ඇති තැන කරකැ වෙන ලක්ෂ්‍ය ය කරගන්න → ඒ බලය ඉවත් වෙනවා.","12.4 සමාන්තර නොවන ඒකතල බල තුනක් 1. බල තුන ඒකතල විය යුතු ය.","2. බ \nඉලෙක්ට්‍රෝනය\np = ප්‍රෝටෝන\nn = නියුට්‍රෝන\n(i) පදාර්ථ රසායනික සංයුතිය අනුව වර්ග කළ විට ජලය (H2O), ඔක්සිජන් (O2) හා ලුණු ද්‍රාවණය අයත් වන\nකාණ්ඩ වෙන වෙනම ලියන්න. (ල. 1)\n\nපිළිතුර ජලය — සංයෝග ; ඔක්සිජන් — මූලද්‍රව්‍ය (දෙකම සංශුද්ධ ද්‍රව්‍ය) ; ලුණු ද්‍රාවණය — සමජාතීය\nමිශ්‍රණ(තුනම නිවැරදි නම් ල. 1)\n(ii) පරමාණුව සැ දී ඇති ප්‍රධාන උප පරමාණුක අංශු තුන පිළිබඳ පහත වගුව සම්පූර්ණ කරන්න. (ල. 2)\nඅංශුව ආරෝපණය පරමාණුවේ පිහිටන ස්ථානය\nප්‍රෝටෝනය න්‍ය ෂ්ටිය තුළ\nනියුට්‍රෝනය\nඉලෙක්ට්‍රෝනය ඍණ\n\nපිළිතුර ප්‍රෝටෝනය — ධන ; නියුට්‍රෝනය — ආරෝපණයක් නැත (උදා සීන), න්‍ය ෂ්ටිය තුළ ; ඉලෙක්ට්‍රෝනය —\nන්‍ය ෂ්ටිය වටා (ශක්ති මට්ටම්වල). (හිස්තැන් 4 ම නිවැරදි නම් ල. 2 ; 2 – 3 ක් නම් ල. 1)\n(iii) X පරමාණුව විද්‍යුත් වශයෙන් උදා සීන වන්නේ ඇයි? (ල. 1)\n\nපිළිතුර ප්‍රෝටෝන 13 ක් හා ඉලෙක්ට්‍රෝන 13 ක් ලෙස සමාන ගණන් ඇති අතර ඒවා යේආරෝපණ\nප්‍රතිවිරුද්ධ නිසා (නියුට්‍රෝන උදා සීනයි) (ල. 1)\n(iv) ධන ආරෝපිත න්‍ය ෂ්ටිය මගින් ආකර්ෂණය වුවත් ඉලෙක්ට්‍රෝන න්‍ය ෂ්ටිය මතට පතිත නොවන්නේ ඇයි?\n(ල. 1)\n\nපිළිතුර ඉලෙක්ට්‍රෝන න්‍ය ෂ්ටිය වටා ඉතා වේගයෙන් භ්‍රමණය වන නිසා (ල. 1)\n(v) රදර්ෆර්ඩ්ගේ ග්‍රහආකෘතිය තවදුරටත් විස්තර කරමින් නීල්ස් බෝර් ප්‍රකාශ කළේ කුමක් ද? (ල. 1)\n\nපිළිතුර ධන ආරෝපිත න්‍ය ෂ්ටිය වටා ඇති නිශ්චිත පථවල (කක්ෂවල / කවචවල) ඉලෙක්ට්‍රෝන චලනය වන\nබව (ල. 1)\n(B) (A) හි රූපයේ දැක්වෙන X පරමාණුව සඳහා,\n(i) පරමාණුක ක්‍රමාංකය ලියන්න. (ල. 1)\n\nපිළිතුර 13 (ල. 1)\n(ii) ස්කන්ධ ක්‍රමාංකය ගණනය කරන්න. (ල. 1)\n\nපිළිතුර 13 + 14 = 27 (ල. 1)\n(iii) පරමාණුක ක්‍රමාංකය හා ස්කන්ධ ක්‍රමාංකය සම්මත ආකාරයට දක්වමින් X ලියන්න. (ල. 1)\n\nපිළිතුර\n27\n13X (A ඉහළින්, Z පහළින්, සංකේතයේ වම් පස) (ල. 1)\n(C) පොටෑසියම්හි (K) පරමාණුක ක්‍රමාංකය 19 කි.\n(i) ඉලෙක්ට්‍රෝන වින්‍යාසය යනු කුමක් ද? (ල. 1)\n\nපිළිතුර පරමාණුවක න්‍ය ෂ්ටියේ සිට පිටතට පිළිවෙළින් එක් එක් ශක්ති මට්ටම්වල ඉලෙක්ට්‍රෝන පිරී ඇති\nආකාරය නිරූපණය කිරීම (ල. 1)\n(ii) K, L, M හා N ශක්ති මට්ටම්වල පැවතිය හැකි උපරිම ඉලෙක්ට්‍රෝන සංඛ්‍යා ලියන්න. (ල. 2)\n\nපිළිතුර K — 2, L — 8, M — 18, N — 32 (4 ම නිවැරදි නම් ල. 2 ; 2 – 3 ක් නම් ල. 1)\n(iii) M ශක්ති මට්ටමට ඉලෙක්ට්‍රෝන 18 ක් දැරිය හැකි වුවත් පොටෑසිය යන්න. (ල. 1)\n\nපිළිතුර R : කහ ආලෝකය දෙන විදුලි ලාම්පු / සෝඩියම් සයනයිඩ් (රන්, රිදී නිස්සාරණය) / Ti, Zr\nනිස්සාරණය / ඉන්ඩිගෝ සායම් ; X : මැග්නේ ලියම් (ගුවන් යානා, වාහන කොටස්) / මැග්නීසියම් ක්ෂීරය /\nකැපවෙන ලෝහය (දෙකම නිවැරදි නම් ල. 1)\n(C) දීර්ඝ ආකාරයේ ආවර්තිතා වගුවේ බෝරෝන් (B) සිට ඇස්ටටීන් (At) දක්වා පියගැ ට පෙළක් මෙන් රේඛාවක්\nඇඳ ඇත.\n(i) මෙම රේඛා ව අවට පිහිටි මූලද්‍රව්‍ය ලෝ හා ලෝහ ලෙස හඳුන්වන්නේ ඇයි? (ල. 1)\n\nපිළිතුර ඒවා ට ලෝහ හා අලෝහවලට අතරමැදි ගුණ ඇති නිසා (ල. 1)\n(ii) පරමාණුක ක්‍රමාංකය 1 – 20 අතර ඇති ලෝ හා ලෝහ දෙක නම් කර, ඒ එක එකක භාවිතයක් බැගින්\nලියන්න. (ල. 2)\n\nපිළිතුර\nසිලිකන් — ට්‍රා න්සිස්ටර / ඩයෝඩ / සූර්ය කෝෂ / පරිගණක උපාංග (ල. 1)\nබෝරෝන් — ලෝහ පෑස්සීම / චර්ම ආලේපන / ඉහළ උෂ්ණත්වවලට රත් කළ හැකි වීදුරු (ල. 1)\n(iii) සල්ෆර් වාතයේ දහනය කළ විට ලැබෙන දැල්ලේ වර්ණය හා සෑදෙන වායුව ද, සල්ෆර්වල කාර්මික\nභාවිතයක් ද ලියන්න. (ල. 2)\n\nපිළිතුර\nනිල් දැල්ලක් ; සල්ෆර් ඩයොක්සයිඩ් (SO2) (ල. 1)\nසල්ෆියුරික් අම්ලය නිපදවීම / රබර් වල්කනයිස් කිරීම / ගිනිකූරු, රතිඤ්ඤා, වෙඩි බෙහෙත් / දිලීර\nනාශක (ල. 1)\n(iv) දියමන්ති හා මිනිරන් කාබන්වල බහුරූපී ආකාර වේ.\n(a) බහුරූපී ආකාර යනු මොනවා ද? (ල. 1)\n\nපිළිතුර යම් මූලද්‍රව්‍ය යක් ස්වභාවයේපවතින විවිධ ස්වරූප (ල. 1)\n(b) අලෝහවල සාමාන්‍ය ගුණයකට ව්‍ය තිරේකයක් ලෙස මිනිරන් දක්වන ගුණයක් හා එම ගුණය නිසා\nමිනිරන්වලට ඇති භාවිතයක් ලියන්න. (ල. 1)\n\nපිළිතුර විද්‍යුත් සන්නායකයක් වීම — විදුලි කෝෂවල ඉලෙක්ට්‍රෝඩ සෑදීම (ල. 1)\n(D) තුන්වන ආවර්තයේ මූලද්‍රව්‍ය කිහිපයක ඔක්සයිඩ : Na2O, MgO, Al2O3, SiO2, SO3, Cl2O7\n(i) ආම්ලික හා භාස්මික ගුණ දෙකම දක්වන ඔක්සයිඩය කුමක් ද? එවැනි ඔක්සයිඩ හඳුන්වන නම කුමක්\nද? (ල. 1)\n\nපිළිතුර Al2O3; උභයගුණී ඔක්සයිඩ (ල. 1)\n(ii) ඉහත ඔක්සයිඩ අතුරින් ප්‍රබල භාස්මික ඔක්සයිඩයක් හා ප්‍රබල ආම්ලික ඔක්සයිඩයක් තෝරා ලියන්න.\n(ල. 1)\n\nපිළිතුර ප්‍රබල භාස්මික — Na2O ; ප්‍රබල ආම්ලික — SO3 හෝ Cl2O7(ල. 1)\n(iii) ආවර්තයක වමේ සිට දකුණට යන විට ඔක්සයිඩවල ස්වභාවය වෙනස් වන ආකාරය ලියන්න. (ල. 1)\n\nපිළිතුර භාස්මික ස්වභාවය අඩු වී ආම්ලික ස්වභාවය වැඩි වේ (ල. 1)\n(iv) අකුණු ගැසීමේ දී වාතයේ නයිට්‍රජන් හා ඔක්සිජන් සංයෝජනය වී සෑදෙන නයිට්‍රික් ඔක්සයිඩ් තවදුරටත්\ ා B පමණි.","B හා C පමණි.","A, B හා C සියල්ලම ය."],"a":3,"e":"B හා C සත්‍ය යි (ලුණු ජලයේ දිය වේ ; සහසංයුජ සීනි ද දිය වේ). A අසත්‍ය යි — කාමර උෂ්ණත්වයේ දී බොහෝ සහසංයුජ සංයෝග වායු හෝද්‍රව ය; ඝන ස්ඵටික දැලිස ලෙස බොහෝ විට පවතින්නේ අයනික සංයෝග ය."}],"range":[71,84]},"16":{"name":"පදාර්ථයේ වෙනස් වීම්","glance":["💡 ශ්‍රේ ණිශ්‍රේ යේඉහළට යන්න යන්න → ප්‍රතික්‍රියාව වේගවත් · පහළ ලෝහය එළවයි · නිස්සාරණය අමාරුයි","🔥 විභාගයට නිතරම"],"notes":["16.1 භෞ තික හා රසායනික විපර්යාස","📌 භෞ තික විපර්යාස (Physical changes) තිබෙන ද්‍රව්‍ය වෙනස් නොවී එහි භෞ තික අවස්ථාව (අංශුවල සැකැස්ම) පමණක් වෙනස් වී ඇත. එවැනි විපර්යාස භෞ තික විපර්යාස ලෙස හැඳින්වේ.","📌 රසායනික විපර්යාස (Chemical changes) තිබෙන ද්‍රව්‍ය වෙනස් වී නව ද්‍රව්‍ය සෑදී ඇත. එවැනි විපර්යාස රසායනික විපර්යාස හෙවත් රසායනික ප්‍රතික්‍රියා ලෙස හැඳින්වේ.","භෞ තික විපර්යාසය රසායනික විපර්යාසය","නව ද්‍රව්‍ය නැත · අංශුවල සැකැස්ම පමණක් වෙනස් ඇත · වෙනස් භෞ තික හා රසායනික ගුණ නිදසුන් ගල් කැඩීම (කැ ට → කුඩු) · ඉටි දිය වීම (ඝන → ද්‍රව) · ජලය වාෂ්ප වීම (ද්‍රව → වායු) · ජල වාෂ්ප ජල බිඳු වීම (වායු → ද්‍රව) දර දහනය (අළු, වායු) · හුණුගල් රත් කිරීම (CaO, වායු) · කොන්ඩිස් රත් කිරීම (O2) · යකඩ මල බැඳීම (මලකඩ) ක්‍රියාකාරකම කපුරු : රත් හැන්දේ ද්‍රව → වාෂ්ප → වසන සිසිල් හැන්දේ සුදු කුඩු (තුනී ඝන කපුරු ස්තරය) Mg දහනය : දීප්තිමත් සුදු දැල්ල, සුදු කුඩු · තනුක H2SO4 + NaOH : රත් වේ · Mg + H2SO4: බුබුළු, රත් වේ","💡 මතක ක්‍රමය : අලුත් ද්‍රව්‍ය යක් හැදුණොත් රසායනික · අවස්ථාව විතරක් මාරුවුණොත් භෞ තික","1 භෞ තික · රසායනික විපර්යාස භෞ තික → නව ද්‍රව්‍ය නැත රසායනික → නව ද්‍රව්‍ය සෑ දේ","2 ප්‍රතික්‍රියා වර්ග 4 එකතු → සංයෝජන · කැඩීම → වියෝජන එළවීම → ඒක · මාරුව → ද්විත්ව","3 රසායනික සමීකරණ දෙපස පරමාණු සමාන → තුලනය","සංගුණක පමණි · සූත්‍රයනො වෙනස්","4 ලෝහවල ප්‍රතික්‍රියතාව Na සිසිල් · Mg උණු · Zn, Fe හුමාලය","Zn + CuSO4 → Cu විස්ථාපනය","5 සක්‍රියතා ශ්‍රේ ණිශ්‍රේ ය","K Na Ca Mg Al · Zn Fe Sn Pb H · Cu Hg Ag Pt Au","6 ලෝහ නිස්සාරණය","ඉහළ → විද්‍යුත් විච්ඡේදනය","මැ ද → ඔක්සිහරණය · පහළ → භෞ තික","7 යකඩ · ධාරාඌෂ්මකය","Fe2O3 + 3CO → 2Fe + 3CO2 CaO + SiO2 → ලෝබොර (පාවේ)","8 H2 · O2· CO2 වායු H2 පොප් · O2 පුළිඟුව දැල්වේ CO2 → හුණුදියර කිරි පැහැ","• සක්‍රියතා ශ්‍රේ ණිශ්‍රේ යේපිළිවෙළ · H ට ඉහළ ලෝහ පමණක් තනුක අම්ලයෙන් H2 දෙයි","• Na + ජලය, Mg + උණු ජලය / හුමාලය, Zn / Fe + හුමාලය : නිරීක්ෂණ හා ඵල","• Zn + CuSO4 → නිල් පැහැ ය අඩු වී දුඹුරු Cu · Cu + ZnSO4 → වෙනසක් නැත","• සමීකරණ තුලනය හා ප්‍රතික්‍රියා වර්ගය හඳුනා ගැනීම H2, O2•, CO2 පිළියෙ ල කිරීම, එකතු කිරීම හා හඳුනා ගැනීම","• ධාරාඌෂ්මකය : CO මගින් Fe2O3 ඔක්සිහරණය · ලෝබොර සෑදීම රසායනික විපර්යාසයේසාක්ෂි : දැල්ලක් සහිතව දැවීම · රත් වීම · වායුබුබුළු · වර්ණ විපර්යාසය · අවක්ෂේපය","▸ ප්‍රතික්‍රියක (සහභාගි වන ද්‍රව්‍ය) → ඵල (ඇති වන නව ද්‍රව්‍ය) පදාර්ථයේ වෙනස් වීම්","16.1 රසායනික ප්‍රතික්‍රියා වර්ග හතර","📌 රසායනික සංයෝජන (Combination) මූලද්‍රව්‍ය - මූලද්‍රව්‍ය හෝමූලද්‍රව්‍ය - සංයෝග හෝ සංයෝග - සංයෝග හෝඑකතු වී නව සංයෝගයක් සෑදීම රසායනික සංයෝජන ප්‍රතික්‍රියාවක් ලෙස හැඳින්වේ.","📌 රසායනික වියෝජන (Decomposition) යම් සංයෝගයක් වියෝජනය වී වෙනත් සරල සංයෝග හෝමූලද්‍රව්‍ය හෝසංයෝග හා මූලද්‍රව්‍ය හෝබවට පත්වීම රසායනික වියෝජන ප්‍රතික්‍රියාවක් ලෙස හැඳින්වේ.","📌 ඒක විස්ථාපන (Single displacement) මූලද්‍රව්‍ය යක්, යම් සංයෝගයක පවතින මූලද්‍රව්‍ය යක් ඉන් විස්ථාපනය කරමින් ඊට හිමි ස්ථානය අත්කර ගෙන වෙනත් සංයෝගයක් සෑදීමේ ප්‍රතික්‍රියා ඒක විස්ථාපන ප්‍රතික්‍රියා නම් වේ.","📌 ද්විත්ව විස්ථාපන (Double displacement) යම් සංයෝගයක අඩංගු මූලද්‍රව්‍ය යක් හෝඅයන ඛණ්ඩයක් හෝවෙනත් සංයෝගයක අඩංගු මූලද්‍රව්‍ය යක් හෝඅයන ඛණ්ඩයක් සමග හුවමා රු වීමේ ප්‍රතික්‍රියාවක් ද්විත්ව විස්ථාපන ප්‍රතික්‍රියාවක් ලෙස හැඳින්වේ.","වර්ගය ආකාරය නිදසුන් (තුලිත) සංයෝජන A + B → C 2Mg + O2 → 2MgO · H2 + Cl2 → 2HCl · CO2 + C → 2CO · CaO + H2O → Ca(OH)2 වියෝජන (බොහෝ විට Δ) A → B + C 2KMnO4 → K2MnO4 + MnO2 + O2· CaCO3 → CaO + CO2 2Ag2O → 4Ag + O2· 2H2O2 → 2H2O + O2 ඒක විස්ථාපන A + BC → AC + B Zn + CuSO4 → ZnSO4 + Cu · Mg + CuSO4 → MgSO4 + Cu Mg + 2HCl → MgCl2 + H2· 2KBr + Cl2 → 2KCl + Br2 ද්විත්ව විස්ථාපන AB + CD → AD + CB BaCl2 + Na2SO4 → BaSO4 + 2NaCl · CaCl2 + Na2CO3 → CaCO3 + 2NaCl FeSO4 + 2NaOH → Fe(OH)2 + Na2SO4","💡 මතක ක්‍රමය : එකතු වෙයි · කැඩෙයි · එකෙක් එළවයි · දෙන්නා මාරුවෙයි","16.2 රසායනික සමීකරණ","📌 රසායනික සමීකරණය (Chemical equation) රසායනික සමීකරණයක් යනු, රසායනික ප්‍රතික්‍රියාවක් රසායනික සූත්‍ර භාවිතකර සංකේ තානුකූලව නිරූපණය කර දැක්වීමයි.","💡 මතක ක්‍රමය : සූත්‍රයට අත තියන්න එපා · ඉස්සරහට අංකය විතරයි","තුලනය · ස්කන්ධ ගණනය · පුහුණුව නිදසුන Al + HCl → AlCl3 + H2: Cl 3, H 2 → කු.පො.ගු. 6 → 6HCl, 3H2, 2AlCl3, 2Al → 2Al + 6HCl → 2AlCl3 + 3H2 Fe 56 · C 12 · O 16 Fe2O3 + 3CO → 2Fe + 3CO2 මවුල 1 3 2 3 M (g mol −1) 160 28 56 44 ස්කන්ධය 160 g 84 g 112 g 132 g ඵලය එකයි → සංයෝජන · ප්‍රතික්‍රියකය එකයි → වියෝජන · මූලද්‍රව්‍ය + සංයෝගය → ඒක විස්ථාපන · සංයෝග දෙකක හුවමා රුව → ද්විත්ව විස්ථාපන","🔥 නිරීක්ෂණ : Mg දහනය → දීප්තිමත් සුදු දැල්ල, සුදු කුඩු · KMnO4 රත් කිරීම → පුළිඟු කූර දැල්වේ (O2) · CuSO4 + Zn → නිල් පැහැ ය අඩු වේ, දුඹුරු Cu · BaCl2 + Na2SO4 → සුදු අවක්ෂේපය (BaSO4)","▸ වමට ප්‍රතික්‍රියක → දකුණට ඵල · අතරට + ස්කන්ධ සංස්ථිති නියමය → පරමාණු මැවීමක් / විනාශයක් නැත → දෙපස පරමාණු සංඛ්‍යාව සමාන කිරීම = තුලනය","▸ සංගුණක පමණි · සූත්‍රයවෙනස් නොකරයි (2MgO ✓ · MgO2 ✘) → සෝදිසි ක්‍රමය","🔥 තුලිත සමීකරණයෙන් පරමාණු අනුපාතය → ස්කන්ධ අනුපාත ගණනය (වචන සමීකරණයෙන් ✘)","▸ Δ රත් කිරීම · ⇌ ප්‍රතිවර්ත්‍ය (ඵලවලින් ප්‍රතික්‍රියක ද) · (s) ඝන · (l) ද්‍රව · (g) වායු · (aq) ජලීය","▸ 160 + 84 = 112 + 132 → ස්කන්ධ සංස්ථිතිය · Fe2O3 80 g → Fe 56 g, CO2 66 g","▸ 4Na + O2 → 2Na2O · 2H2 + O2 → 2H2O 4Al + 3O2 → 2Al2O3· N2 + 3H2 → 2NH3▸ Fe + S → FeS · Zn + H2SO4 → ZnSO4 + H2▸ 2Na + 2HCl → 2NaCl + H2· Ca + 2H2O → Ca(OH)2 + H2","▸ NaCl + AgNO3 → AgCl + NaNO3· 2Ag2CO3 → 4Ag + 2CO2 + O2","▸ Pb(NO3)2 + H2SO4 → PbSO4 + 2HNO3▸ Na2CO3 + 2HCl → 2NaCl + H2O + CO2▸","16.3 ලෝහවල ප්‍රතික්‍රියතාව ලෝහය වාතය (O2) ජලය තනුක HCl K, Na, Ca Na කැපුම් පෘෂ්ඨය ඉක්මනින් මලින වේ · දහනය : 4Na + O2 → 2Na2O සිසිල් ජලය සමඟ වේගයෙන් : 2Na + 2H2O → 2NaOH + H2 ප්‍රචණ්ඩයි (ස්ඵෝටනය, ගිනි ගැනීම) → විද්‍යා ගාරයේ ✘ Mg වාතයේ සැලකිය යුතු වෙනසක් නැත · දහනය : 2Mg + O2 → 2MgO සිසිල් ✘ · උණු : Mg + 2H2O → Mg(OH)2 + H2 · හුමාලය (වේගයෙන්) : Mg + H2O → MgO + H2 වේගයෙන් : Mg + 2HCl → MgCl2 + H2 Al, Zn Zn : රත් කළ විට අඳුරු → බොහෝ වේ තාව, සක්‍රියතා ශ්‍රේ ණිශ්‍රේ ය හා ප්‍රයෝජන ලකුණු 20","b":"(A) P, Q, R හා S යනු සෝඩියම් (Na), මැග්නීසියම් (Mg), යකඩ (Fe) හා කොපර් (Cu) යන ලෝහ හතර වේ (මෙම\nපිළිවෙළින් නොවේ). ඒවා ජලය හා තනුක හයිඩ්‍රො ක්ලෝරික් අම්ලය සමඟ දක්වන හැසිරීම වගුවේ දැක්වේ.\nලෝහය ජලය සමඟ තනුක HCl සමඟ\nP සිසිල් ජලය, උණු ජලය හා හුමාලය කිසිවක් සමඟ ප්‍රතික්‍රියා නොකරයි ප්‍රතික්‍රියා නොකරයි\nQ සිසිල් ජලය සමඟ වේගයෙන් ප්‍රතික්‍රියා කරයි ප්‍රචණ්ඩ ලෙස ප්‍රතික්‍රියා කරන නිසා\nපරීක්ෂා නොකළේ ය\nR සිසිල් ජලය සමඟ නිරීක්ෂණය කළ හැකි ප්‍රතික්‍රියාවක් නැත; උණු ජලය\nසමඟ වායුබුබුළු පිට වේ ; හුමාලය සමඟ වේගයෙන් ප්‍රතික්‍රියා කරයි\nවේගයෙන් වායුබුබුළු පිට වේ\nS සිසිල් හාඋණු ජලය සමඟ ප්‍රතික්‍රියා නොකරයි; රත් කළ විට හුමාලය\nසමඟ පමණක් ප්‍රතික්‍රියා කරයි\nසෙමින් වායුබුබුළු පිට වේ\n(i) P, Q, R හා S එක එකක් කුමන ලෝහය දැයි ලියන්න. (ල. 2)\n\nපිළිතුර P – Cu ; Q – Na ; R – Mg ; S – Fe (හතරම ල. 2; දෙකක් හෝතුනක් ල. 1)\n(ii) මෙම ලෝහ හතර ප්‍රතික්‍රියතාව අඩු වන පිළිවෙළට අක්ෂර භාවිතයෙන් සකසන්න. (ල. 1)\n\nපිළිතුර Q > R > S > P (Na > Mg > Fe > Cu) (ල. 1)\n(iii) රතු ලිට්මස් කැබැල්ලක් දැමූ ජල ද්‍රෝ ණිකාවකට Q හි කුඩා කැබැල්ලක් දැමූ විට ලිට්මස්වල සිදු වන\nවෙනස කුමක් ද? එයින් පැහැදිලි වන්නේ කුමක් ද? (ල. 2)\n\nපිළිතුර\nරතු ලිට්මස් නිල් පැහැ යට හැරේ (ල. 1).\nභාස්මික ද්‍රාවණයක් (සෝඩියම් හයිඩ්‍රො ක්සයිඩ්) සෑදී ඇති බව (ල. 1).\n(iv) R, (a) උණු ජලය (b) හුමාලය සමඟ දක්වන ප්‍රතික්‍රියා සඳහා තුලිත රසායනික සමීකරණ ලියන්න. (ල. 2)\n\nපිළිතුර\n(a) Mg + 2H2O → Mg(OH)2 + H2(ල. 1)\n(b) Mg + H2O → MgO + H2(ල. 1)\n(v) S, රත් කළ විට හුමාලය සමඟ දක්වන ප්‍රතික්‍රියාවට තුලිත රසායනික සමීකරණය ලියන්න. (ල. 1)\n\nපිළිතුර 3Fe + 4H2O ⇌ Fe3O4 + 4H2(→ ලෙස ලිවීම ද පිළිගැනේ) (ල. 1)\n(B) W, X හා Y ලෝහ තුනේ පිරිසිදු කැබලි, එම ලෝහවල ලවණ ද්‍රා වණවලට වෙන වෙනම දැමූ විට ලැබුණු\nප්‍රතිඵල වගුවේ දැක්වේ. (✓ – දැමූ ලෝහය මත ද්‍රාවණයේ ලෝහය තැන්පත් වේ ; ✘ – වෙනසක් නැත)\nදැමූ ලෝහය W හි ලවණ ද්‍රාවණය X හි ලවණ ද්‍රාවණය Y හි ලවණ ද්‍රාවණය\nW — ✓ ✘\nX ✘ — ✘\nY ✓ ✓ —\n(i) W, X හා Y ප්‍රතික්‍රියතාව අඩු වන පිළිවෙළට සකසා, ඊට පදනම් වූ මූලධර්මය ලියන්න. (ල. 2)\n\nපිළිතුර\nY > W > X (ල. 1)\nලෝහයකට එහි ලවණ ද් තුර Zn + 2HCl → ZnCl2 + H2(ල. 1)\n(iii) A හි පහළ කෙළවර අම්ල ද්‍රාවණයේ ගිලී තිබිය යුත්තේ ඇයි? (ල. 1)\n\nපිළිතුර නැතිනම් නිපදවෙන වායුව තිසල් පුනීලය හරහා පිට වී යන නිසා (ල. 1).\n(iv) මෙහි භාවිත කර ඇති වායු එකතු කිරීමේ ක්‍රමය නම් කර, එම ක්‍රමයට එම නම ලැබීමට හේතුව\nලියන්න. (ල. 2)\n\nපිළිතුර\nජලයේ යටිකුරු විස්ථාපන ක්‍රමය (ල. 1)\nවායු සරාවට වායුව ඇතුළු වන විට එහි ඇති ජලය පහළට තල්ලු වී ඉවත් වන නිසා (ල. 1)\n(B) (A) හි ඇටවුමෙන් එකතු කළ හයිඩ්‍රජන් වායුව හා, පොටෑසියම් පර්මැංගනේට් (KMnO4) රත් කර ජලයේ\nයටිකුරු විස්ථා පනයෙන් එකතු කළ ඔක්සිජන් වායුව සලකන්න.\n(i) හයිඩ්‍රජන් වාතයේ යටිකුරු විස්ථාපන ක්‍රමයෙන් ද එකතු කර ගත හැකි වන්නේ එහි කුමන ගුණය නිසා\nද? (ල. 1)\n\nපිළිතුර සාමාන්‍ය වාතයට වඩා ඝනත්වයෙන් අඩු (සැහැල්ලු) නිසා (ල. 1).\n(ii) එකතු කළ වායුව හයිඩ්‍රජන් බව තහවුරු කිරීමට කළ හැකි පරීක්ෂාව හා නිරීක්ෂණය ලියන්න. (ල. 1)\n\nපිළිතුර වායුව අඩංගු නළයට දැල්වෙන ඉරටුවක් ඇතුළු කළ විට 'පොප්' හඬක් නංවමින් වායුව දහනය වේ\n(ල. 1).\n(iii) KMnO4 රත් කර ඔක්සිජන් පිළියෙ ල කිරීමට (A) හි ඇටවුමේ කේතු ප්ලාස්කුව හා තිසල් පුනීලය වෙනුවට\nයොදා ගත යුත්තේ කුමන උපකරණ ද? ඒ ඇයි? (ල. 2)\n\nපිළිතුර\nකැකෑරුම් නළයක් හා (බන්සන්) දා හකයක් (ල. 1)\nඝන ප්‍රතික්‍රියකයක් රත් කළ යුතු නිසා / ද්‍රව ප්‍රතික්‍රියකයක් එකතු කිරීමට අවශ්‍ය නැති නිසා (ල. 1)\n(iv) KMnO4 රත් කිරීමට අදාළ තුලිත රසායනික සමීකරණය ලියන්න. (ල. 1)\n\nපිළිතුර 2KMnO4 → K2MnO4 + MnO2 + O2(ල. 1)\n(v) විද්‍යා ගාරයේ දී ඔක්සිජන් ලබා ගත හැකි වෙනත් ප්‍රතික්‍රියාවක් සඳහා තුලිත සමීකරණයක් ලියන්න. (ල. 1)\n\nපිළිතුර 2KClO3 → 2KCl + 3O2/ 2KNO3 → 2KNO2 + O2/ 2H2O2 → 2H2O + O2(ඕනෑ ම එකක් — ල. 1)\n(vi) එකතු කළ වායුව ඔක්සිජන් බව හඳුනා ගන්නා ආකාරය ලියන්න. (ල. 1)\n\nපිළිතුර පුළිඟු කූරක් නළය තුළට ඇතුළු කළ විට එය නැවත දීප්තිමත්ව දැල්වේ (ල. 1).\n(C) බිත්තර කටුකැබලි (CaCO3) තනුක හයිඩ්‍රො ක්ලෝරික් අම්ලය සමඟ ප්‍රතික්‍රියාකරවා කාබන් ඩයොක්සයිඩ්\nවායුව පිළියෙ ල කරන ලදී.\n(i) මෙහි දී සිදු වන ප්‍රතික්‍රියාවට තුලිත රසායනික සමීකරණය ලියන්න. (ල. 1)\n\nපිළිතුර CaCO3 + 2HCl → CaCl2 + H2O + CO2(ල. 1)\n(ii) කාබන් ඩයොක්සයිඩ් අඩංගුනළයකට දැල්වෙන ඉරටුවක් ඇතුළු කළ විට නිරීක්ෂණය කුමක් ද? එයින්\nපෙනෙන CO2 හි "▸ ද්‍රවයේ බර නිසා → පතුලට පමණක් නොව බිත්තිවලටත් පීඩනය","🔥හැඩය, පරිමාව, පතුලේ වර්ගඵලය නොබලපා යි → එකම ගැඹුර + එකම ද්‍රවය = එකම පීඩනය","▸ වේ ල්ලක පාමුල ඝනකම් → ගැඹුරේ පීඩනය වැඩි නිසා","▸ මේ මත සාදා ඇති යන්ත්‍ර → ද්‍රාව පීඩක යන්ත්‍ර F2 = F1 × A2 A1 → වර්ගඵල අනුපාතයෙන් බලය වැඩි වේ 🔥 කුඩා බලයෙන් විශාල බලයක් · නමුත් කුඩා පිස්ටනය ඉතා විශාල දුරක් යායුතුයි","▸ ද්‍රව කඳේබර නිසා පීඩනය → ගණනයේ දී නොසලකයි (පිස්ටන බල ඉතා විශාලයි)","▸ තිරිංග : දාස සිලින්ඩරයේ හරස්කඩ වර්ගඵලය වැඩි → පාදයෙන් යොදන බලයට වඩා වැඩි බලයක් රෝධක පලු මත","▸ වායු නිසා පීඩනය ඇති වන ආකාර 2 :","▸ ① වායු කඳක බර → වායුගෝලීය පීඩනය","② සම්පීඩිත වාතය ප්‍රසාරණය වීමට ගන්නා උත්සාහය → බැලුනය","▸ U නළය : බැලුනය X ට සවි කළ විට X පහළට · Y ඉහළට → බැලුනයේ වාතයේ පීඩනය වැඩි","▸ රසදිය වායු පීඩනමානය (Mercury barometer) ≈ 76 cm රික්තය","නිදසුන 76 cm Hg → P = 0.76 × 13 600 × 10 = 103 360 Pa (≈ 1 × 10","5 Pa) · සමාන ජල කඳ h = 103 360 1000 × 10 = 10.336 m එදිනෙ දා කටයුතුවල දී වායුගෝලීය පීඩනය","යෙදීම ක්‍රියාව බටයෙන් බීම උරන විට බටය තුළ පීඩනය අඩු → පිටත ද්‍රව පෘෂ්ඨය මත වායුගෝලීය පීඩනය ද්‍රවය බටය තුළට තල්ලු කරයි","සයිෆනය (siphon) නළය ජලයෙන් පුරවා කෙළවර වසා A පතුලට ආසන්නයට → A කෙළවරේ = වායුගෝලීය + ජල කඳේපීඩනය · B කෙළවරේ = වායුගෝලීය පීඩනය → ජලය A → B රබර් චූෂකය (rubber sucker) තද කළ විට වාතය ඉවත් → ඇතුළත පීඩනය අඩු → පිටත වායුගෝලීය පීඩනය තද කරයි · දාරයෙන් වාතය ඇතුළු නොවිය යුතුයි","💡 මතක ක්‍රමය : උරන්නේ අපි · තල්ලු කරන්නේ වායුගෝලය","15.5 ඉපිලීම · උඩුකුරු තෙරපුම · ආකිමිඩිස් මූලධර්මය","📌 උඩුකුරු තෙරපුම (Upthrust) ජලයේ ගිලෙන වස්තුවක වුව ද, ජලය තුළ දී අපට දැනෙන බර වාතයේ දී එහි බරට වඩා අඩු වේ. මෙසේ වන්නේ ජලයේ ගිල්වා ඇති වස්තුවක් මත ජලය මගින් ඉහළට බලයක් යොදන නිසා ය. මෙම බලය උඩුකුරු තෙරපුම (upthrust) නමින් හැඳින්වේ.","උඩුකුරු තෙරපුම = වාතයේ දී බර − දෘශ්‍ය බර","📌 ආකිමිඩිස් මූලධර්මය (Archimedes' principle) වස්තුවක් තරලයක් තුළ අර්ධ වශයෙන් හෝපූර්ණ වශයෙන් හෝගිලී ඇති විට, එය මත ක්‍රියා කරන උඩුකුරු තෙරපුම වස්තුව මගින් විස්ථාපිත තරලයේ බරට සමාන වේ.","ඝනකය තරාදිය තෙරපුම විස්ථාපිත ජලයේ බර පෘෂ්ඨය ආසන්නයේ 1.2 0 0 අඩක් ගිලී 0.9 0.3 0.3 මුළුමනින් ගිලී (ඉහළ / පහළ) රු තුනක් ද, Q බෝතලයේ ඉහළ සිට පහළට සිදුරු තුනක් ද විද, ඒවා ජලයෙන් පුරවා\nගත්තේ ය.\nP Q\n(i) පීඩනය අර්ථ දක්වන්න. ‘පීඩනය 1 Pa’ යන්නෙ හි තේරුම කුමක් ද? පීඩනය අදිශ රාශියක් ලෙස\nසැලකෙන්නේ ඇයි? (ල. 3)\n\nපිළිතුර\nඒකක වර්ගඵලයක් මත ක්‍රියා කරන (අභිලම්බ) බලය (ල. 1).\n1 m2 වර්ගඵලයක් මත 1 N බලයක් ක්‍රියා කරන විට ඇති වන පීඩනය — 1 Pa = 1 N m−2(ල. 1).\nපීඩනයට විශා ලත්වයක් පමණක් ඇති නිසා (දිශාවක් නැත) (ල. 1).\n(ii) P බෝතලයේ සිදුරු වලින් ජලය පිට වන ආකාරය විස්තර කර, එයින් ද්‍රව පීඩනය පිළිබඳ ව ලැබෙන\nනිගමනය ලියන්න. (ල. 2)\n\nපිළිතුර\nසියලු සිදුරු වලින් පිට වන ජල පහර එකම තිරස් දුරක් ගමන් කරයි (ල. 1).\nද්‍රවයක සම මට්ටම්වල දී පීඩන සමාන වේ (ල. 1).\n(iii) Q බෝතලයේ සිදුරු වලින් ජලය පිට වන ආකාරය විස්තර කර, එයින් ලැබෙන නිගමනය ලියන්න. (ල. 2)\n\nපිළිතුර\nපහළ සිදුරු වලින් ජලය ඉහළ සිදුරුවලට වඩා වැඩි වේ ගයකින් (වැඩි දුරකට) විදී (ල. 1).\nගැඹුර (ද්‍රව කඳේඋස) වැඩි වන විට ද්‍රව පීඩනය වැඩි වේ (ල. 1).\n(iv) ද්‍රවයක් නිසා ඇති වන පීඩනය සෑම දිශා වකටම බලපාන බව පෙන්වීමට සරල ක්‍රියාකා රකමක් කෙටියෙන්\nලියන්න. (ල. 1)\n\nපිළිතුර පොලිතීන් උරයක වටේතැනින් තැන සිදුරු සාදා ජලය පුරවා අල්ලා ගත් විට සෑම සිදුරකින්ම (සෑම\nදිශා වකටම) ජලය පිට වේ (ල. 1).\n(v) ඝනත්වය ρ වූ ද්‍රවයක් h උසට පුරවා ඇති භාජනයක පතුලේ ඒකක වර්ගඵලයකට ඉහළින් ඇති ද්‍රව කඳ\nසලකා, පතුලේ පීඩනය P = hρg බව පෙන්වන්න. (ල. 2)\n\nපිළිතුර\nද්‍රව කඳේපරිමා ව = 1 × h ⇒ ස්කන්ධය = ඝනත්වය × පරිමාව = ρ × 1 × h = hρ (ල. 1)\nබර = hρg ⇒ පීඩනය = බර\nවර්ගඵලය\n=\nhρg\n1\n= hρg (ල. 1)\n(vi) පතුලේ වර්ගඵලය 2.5 m2 වූ ජල ටැංකියක ජලය 80 cm උසට පුරවා ඇත. (ජලයේ ඝනත්වය\n1000 kg m−3, g = 10 m s⁻²\n)\n(a) ටැංකියේ පතුලේ ජලය නිසා ඇති වන පීඩනය ගණනය කරන්න. (ල. 2)\n\nපිළිතුර P = hρg = 0.80 m × 1000 kg m−3 × 10 m s⁻²\n(ල. 1) = 8000 Pa (ල. 1)\n(b) ජලය නිසා ටැංකියේ පතුල මත ක්‍රියා කරන බලය සොයන්න. (ල. 1)\n\nපිළිතුර F = PA = 8000 Pa × 2.5 m2 = 20 000 N (ල. 1)\nභෞ තික විද්‍යාව · 10 ශ්‍රේණිය II කොටස ·\n(B) රථ වාහනයක තිරිංග පද්ධතියක මූලධර්මය රූපයේ දැක්වේ. පදිකය තද කළ විට X සිලින්ඩරයේ පිස්ටනය\nමත 120 N බලයක් යෙදේ. X හි පිස්ටනයේ හරස්කඩ වර්ගඵලය 2 cm2 ද, Y හි පිස්ටනයේ හරස්කඩ\nවර්ගඵලය 6 cm2 ද වේ.\nබලය\nපදිකය\nතෙල්\nX\nY\nරෝධක පලුව\nරෝධක\nතැටිය\n(i) X හා Y සිලින්ඩර නම් කරන්න. (ල. 1)\n\nපිළිතුර X — ප්‍රධාන සිලින්ඩරය (master cylinder); Y — දාස සිලින්ඩරය (slave cylinder) (ල. 1)\n(ii) X සිට Y දක්වා පීඩනය සම්ප්‍රේ ෂප්‍රේණය කිරීමට තෙල් වැනි ද්‍රවයක් යොදා ගත හැක්කේ ද්‍රවවල කුමන\nගුණය නිසා ද? (ල. 1)\n\nපිළිතුර බල යෙදූ විට ද්‍රව සම්පීඩනයට භාජන නොවන නිසා — එක් තැනකට යොදන පීඩනය ද්‍රවය තුළින්\nතවත් තැනකට සම්ප්‍රේ ෂප්‍රේණය වේ (ල. 1).\n(iii) X හි තෙල් මත ඇති වන පීඩනය පැස්කල්වලින් ගණනය කරන්න. (ල. 2)\n\nපිළිතුර P =\nF\nA\n=\n120 N\n2 × 10⁻⁴ m2\n(ල. 1) = 6 × 10\n5 Pa (ල. 1)\n(iv) Y මගින් රෝධක පලුව මත යෙදෙන බලය ගණනය කරන්න. (ල. 1)\n\nපිළිතුර F = PA = 6 × 10\n5 Pa × 6 × 10−4 m2 = 360 N (ල. 1)\n(v) X මත යෙදෙන බලයට වඩා වැඩි බලයක් රෝධක පලුව මත ඇති වන්නේ ඇයි? (ල. 1)\n\nපිළිතුර Y (දාස සිලින්ඩරය) හි හරස්කඩ වර්ගඵලය X (ප්‍රධාන සිලින්ඩරය) හි වර්ගඵලයට වඩා වැඩි නිසා —\nඑකම පීඩනය වැඩි වර්ගඵලයක් මත ක්‍රියා කරයි (ල. 1).\n(vi) සේ වාස්ථානවල රථ එසවීමට යොදන ඔසවනවල (hoist) කුඩා පිස්ටනය වෙනුවට කොම්ප්‍රෙ සප්‍රෙරයක්\nභාවිත කරන්නේ ඇයි? (ල. 1)\n\nපිළිතුර රථයක් එසවීමට අවශ්‍ය බලය ලබා දීමට කුඩා පිස්ටනය ඉතා විශාල දුරක් චලනය කළ යුතු නිසා\n(එය ප්‍රායෝගිකව අපහසු නිසා), කුඩා සිලින්ඩරයට තෙල් පොම්ප කිරීමට කොම්ප්‍රෙ සප්‍රෙරයක් යොදයි (ල. 1)."},{"t":"ව්‍යුහගත රචනා ප්‍රශ්නය 2 15.4 වායු පීඩනය : රසදිය වායු පීඩනමානය ලකුණු 10","b":"ටොරිසෙල්ලි භාවිත කළ ආකාරයේ රසදිය වායු පීඩනමානයක් රූපයේ දැක්වේ. කඳුකර ප්‍රදේශයක පිහිටි පාසලක දී\nමෙ ය සකස් කළ විට රසදිය කඳේසිරස් උස (h) 70 cm විය. A ලක්ෂ්‍ය ය නළය තුළ ද, B ලක්ෂ්‍ය ය බඳුනේ රසදිය\nපෘෂ්ඨය මත ද එකම මට්ටමේ පිහිටයි. (රසදියේ ඝනත්වය 13 600 kg m−3, ජලයේ ඝනත්වය 1000 kg m−3, g =\n10 m s⁻²\n)\nh\nX\nA\nB\nරසදිය\n(i) X ලෙස දැක්වෙන නළයේ ඉහළ අවකාශයේඇත්තේ කුමක් ද? (ල. 1)\n\nපිළිතුර රික්තය (රික්තකය) — නළය යටිකුරු කළ පසුඑයට වාතය ඇතුළු විය නොහැකි නිසා (ල. 1).\n(ii) නළයේ ඇති රසදිය සියල්ල ම බඳුනට ගලානොයන්නේ ඇයි? (ල. 1)\n\nපිළිතුර බඳුනේ නිරාවරණය වූ රසදිය පෘෂ්ඨය වායුගෝලීය පීඩනය මගින් තද කරගෙන සිටින නිසා (වායුගෝලීය\nපීඩනය මගින් රසදිය කඳ දරාසිටින නිසා) (ල. 1).\n(iii) A ලක්ෂ්‍ය යේපීඩනය වායුගෝලීය පීඩනයට සමාන වන් ි.","නිදසුන ශ්‍රේ ණිශ්‍රේ : 2 + 3 + 5 = 10 Ω → 5 V යෙදූ විට I = 5 10 = 0.5 A → 5 Ω හරහා V = 2.5 V නිදසුන සමාන්තර : 12 Ω හා 6 Ω, 6 V → 1 R = 1 12 + 1 6 = 3 12 → R = 4 Ω · I = 6 4 = 1.5 A = 0.5 A (12 Ω) +","1 A (6 Ω) අමතර දැනුමට : විදුලිය භාවිතයේ දී ආරක්ෂාව","📌 විද්‍යුත් කම්පනය / විදුලි සැර වැදීම (Electric shock) මිනිස් සිරුර හරහා ඉලෙක්ට්‍රෝන ගලායෑමක් සිදු වූ විට විද්‍යුත් කම්පන ඇති වේ.","අවස්ථාව සැර? හේතුව රැහැනක පා ද දෙකම තබා සිටින කුරුල්ලා නැත ස්ථාන දෙක එකම විභවයේ → විභව අන්තරයක් නැත පාවහන් නැතිව පොළො වේ සිට සජීවී රැහැන අල්ලන කෙනා ඔව් රැහැන හා පොළොව අතර විභව අන්තරය → සංවෘත පරිපථය → පා ද හරහා භූගත වේ","💡 මතක ක්‍රමය : තනි රැහැනක් ඇල්ලුවත් සැර වදිනවා → පොළොව තමයි දෙවැනි රැහැන."],"essays":[{"t":"රචනා ප්‍රශ්නය 1 19.1–19.3 ස්ථිති විද්‍යුතය, විද්‍යුත් ධාරා ව, විභව අන්තරය ලකුණු 20","b":"(A) හිසකෙස්වල හොඳින් පිරිමැදි ප්ලා ස්ටික් පනාවක් ඉතා කුඩා කඩදාසි කැබලි අසලට ගෙන ගිය විට ඒවා\nපනාවට ආකර්ෂණය විය. හිසකෙස්වල පිරිනො මැදි පනාවකට ඒවා ආකර්ෂණය නොවීය.\n(i) පිරිමැදි පනාව කඩදාසි කැබලි ආකර්ෂණය කළේ ඇයි? (ල. 1)\n\nපිළිතුර පිරිමැදීමේ දී පනා වේ පෘෂ්ඨය මත ස්ථිති විද්‍යුත් ආරෝපණ හට ගැනීම (පනාව ආරෝපණය වීම)\nනිසා.\n(ii) ස්ථිති විද්‍යුතය යනු කුමක් ද? (ල. 1)\n\nපිළිතුර පරිවාරක ද්‍රව්‍ය වල පෘෂ්ඨ මත රඳාපවතින, ගලානොයන විද්‍යුත් ආරෝපණ.\n(iii) ස්ථිති විද්‍යුතයට අමතරව, විද්‍යුතයේ අනෙක් මූලික ආකාරය කුමක් ද? (ල. 1)\n\nපිළිතුර ධාරා විද්‍යුතය.\n(iv) පොලිතින්වලින් පිරිමැදි PVC දණ්ඩක්, එක් අග්‍රයක් පොළොවට සම්බන්ධ කළ නියොන් බල්බයක අනෙක්\nඅග්‍රයේ ස්පර්ශ කළ විට බල්බය දැල්විණි.\n(a) බල්බය දැල්වීමට හේතුව පැහැදිලි කරන්න. (ල. 2)\n\nපිළිතුර PVC දණ්ඩ මත රැස් වූ (ගබඩා වූ) ස්ථිති විද්‍යුත් ආරෝපණ, බල්බය හරහා පොළොවට ගලා\nයාම (ල. 1). ආරෝපණ ගලායාම විද්‍යුත් ධාරාවක් වන අතර, එය බල්බය හරහා ගලන නිසා බල්බය\nදැල්වේ (ල. 1).\n(b) ‘විද්‍යුත් ධාරා ව’ යන්න අර්ථ දක්වන්න. (ල. 1)\n\nපිළිතුර සන්නායකයක් තුළින් ගලායන විද්‍යුත් ආරෝපණ ධාරාවක් විද්‍යුත් ධාරා ව ලෙස හැඳින්වේ.\n(B) වියළි කෝෂ දෙකකින් යුත් බැටරියක්, ස්විච්චයක් (S) හා බල්බයක් තඹ කම්බිවලින් ශ්‍රේ ණිශ්‍රේගතව සම්බන්ධ\nකර සරල පරිපථයක් සකසා ඇත.\n(i) තඹ කම්බි විද්‍යුතය හොඳින් සන්නයනය කරන්නේ ඇයි? (ල. 1)\n\nපිළිතුර තඹ තුළ මුක්ත (නිදහස්) ඉලෙක්ට්‍රෝන විශාල සංඛ්‍යාවක් පවතින නිසා.\n(ii) ‘මුක්ත ඉලෙක්ට්‍රෝන’ යනු මොනවා ද? (ල. 1)\n\nපිළිතුර ලෝහ පරමාණුවල බාහිරම කවචයෙන් ඉවත් වී, පරමාණු (ලෝහ අයන) අතර අවකාශයේඅහඹු\nලෙස සැරිසරන ඉලෙක්ට්‍රෝන.\n(iii) S වසා ඇති විට කම්බි තුළ පහත දිශා, බැටරියේ අග්‍ර ඇසුරෙන් ලියන්න.\n(a) ඉලෙක්ට්‍රෝන ගලන දිශාව (ල. 1)\n\nපිළිතුර බැටරියේ ඍණ (−) අග්‍රයේ සිට බාහිර පරිපථය හරහා ධන (+) අග්‍රයදක්වා.\n(b) සම්මත ධාරා වේ දිශාව (ල. 1)\n\nපිළිතුර බැටරියේ ධන (+) අග්‍රයේ සිට බාහිර පරිපථය හරහා ඍණ (−) අග්‍රයදක්වා (ඉලෙක්ට්‍රෝන ගලන\nදිශාවට ප්‍රතිවිරුද්ධව).\n(iv) ඉලෙක්ට්‍රෝන එම දිශාවට ගලායන්නේ ඇයි? (ල. 1)\n\nපිළිතුර බැටරියේ ඍණ අග්‍රයඉලෙ ක්ට්‍රෝන විකර්ෂණය කරන (පළවාහරින) අතර ධන අග්‍රයඉලෙ ක්ට්‍රෝන\nආකර්ෂණය කරන නිසා.\nභෞ තික විද්‍යාව · 10 ශ්‍රේණිය II කොටස ·\n(v) බල්බය හරහා ගලන ධාරා ව මැනීමට ඇමීටරයක් ද, බල්බයේ දෙකෙළවර විභව අන්තරය මැනීමට\nවෝල්ට්මීටරයක් ද සම්බන්ධ කළ විට ලැබෙන පරිපථ සටහන, සම්මත සංකේත භාවිතයෙන් අඳින්න.\n(ල. 2)\n\nපිළිතුර\nඇමීටරය බැටරිය, ස්විච්චය හා බල්බය සමඟ ශ්‍රේ ණිශ්‍රේගතව — මුළු ධාරා වම ඇමීටරය හරහා ගලන සේ\n(ල. 1).\nවෝල්ට්මීටරය බල්බයේ දෙකෙළවරට සමාන්තරගතව (ල. 1). (මීටරවල + අග්‍රයබැටරියේ + අග්‍රය\nපැත්තට; සම්මත සංකේත අපේක්ෂිතයි.)\n(C) එක එකක විද්‍යුත්ගාමක බලය 1.5 V වූ සර්වසම වියළි කෝෂ දෙකක්, බල්බයකට සම්බන්ධ කළ ආකාර\nදෙකක් X හා Y රූපවල දැක්වේ. X හි බල්බය දැල්වෙන නමුත් Y හි බල්බය නොදැල්වේ.\nV\nA\n+ −+ −\nX\nV\nA\n+ −+ −\nY\n(i) විභව අන්තරය යනු කුමක් ද? එය මනින ඒකකය ලියන්න. (ල. 2)\n\nපිළිතුර විදුලි ප්‍රභවය මගින් ඉලෙක්ට්‍රෝන ඍණ අග්‍රයේ සිට සන්නායකය හරහා ධන අග්‍රයදක්වා තල්ලු\nකිරීම නිසා, පරිපථයේ ලක්ෂ්‍ය දෙකක් අතර ඇති වන විද්‍යුත් පීඩන අන්තරය (ල. 1). ඒකකය වෝල්ටය (V)\n(ල. 1).\n(ii) කෝෂයක ‘විද්‍යුත්ගාමක බලය’ යනු කුමක් ද? (ල. 1)\n\nපිළිතුර කෝෂයේ ඍණ අග්‍රයෙන් බාහිර පරිපථයට ඉලෙක්ට්‍රෝන පළවාහරින බලය / කෝෂයෙන් ධාරාවක්\nලබා නොගන්නා විට එහි අග්‍ර දෙක අතර විභව අන්තරය.\n(iii) Y හි වෝල්ට්මීටරයේ හා ඇමීටරයේ පාඨාංක කුමක් විය හැකි ද? (ල. 1)\n\nපිළිතුර දෙකම ශූන්‍ය යි (0 V හා 0 A).\n(iv) Y හි බල්බය නොදැල්වීමට හේතුව පැහැදිලි කරන්න. (ල. 2)\n\nපිළිතුර කෝෂ දෙක එකිනෙකට ප්‍රත රතිරෝධය කෙරෙ හි බලපාන සාධක තුන ලියන්න. (ල. 1)\n\nපිළිතුර හරස්කඩ වර්ගඵලය, දිග හා සන්නායකය සෑදී ඇති ද්‍රව්‍ය ය (තුනම).\n(ii) කම්බියේ දිග ප්‍රතිරෝධයට බලපාන ආකාරය සෙවීමට යොදා ගත යුතු කම්බි දෙක කුමක් ද? ඒ දෙකෙන්\nවැඩි ඇමීටර පාඨාංකයක් ලැබෙන්නේ කුමන කම්බියෙන් ද? (ල. 2)\n\nපිළිතුර P හා Q (ල. 1). Q — දිග අඩු නිසා ප්‍රතිරෝධය අඩු වී වැඩි ධාරාවක් ගලයි (ල. 1).\n(iii) P හා R සැසඳීමේ දී R සමඟ වැඩි ඇමීටර පාඨාංකයක් ලැබිණි. මෙයින් ලැබෙන නිගමනය කුමක් ද?\n(ල. 1)\n\nපිළිතුර හරස්කඩ වර්ගඵලය වැඩි වන විට ප්‍රතිරෝධය අඩු වේ.\n(iv) P හා S කම්බිවල දිග හා හරස්කඩ වර්ගඵලය සමාන වුවත් ඒවා තුළින් ගලන ධාරා අසමාන ය.\n(a) ඊට හේතුව කුමක් ද? (ල. 1)\n\nපිළිතුර නික්‍රෝම් හා තඹ යන ලෝහ දෙකේ ‘ප්‍රතිරෝධකතාව’ නම් ගුණය වෙනස් නිසා ඒවා යේප්‍රතිරෝධ\nවෙනස් වේ.\n(b) මෙම සැසඳීමේ දී කම්බි දෙකේ දිග හා හරස්කඩ වර්ගඵලය සමාන විය යුත්තේ ඇයි? (ල. 1)\n\nපිළිතුර ද්‍රව්‍ය යේබලපෑම පමණක් සොයා ගැනීමට — ප්‍රතිරෝධයට බලපාන අනෙක් සාධක (දිග,\nහරස්කඩ වර්ගඵලය) නියතව තබා ගත යුතු නිසා.\n(C) නික්‍රෝම් කම්බි දඟරයක ප්‍රතිරෝධය 30 Ω වේ. (උෂ්ණත්වය නියත යැයි සලකන්න.)\n(i) එය හරහා 0.2 A ධාරාවක් ගැලීමට එහි දෙකෙළවර යෙදිය යුතු විභව අන්තරය ගණනය කරන්න. (ල. 2)\n\nපිළිතුර V = IR = 0.2 A × 30 Ω (ල. 1) = 6 V (ල. 1)\n(ii) එම දඟරය 9 V සැපයුමකට සම්බන්ධ කළ විට ඒ තුළින් ගලන ධාරා ව ගණනය කරන්න. (ල. 2)\n\nපිළිතුර I =\nV\nR\n=\n9 V\n30 Ω\n(ල. 1) = 0.3 A (ල. 1)\n(iii) ඕම් එකක (1 Ω) ප්‍රතිරෝධය අර්ථ දක්වන්න. (ල. 1)\n\nපිළිතුර සන්නායකයක දෙකෙළවරට 1 V විභව අන්තරයක් යෙදූ විට ඒ තුළින් 1 A ධාරාවක් ගලයි නම්, එම\nසන්නා යකයේ ප්‍රතිරෝධය 1 Ω වේ."},{"t":"ව්‍යුහගත රචනා ප්‍රශ්නය 3 19.6 ප්‍රතිරෝධක, වර්ණ කේත ක්‍රමය, LDR ලකුණු 10","b":"රූපයේ දැක්වෙන්නේ වර්ණ පටි හතරක් සහිත ස්ථිර ප්‍රතිරෝ ධකයකි. (සමීප පටි තුන වම් පසට ඇත.)\nකහ දම් රතු රන්\n(i) ප්‍රතිරෝධකයේ අගය ගණනය කරන්න. (ල. 2)\n\nපිළිතුර කහ = 4, දම් = 7, රතු ⇒ × 10\n2\n(ල. 1); අගය = 47 × 100 = 4700 Ω (4.7 kΩ) (ල. 1)\n(ii) එහි සහන අගය කොපමණ ද? ප්‍රතිරෝ ධකයට තිබිය හැකි සත්‍ය අගය පරාසය ගණනය කරන්න. (ල. 2)\n\nපිළිතුර රන් ⇒ සහන අගය ±5% (ල. 1). 4700 ×\n5\n100\n= 235 Ω ⇒ පරාසය (4700 − 235) Ω – (4700 + 235) Ω =\n4465 Ω – 4935 Ω (ල. 1)\n(iii) ස්ථිර ප්‍රතිරෝධක නිපදවන එක් ක්‍රමයක් ලියන්න. (ල. 1)\n\nපිළිතුර පරිවාරක ද්‍රව්‍ය යක් මත තුනී කාබන් පටලයක් තැන්පත් කිරීම / නික්‍රෝම් වැනි ප්‍රතිරෝධකතාව ඉහළ\nකම්බියක් එතීම.\n(iv) වියළි කෝෂ දෙකක්, ස්විච්චයක් හා කුඩා විදුලි පන්දම් බල්බයක් සහිත පරිපථයකට 5 Ω, 10 Ω හා 20 Ω\nප්‍රතිරෝධක එකින් එක ශ්‍රේ ණිශ්‍රේගතව සම්බන්ධ කරන ලදී. ප්‍රතිරෝධක අගය වැඩි කරන විට බල්බයේ දීප්තිය\nවෙනස් වන ආකාරය හේතු සහිතව ලියන්න. (ල. 2)\n\nපිළිතුර බල්බයේ දීප්තිය අඩු වේ (ල. 1). පරිපථයේ ප්‍රතිරෝධය වැඩි වන විට (විභව අන්තරය නියත නිසා V = IR\nඅනුව) ගලන ධාරා ව අඩු වන නිසා (ල. 1).\n(v) රාත්‍රියේ ඉබේම දැල්වෙන වීදි ලාම්පු පාලන පරිපථවල ආලෝක සං වේ දී ප්‍රතිරෝධක (LDR) යොදා ගැනේ.\n(a) LDR සෑදීමට යොදා ගන්නා රසායන ද්‍රව්‍ය යක් නම් කරන්න. (ල. 1)\n\nපිළිතුර කැඩ්මියම් සල්ෆයිඩ්\n(b) අඳුරේ දී හා ආලෝකය ඇති විට LDR හි ප්‍රතිරෝධය වෙනස් වන ආකාරය ලියන්න. (ල. 2)\n\nපිළිතුර අඳුරේ දී ප්‍රතිරෝධය වැඩි වේ (ල. 1); ආලෝකය ඇති විට ප්‍රතිරෝධය අඩු වේ (ල. 1)."},{"t":"රචනා ප්‍රශ්නය 4 19.7 ප්‍රතිරෝධක පද්ධති · විදුලි ආරක්ෂාව ලකුණු 20","b":"(A) R1 = 4 Ω හා R2 = 12 Ω ප්‍රතිරෝධක දෙකක්, 12 V විදුලි සැපයුමකට පළමුව රූපය 1 හි පරිදි ද, පසුව රූපය\n2 හි පරිදි ද සම්බන්ධ කරන ලදී. (සම්බන්ධක කම්බිවල හා සැපයුමේ ප්‍රතිරෝධ නොසලකා හරින්න.)\nR1 = 4 Ω R2 = 12 Ω\n+ −\n12 V\nරූපය 1\nR1 = 4 Ω\nR2 = 12 Ω\n+ −\n12 V\nරූපය 2\n(i) රූපය 1 හා රූපය 2 හි ප්‍රතිරෝධක සම්බන්ධ කර ඇති ආකාර නම් කරන්න. (ල. 1)\n\nපිළිතුර රූපය 1 – ශ්‍රේ ණිශ්‍රේ ගත සැකසුම; රූපය 2 – සමාන්තරගත සැකසුම.\n(ii) ‘සමක ප්‍රතිරෝධය’ යන්න අර්ථ දක්වන්න. (ල. 1)\n\nපිළිතුර සම්බන්ධ කර ඇති ප්‍රතිරෝධක සියල්ල වෙනුවට යෙදිය හැකි තනි ප්‍රතිරෝධකයේ අගය.\n(iii) රූපය 1 සඳහා,\n(a) සමක ප්‍රතිරෝධය හා පරිපථයේ ගලන ධාරා ව ගණනය කරන්න. (ල. 2)\n\nපිළිතුර R = R1 + R2 = 4 + 12 = 16 Ω (ල. 1); I =\nV\nR\n=\n12\n16\n= 0.75 A (ල. 1)\n(b) R1 හා R2 හරහා විභව අන්තර ගණනය කර, ඒවා යේඑකතුව සැපයුම් විභව අන්තරයට සමාන බව\nපෙන්වන්න. (ල. 2)\n\nපිළිතුර V1 = IR1 = 0.75 × 4 = 3 V; V2 = 0.75 × 12 = 9 V (ල. 1); 3 V + 9 V = 12 V = සැපයුම් විභව\nඅන්තරය (ල. 1)\n(iv) රූපය 2 සඳහා,\n(a) සමක ප්‍රතිරෝධය ගණනය කරන්න. (ල. 2)\n\nපිළිතුර\n1\nR\n=\n1\nR1\n+\n1\nR2\n=\n1\n ශී වර්ග 5 : සම, හෘදය, ශ්වසනය, දේහ උෂ්ණත්වය, සංසේචනය, නිදසුන්","• දී ඇති ජීවීන් රුක් සටහනකින් / ද්විබෙදුම් සුවියකින් වෙන් කිරීම : පියවරකට එක් ලක්ෂණයයි","• ඒකබීජපත්‍රී හා ද්විබීජපත්‍රී : මුල් පද්ධතිය, නාරටි, පුෂ්ප අංක, ද්විතීයික වර්ධනය","• ද්විපද නාමය : ගණ නාමයේමුල් අකුර පමණක් කැපිටල් · මුද්‍රණයේ ඇල අකුරු · අතින් ලියන විට යටින් ඉරි ජීවය → වසර බිලියන 3.6 කට පෙර · දැන් විශේෂ මිලියන 8.7 ක් පමණ","▸ වැදගත්කම : පහසු අධ්‍ය යනය · අනන්‍ය තාහඳුනා ගැනීම · කිහිපදෙ නෙකුගෙන් සමස්ත ජෛව ලෝකය","▸ කාණ්ඩ අතර සම්බන්ධතා · ආර්ථිකමය වැදගත් ජීවීන් හඳුනා ගැනීම","කෘත්‍රිමහා ස්වා භාවික වර්ගීකරණය","📌 කෘත්‍රිම වර්ගීකරණය (Artificial) කෘත්‍රිමවර්ගීකරණයක දී ජීවීන්ගේ උපාංග පිහිටීම හෝනොපිහිටීම, වාසස්ථාන වැනි දේ සලකා බැලෙන අතර ජීවීන්ගේ පරිණා මික බන්ධුතා එමගින් නිරූපණය","📌 ස්වා භාවික වර්ගීකරණය (Natural) ජීවීන්ගේ පරිණා මික බන්ධුතා නිරූපණය වන ආකාරයට ඔවුන් වර්ග කිරීම ස්වා භාවික වර්ගීකරණයකදී සිදු කරයි. ස්වා භාවික වර්ගීකරණයක දී ජීවීන්ගේ රූප විද්‍යාත්මක, කායික විද්‍යාත්මක, සෛල විද්‍යාත්මක හෝඅණුක ජීව විද්‍යාත්මක ලක්ෂණ පිළිබඳ සලකා බලයි.","💡 මතක ක්‍රමය : කෘත්‍රිම= පෙනුම / වාසය බලයි · ස්වා භාවික = නෑකම (බන්ධුතා) බලයි","ධූරා වලිය : මට්ටම් 8 (taxa) මට්ටම මිනිසා පොල් 1. අධිරාජධානිය (Domain) 2. රාජධානිය (Kingdom) 3. වංශය (Phylum)* 4. වර්ගය (Class) 5. ගෝත්‍රය(Order) 6. කුලය (Family) 7. ගණය (Genus) 8. විශේෂය (Species) Eukarya Animalia Chordata Mammalia Primates Hominidae Eukarya Plantae Magnoliophyta Liliopsida Arecales Arecaceae Homo Homo sapiens Cocos Cocos nucifera * ශාකවල 3 වන මට්ටම ‘කාණ්ඩය’ (Division) යි.","💡 මතක ක්‍රමය : අරා · වංව · ගෝකු · ගවි අධිරාජධානි 3 (කාල් වූස්) බැක්ටීරියා අධිරාජධානිය","ආකියා අධිරාජධානිය","ඉයුකැරියා අධිරාජධානිය","පොදු පූර්වජයින් එකම පොදු පූර්වජයන්ගෙන් → අධිරාජධානි 3 අධිරාජධානි තුනේ ලක්ෂණ ආකියා (Archaea) බැක්ටීරියා (Bacteria) ඉයුකැරියා (Eukarya) සෛල ප්‍රාග්න්‍ය ෂ්ටික (සංවිධානය වූ න්‍ය ෂ්ටියක් නැත) ප්‍රාග්න්‍ය ෂ්ටික සූන්‍ය ෂ්ටික ප්‍රතිජීවක බොහොමයකට සං වේ දී නැත → විනාශ නොවේ විනාශ කළ හැකියි විනාශ නොවේ වාසය ආන්තික පරිසර : ගිනිකඳු · කාන්තාර · හිමකඳු · උණුදිය උල්පත් · සාගර පතුල · ලවණ බිම් සෑම පරි ීම පහසු\nවීම / ජීවීන් කිහිපදෙනකුඅධ්‍ය යනයෙන් සමස්ත ජෛව ලෝකය පිළිබඳ අවබෝධය / ජීවී කාණ්ඩ අතර\nසම්බන්ධතා අනාවරණය / ආර්ථිකමය වැදගත්කමක් ඇති ජීවීන් හඳුනා ගැනීම\nඕනෑ ම දෙකක් — ල. 1 බැගින්\n(vi) ජීවීන්ගේ මුල්ම විද්‍යාත්මක වර්ගීකරණය හඳුන්වා දුන් විද්‍යාඥයා හා රාජධානි පහේවර්ගීකරණය\nඉදිරිපත් කළ විද්‍යාඥයා නම් කරන්න. (ල. 1)\n\nපිළිතුර ඇරිස්ටෝ ටල් (ක්‍රි.ක්‍රිපූ. 4 වන සියවස) හා රොබට් විටේ කර් (1969) — දෙකම නිවැරදි නම් ල. 1\n(B) 1990 දී ඉදිරිපත් කළ නවතම වර්ගීකරණයට අනුව ජීවීන් ප්‍රධාන කාණ්ඩ තුනකට (P, Q, R) බෙදා ඇති\nආකාරය රූපයේ දැක්වේ. Q හි ජීවීන් ප්‍රාග්න්‍ය ෂ්ටික වන අතර ආන්තික පරිසරවල ජීවත් වේ. P හි ජීවීන් ද\nප්‍රාග්න්‍ය ෂ්ටික ය; නමුත් ප්‍රතිජීවක මගින් විනාශ කළ හැකි ය.\nP Q R\nපොදු පූර්වජයින්\n(i) මෙම වර්ගීකරණය ඉදිරිපත් කළ විද්‍යාඥයාකවුරුන් ද? (ල. 1)\n\nපිළිතුර කාල් වූස් (Carl Woese)\n(ii) P, Q හා R නම් කරන්න. (ල. 2)\n\nපිළිතුර P – බැක්ටීරියා අධිරාජධානිය, Q – ආකියා අධිරාජධානිය, R – ඉයුකැරියා අධිරාජධානිය (තුනම – ල.\n2; දෙකක් – ල. 1)\n(iii) Q ට අයත් ජීවීන් සඳහා නිදසුනක් දෙන්න. (ල. 1)\n\nපිළිතුර මෙතනොජන් (Methanogens) / හැලොෆයිල් (Halophiles)\n(iv) R ට අයත් රාජධානි හතර නම් කරන්න. (ල. 1)\n\nපිළිතුර ප්‍රො ටිස්ටා, ෆන්ගයි, ප්ලාන්ටේ, ඇනිමා ලියා (හතරම නිවැරදි නම් ල. 1)\n(v) R හි ජීවීන්ගේ සෛල, P හි ජීවීන්ගේ සෛලවලින් වෙනස් වන ප්‍රධාන ආකාරය කුමක් ද? (ල. 1)\n\nපිළිතුර R සූන්‍ය ෂ්ටිකයි — සංවිධානය වූ න්‍ය ෂ්ටියක් ඇත; P ප්‍රාග්න්‍ය ෂ්ටිකයි — සංවිධානය වූ න්‍ය ෂ්ටියක්\nනැත.\n(C) ජීවීන් තිදෙනකුගේ (X, Y, Z) ලක්ෂණ කිහිපයක් පහත වගුවේ දැක්වේ.\nලක්ෂණය X Y Z\nසෛල ප්‍රාග්න්‍ය ෂ්ටික; ඒකසෛලික සූන්‍ය ෂ්ටික; සෛල බිත්තියේ\nකයිටීන්\nසූන්‍ය ෂ්ටික; ඒකසෛලික\nහැඩය දණ්ඩා කාර දිලීර ජාලයක් (mycelium) අශ්වලාඩම් හැඩැති\nපෝෂණය විෂමපෝෂී මෘතෝපජීවී ප්‍රභාසංශ්ලේෂක\nප්‍රජනනය ද්වි ඛණ්ඩනය අලිංගික බීජාණු ද්වි ඛණ්ඩනය\nවෙනත් ප්‍රතිජීවකවලින් විනාශ වේ කාබනික ද්‍රව්‍ය වියෝජනය මිරිදිය පොකුණක ජීවත් වේ\n(i) X, Y හා Z අයත් වන අධිරාජධානිය හෝරාජධානිය නම් කරන්න. (ල. 2)\n\nපිළිතුර X – බැක්ටීරියා (අධිරාජධානිය), Y – ෆන්ගයි (රාජධානිය), Z – ප්‍රො ටිස්ටා (රාජධානිය) (තුනම – ල. 2;\nදෙකක් – ල. 1)\n(ii) X ගේ හැඩය හඳුන්වන නම (ඉංග්‍රීසියෙන්) ලියන්න. යම් — සමාන්තර නාරටි වින්‍යාසය; කුප්පමේ නියා — ජාලාභ නාරටි\nවින්‍යාසය (ල. 1).\n(iii) ශාක සෛලවල සෛල බිත්ති සෑදී ඇති ද්‍රව්‍ය ය හා ශාක කොළ පැහැ යෙන් දිස් වීමට හේතුව ලියන්න.\n(ල. 1)\n\nපිළිතුර සෙලියුලෝස් ; හරිතලවවල ඇති හරිතප්‍රද(ක්ලෝ රෝෆිල්) වර්ණකය (දෙකම – ල. 1)\n(C) හයිඩ්‍රා, කැරපොත්තා, ගැඩවිලා, පසැඟිල්ලා හා ගොලුබෙල්ලා යන අපෘෂ්ඨවංශී සතුන් හඳුනා ගැනීමට සකස්\nකළ ද්විබෙදුම් සුවියක් පහත දැක්වේ.\nපියවර ලක්ෂණය →\n1 (a) දේහය සෛල ප්‍රස්තර දෙකකින් ගොඩනැගී ඇත P\n1 (b) දේහය සෛල ප්‍රස්තර තුනකින් ගොඩනැගී ඇත 2 ට\n2 (a) සන්ධි සහිත උපාංග ඇත Q\n2 (b) සන්ධි සහිත උපාංග නැත 3 ට\n3 (a) දේහය සමාන ඛණ්ඩවලට බෙ දී ඇත R\n3 (b) දේහය ඛණ්ඩවලට බෙ දී නැත 4 ට\n4 (a) නාල පා ද ඇත S\n4 (b) නාල පා ද නැත; ශ්ලේ ෂ්මලයෙන් තෙත් වූ මෘදු දේ හයක් ඇත T\n(i) P, Q, R, S හා T ලෙස හඳුනා ගැනෙන සතුන් නම් කරන්න. (ල. 2)\n\nපිළිතුර P – හයිඩ්‍රා, Q – කැරපොත්තා, R – ගැඩවිලා, S – පසැඟිල්ලා, T – ගොලුබෙල්ලා (පහම – ල. 2;\nතුනක් හෝහතරක් – ල. 1)\n(ii) P අයත් වංශය නම් කර, එම වංශයේසතුන් ගොදුරු අඩපණ කිරීමට යොදා ගන්නා ව්‍යුහ නම් කරන්න.\n(ල. 2)\n\nපිළිතුර නිඩාරියා / සීලන්ටරේටා (ල. 1); දංශක කෝෂ්ඨ (ල. 1)\n(iii) P ගේ දේහය තුළ ආහාර මාර්ගය ලෙස ක්‍රියා කරන කුහරය කුමක් ද? (ල. 1)\n\nපිළිතුර සීලෝ මාන්ත්‍රය\n(iv) R අයත් වංශයේ දී මුලින්ම විකසනය වූ, දේහ බිත්තිය හා අන්ත්‍රයඅතර පිහිටි තරලයක් සහිත කුහරය\nනම් කර, එමගින් සතා ට ලැබෙන වාසියක් ලියන්න. (ල. 2)\n\nපිළිතුර සීලෝ මය (Coelom) (ල. 1); දේහ චලනවලින් ආහාර මාර්ගයට බලපෑමක් ඇති නොවීම (ල. 1)\n(v) S ගේ දේහය දක්වන සමමිතිය කුමක් ද? S ගේ නාල පාදවල කාර්ය දෙක ලියන්න. (ල. 2)\n\nපිළිතුර පංච අරීය සමමිතිය (ල. 1); සංචරණය හා ශ්වසනය (දෙකම – ල. 1)"},{"t":"රචනා ප්‍රශ්නය 3 13.1 පෘෂ්ඨවංශීන්, ද්විබෙදුම් සුවිය · 13.2 ජීවීන් නාමකරණය ලකුණු 20","b":"(A) පෘෂ්ඨවංශී සතුන් පස් දෙනෙකුගේ ලක්ෂණ කිහිපයක් පහත වගුවේ දැක්වේ.\nසතාපිහාටු රෝම ජලක්ලෝම මගින් ශ්වසනය\n(පරිණත සතා)\nසමේකොරල /\nකොරපොතු\nතිලා පියා නැත නැත ඇත ඇත\nගෙම්බා නැත නැත නැත නැත\nකටුස්සා නැත නැත නැත ඇත\nගිරවා ඇත නැත නැත ඇත (පාදවල පමණි)\nවවුලා නැත ඇත නැත නැත\n(i) වගුවේ ලක්ෂණ පමණක් භාවිත කර, මෙම සතුන් පස්දෙ නාහඳුනා ගැනීමට රුක් සටහනක් (ද්විබෙදුම්\nසුවියක්) ගොඩනඟන්න. (ල. 4)\n\nපිළිතුර\n1 — පිහාටු ඇත → ගිරවා ; පිහාටු නැත → 2\n2 — රෝම ඇත → වවුලා ; රෝම නැත → 3\n3 — ජලක්ලෝම මගින් ශ්වසනය → තිලා පියා ; ජලක්ලෝම නැත → 4\n4 — සමේකොරල ඇත → කටුස්සා ; කොරල නැත → ගෙම්බා\nසෑම පියවරකම ලක්ෂණ යුගලය හා සතානිවැරදි නම් ල. 1 බැගින් (ල. 4). වගුවේ ලක්ෂණවලින් සාදන\nවෙනත් නිවැරදි අනුපිළිවෙළක් ද පිළිගනී.\n(ii) ගිරවා හා වවුලා යන දෙදෙනාම පියා සර කළ ද ඔවුන් අයත් වන්නේ වෙනස් වර්ග දෙකකට ය. වවුලා\nමැමේ ලියා වර්ගයට අයත් බව තහවුරු කරන, ගිරවා ට නැති ලක්ෂණ දෙකක් ලියන්න. (ල. 2)\n\nපිළිතුර\nරෝමවලින් ආවරණය වූ සම / ස්තන ග්‍රන්ථි — කිරි දී පැටවුන් පෝෂණය / ශ්වේ ද හා ස්නේ හස්‍රා වී ග්‍රන්ථි\n/ බාහිර කන්පෙති / න්‍ය ෂ්ටි රහිත ද්විඅවතල රතු රුධිරාණු / දේහයෙන් බාහිරව වෘෂණ කෝෂ / කලල\nබන්ධය\nඕනෑ ම දෙකක් — ල. 1 බැගින් (කුටීර 4 හෘදය, අචලතාපී බව ගිරවා ට ද ඇති නිසා ලකුණු නැත)\n(B) ඉහත (A) හි සඳහන් ගෙම්බා හා කටුස්සා යන සතුන් දෙදෙනාම චලතාපී ය.\n(i) ‘චලතාපී’ යන්න පැහැදිලි කරන්න. (ල. 1)\n\nපිළිතුර පරිසර උෂ්ණත්වය අනුව දේහ උෂ්ණත්වය වෙනස් වීම\n(ii) ගෙම්බාගේ හා කටුස්සාගේ හෘදයේ ව්‍යුහය අතර වෙනස ලියන්න. (ල. 2)\n\nපිළිතුර ගෙම්බා — කර්ණිකා දෙකක් හා තනි කෝ ෂිකාවක් (කුටීර 3) (ල. 1); කටුස්සා — කර්ණිකා දෙකක්\nහා අසම්පූර්ණ ලෙස බෙදුණු කෝ ෂිකාවක් (ල. 1)\n(iii) උභයජීවීන්ට ජලය නොමැති පරිසරයක ජීවන චක්‍රයසම්පූර්ණ කළ නොහැක්කේ ඇයි? (ල. 1)\n\nපිළිතුර ජීවන චක්‍රයේ ජලජ අවධියක් ඇති නිසා (රූපාන්තරණය සහිත ජීවන චක්‍රයසම්පූර්ණ කිරීමට ජලය\nඅත්‍ය වශ්‍ය යි).\n(C) පෘෂ්ඨවංශී සතුන් ජීවන චක්‍රයේ කිසියම් අවධියක දී පෙන්වන පොදු ලක්ෂණ දැක්වෙන දේහ දික්කඩක දළ\nසටහනක් රූපයේ දැක්වේ.\nA\nB\nD C ගුදය\nE\n(i) A, B, C, D හා E ලෙස නම් කර ඇති ලක්ෂණ නම් කරන්න. (ල. 2)\n\nපිළිතුර A – ස්නායු රජ්ජුව, B – පෘෂ්ඨ රජ්ජුව, C – ජලක්ලෝම පැලුම්, D – උදරීය හෘදය, E – අපර ගුද\nවලිගය (පහම – ල. 2; තුනක් හෝහතරක් – ල. 1)\n(ii) ඇනිමා ලියා රාජධානිය අපෘෂ්ඨවංශීන් හා පෘෂ්ඨවංශීන් ලෙස බෙදීමට පදනම් වූ ලක්ෂණය කුමක් ද?\n(ල. 1)\n\nපිළිතුර කොඳුඇට පෙළ (කශේරුව) දැරීම / නොදැරීම\n(D) අඹ ශාකයේජීව විද්‍යාත්මක නාමය සිසුන් තිදෙ නෙකු (K, L, M) අතින් ලියා ඇති ආකාරය පහත දැක්වේ.\nK :\nL :\nM :\nmangifera indica\nMangifera Indica\nMangifera indica\n(i) ජීවීන් නම් කිරීමේ මෙම ක්‍රමය හඳුන්වා ඩේ කොටස් හා කාර්ය · ස්ව / පර පරාගණය · සත්ත්වකාමී හා වාතකාමී පුෂ්ප","• සංසේ චනයෙන් පසුඵලය, බීජය සෑදීම · ඵල හා බීජ ව්‍යාප්ති ක්‍රමහා නිදසුන්","• බීජ ප්‍රරෝ හණයේ සාධක සොයන පරීක්ෂණය · අතුබැඳීම, බද්ධ කිරීම, පටක රෝපණය","පුරුෂ හා ස්ත්‍රී ප්‍රජනක පද්ධතිවල කොටස් නම් කිරීම · ශුක්‍රාණු ගමන් මාර්ගය · ආර්තව චක්‍ර ප්‍රස්තාරය (FSH, LH, ඊස්ට්‍රජන්, ප්‍රො ජෙස්ටෙ රොන්) · අධිරෝපණය","• ලිංගිකව සම්ප්‍රේ ෂප්‍රේණය වන රෝගවල කාරක හා වළක්වා ගැනීම ජීවයේ අඛණ්ඩතාව","14.2 ශාකවල අලිංගික ප්‍රජනනය : ස්වා භාවික වර්ධක ප්‍රචාරණය","📌 වර්ධක ප්‍රජනනය ශාකයක භූගත හෝවායව කොටස් මගින් නව ශාක බිහිකර ගැනීමේ ක්‍රියාවලිය වර්ධක ප්‍රජනනය ලෙස හැඳින්වේ.","කොටස හඳුනා ගැනීම නිදසුන් මුල් · පත්‍ර මුල් / පත්‍රවලින් නව පැළ කරපිං චා, රටදෙල්, බෙලි, පේර · අක්කපාන, බිගෝ නියා, කඩුපුල් මොටියන් පසේගිලුණු කඳේපාදියෙන් හරස් අතට පැළ ගොයම්, කෙසෙල්, අන්නාසි, කපුරු, හුලං කීරිය, කලාඳුරු ධාවක පොළොවට සමාන්තරව, ආගන්තුක මුල් සහිතව යන කඳන් ගොටුකොළ, බතල, මහාරා වණාරැවුල බල්බිල වර්ධක / පුෂ්ප අංකුරයක් විකරණය වූ ව්‍යුහ අන්නාසි, හණ, හොඬල භූගත කඳන් ප්‍රජනනය + ආහාර සංචිතය + අහිතකර කාල තරණය","රයිසෝ මය – කහ, ඉඟුරු, බුත්සරණ, අරත්ත · කෝ මය – හබරල, ගහල, කිරිඅල, කිඩා රං · බල්බය – රතු ලූනු, ලොකු ලූනු, ලීක්ස් · ස්කන්ධ ආකන්දය – අර්තාපල්, ඉන්නල කෘත්‍රිමවර්ධක ප්‍රචාරණය : අතුකැබලි · අතුබැඳීම ක්‍රමය කරන ආකාරය නිදසුන් අතුකැබලි කපා ගත් නිරෝගී අත්තක් සිටුවීම (ඵල දැරූශාකයකින් · දළු, මල්, ඵල නැති අතු) රෝස, වද, අරලිය, රත්මල්, බෝගන්විලා, ක්‍රෝ ටන් භූමි අතුබැඳීම අත්තේ යට පැත්තේ සුළු කැපුමක් → පසට යට කිරීම → මුල් ආ පසු කපාසිටුවීම සමන් පිච්ච, වැල් දෙහි වායව අතුබැඳීම පොතු වළල්ලක් ඉවත් කර → කොම්පෝ ස්ට් + කොහුබත් → පොලිතීනයෙන් වෙළීම දෙළුම්, දෙහි","💡 මතක ක්‍රමය : කපලා හිටවන්නේ අතුකැබලි · ගහේතියා ගෙනම මුල් අද්දවන්නේ අතුබැඳීම → බීජ හොඳින් නොසෑදෙන ශාක, එකවර පැළ කිහිපයක් බද්ධ කිරීම (Grafting)","📌 බද්ධ කිරීම ශාකයක අංකුරයක් හෝරිකිල්ලක් එම විශේෂයේම හෝබන්ධුතා ඇති විශේෂයක ශාකයකට (පටක සම්බන්ධයක් ඇතිවන පරිදි) සම්බන්ධ කිරීම බද්ධ කිරීම ලෙස හැඳින්වේ.","ග්‍රාහකය (Stock) : පසට සම්බන්ධ කොටස අනුජය (Scion) : බද්ධ කරන අංකුරය / රිකිල්ල ශක්තිමත් මූල පද්ධතිය · ඒකාකාර වර්ධනය · රෝග හා පාරිසරික වෙනස්වීම්වලට ඔරොත්තුදීම යහපත් ලක්ෂණ සහිත ප්‍රභේදයක් · පළිබෝධ, රෝගවලින් තොර පටක රෝපණය (Tissue culture) වර්ධක ප්‍රජනනයේ වාසි · අවාසි මව් ශාකයට සමාන දුහිතෘ ශාක · ස්වා භාවික හෝකෘත්‍රිම(මිනිසා ගේ මැදිහත් වීමෙන්)","🔥සම්බන්ධ වන්නේ කැම්බියම මගින් → බද්ධ කළ හැක්කේ ද්විබීජ පත්‍රී ශාකවලට පමණි අංකුර බද්ධය (T, H, V) : අංකුරය → ග්‍රා හකයේ කැපුමට → පටිය පහළ සිට ඉහළට → ලිහා, අංකුරය එළියට සිටින සේ නැවත වෙළීම → සති 3කින් බද්ධයට 15 cm ඉහළින් ග්‍රාහකය කැපීම","▸ රිකිලි බද්ධය (ආරුක්කු, කූඤ්ඤ) : දළු, මල්, ඵල නැති රිකිල්ල කැම්බියම ස්පර්ශ වන සේ → පහළ සිට ඉහළට වෙළීම","▸ ✔ අනුජයේ ලක්ෂණ + ශක්තිමත් මුල් · රෝග ප්‍රතිරෝධී ✘ ආයුකාලය කෙටි · සියලු ශාකවලට බැහැ · දැවමය","▸ ජීවී වර්ධක පටකයක් පාලිත තත්ත්ව යටතේ → ප්‍රවේණිකව සර්වසම ශාක = ක්ලෝනය","▸ විභාජක ස්ථාන (අග්‍රස්ථ, පාර්ශ්වික අංකුරය, මූලා ග්‍රය) · මාධ්‍ය ය : සුක්‍රෝස්, ඛනිජ ලවණ, විටමින්, වර්ධක ද්‍රව්‍ය + ඒගාර් · ජීවා ණුහරණය","▸ → කිණකය (Callus) → මුල්, අංකුර → පරීක්ෂා නළ → පරිසරයට හැඩගැස්වීම","▸ ✔ කෙටි කලකින්, කුඩා ඉඩක නිරෝගී පැළ විශාල ගණනක් · හිතකර ජාන සහිත දෙමුහුම් ශාක","▸ ✔ බීජ නොසෑදෙන ශාක බෝ කිරීම · මව් ශාකයට සමානයි · ඉක්මනින් ඵල","▸ ✔ රෝග, පළිබෝධ, අහිතකර පරිසරයට ඔරොත්තු දෙන ප්‍රභේද → හොඳ ඵලදා වට ලිංගික ප්‍රජනනයට වඩා සුදුසුයි","▸ ✘ නව ප්‍රභේද ඇති නොවේ","14.2 ශාකවල ලිංගික ප්‍රජනනය : පුෂ්පය","දර්ශීය පුෂ්පයක දික්කඩ කොටස සෑදී ඇත්තේ කාර්යය","මණිය · පිටතින්ම, කොළ පාට මණි පත්‍ර ළපටි අවධියේ ඇතුළු කොටස් ආරක්ෂාව මුකුටය · සුදු / වර්ණවත් දළ පත්‍ර ආරක්ෂාව + කෘමීන් ආකර්ෂණය","පුමංගය · පුංකොටස රේණු : පරාගධානිය + සූත්‍රිකාව පරාගකෝෂ තුළ පරාග (පුංප්‍රජනක සෛල) · පරිණත විට පරාගධානිය පුපුරයි","ජායාංගය · ජායා කොටස කලංකය + කීලය + ඩිම්බ කෝෂය","ඩිම්බ කෝෂය තුළ ඩිම්බ (ජායා ප්‍රජනක සෛල)","💡 මතක ක්‍රමය : පිටින් ඇතුළට ම – මු – පු – ජා : මණිය → මුකුටය → පුමංගය → ජායාංගය","පුෂ්ප හා ශාක වර්ග වර්ගය හඳුනා ගැනීම නිදසුන් ද්වි ලිංගික පුෂ්ප පුං + ජායා කොටස් දෙකම වද, වැල්දොඩම්, මිරිස්, කතුරුමුරුං ගා ඒක ලිංගික පුෂ්ප පුමංගී හෝජායාංගී පමණි වට්ටක්කා : බොරුමල් (පුං) / ගෙඩි මල් (ජායා) · බඩඉරිඟු : අග්‍ර මංජරිය (පුං) / කරල් මල් (ජායා) ඒකගෘහී ශාක පුමංගී + ජායාංගී එකම ශාකයේවට්ටක්කා, බඩඉරිඟු, පොල්, කරවිල ද්විගෘහී ශාක දෙවර්ගය වෙනම ශාක දෙකක පැපොල්, වැලිස්නේරියා","💡 මතක ක්‍රමය : ඒකගෘහී = එක ගෙදර දෙවර්ගයම · ද්විගෘහී = ගෙවල් දෙකක පරාගණය (Pollination)","📌 පරාගණය (Pollination) පුෂ්පයක පරිණත පරාග එම විශේෂයේම පුෂ්පයක කලංකය මත තැන්පත් වීමේ ක්‍රියාවලිය පරාගණය ලෙස හැඳින්වේ.","📌 ස්ව-පරාගණය (Self) පුෂ්පයක පරිණත පරාග එම පුෂ්පයේම කලංකය මත තැන්පත් වීමේ ක්‍රියාවලිය ස්ව-පරාගණය ලෙස හැඳින්වේ.","📌 පර-පරාගණය (Cross) පුෂ්පයක පරිණත පරාග එම ශාකයේම හෝ එම විශේෂයේ වෙනත් ශාකයක පුෂ්පයක කලංකය මත තැන්පත් වීමේ ක්‍රියාවලිය පර-පරාගණය ලෙස හැඳින්වේ.","▸ ජන්මාණු සංයෝජනය → බීජ · කොටස් පුෂ්ප ග්‍රාහකය මත වලයා කාරව","🔥පර-පරාගණය → අලුත් ලක්ෂණ සහිත ශක්තිමත් පරම්පරාවක් → ඇතැම් පුෂ්ප ස්ව-පරාගණය වළක්වයි","ස්ව-පරාගණය වළක්වන අනුවර්තන අනුවර්තනය හඳුනා ගැනීම නිදසුන් ඒක ලිංගික පුෂ්ප පුමංගී, ජායාංගී පුෂ්ප වෙන වෙනම පොල්, බඩඉරිඟු ස්ව-වන්ධ්‍ය තාව එම පුෂ්පයේ පරාගවලින් ඵල හට නොගැනීම වැල් දොඩම් යෝගබාධකතාව රේණු හා කලංකය දුරස්ව මිනීමල්, ඕකිඩ් බාහිරාවර්තී රේණු කලංකය සෘජු → රේණු නැ වී · රේණු සෘජු → කලංකය නැ වී පින්න, පිච්ච අසම පරිණතිය පුමංගය මුලින් ප්‍රපුං · ජායාංගය මුලින් ප්‍රජායා බඩඉරිඟු, ට්‍රයිඩැක්ස් පරාගණ කාරක හා පුෂ්පවල අනුවර්තන සත්ත්වකාමී (සතුන් · වැඩිපුරම කෘමීන්) වාතකාමී (සුළඟ) ජලකාමී (ජලය) අනුවර්තන විශාල, වර්ණවත්, සුවඳවත් · මධුකෝෂ · ඇලෙන සුළු පරාග, කලංක · සිරු රේ තැවරෙන සේ රේණු, කලංක · කෘමීන් රවටන හැඩ ශාකයේඅග්‍රස්ථයේ · පරාග ගොඩක්, කුඩා, සැහැල්ලු · අතුබෙදුණු කලංක · පුෂ්ප මංජරී · පුං / ජායා පුෂ්ප බොහෝ විට වෙනම පුං / ජායා පුෂ්ප වෙනම · පුමංගී පුෂ්ප ගැලවී පාවී කලංකයට නිදසුන් වැල් දොඩම්, දඹල, කතුරුමුරුං ගා, තම්බර්ජියා වී, බඩඉරිඟු, තෘණ, පොල් වැලිස්නේරියා සංසේචනය · ඵල හා බීජ නිපදවීම","📌 සංසේචනය (Fertilization) පරාගය තුළ ඇති පුංජන්මාණුව ඩිම්බකෝෂය තුළ වූ ඩිම්බය සමඟ සංයෝජනය වීමෙන් යුක්තාණුවක් සෑදෙන අතර මෙම සංසිද්ධිය සංසේචනය ලෙස හැඳින්වේ.","🔥 සංසේ චනයට පෙර පසු ඩිම්බ කෝෂය ඵලය","ඩිම්බ කෝෂ බිත්තිය ඵලාවරණය","සංසේචනය වූ ඩිම්බය බීජය","ඩිම්බාවරණය බීජාවරණය","මණි, දළ පත්‍ර, රේණු, කලංකය","හැලේ (මණි පත්‍රමාං සල වී ඵලයට බද්ධව : පේර, ජම්බු, වම්බටු, මැංගුස්)","💡 මතක ක්‍රමය : කෝෂය ඵලයි · ඩිම්බය බීජයි","ඵල හා බීජ ව්‍යාප්තිය (Dispersal) කාරකය 🔥 අනුවර්තනය – නිදසුන් සතුන් මාංසල කොටස් – අඹ, ගස්ලබු · වර්ණ – කජුපුහුලන්, කෙසෙල් · කොකු / රෝම – නාග දරණ, තුත්තිරි, ඇපල · නොමඟ යවන හැඩ, රටා – එඬරු, ඔළිඳ, මදටිය, කරවිල සුළඟ කෙඳි – වරා, කොට්ට, ඉඹුල් · තටු – හොර, ගම්මාලු, මුරුං ගා · අග්‍රස්ථයේ – මැ හෝගනී, හොර · සැහැල්ලු – ඕකිඩ් · විශාල ප්‍රමාණයක් – තෘණ, මැ හෝගනී, වරා, කොට්ට පුළුන් ජලය සවිවර, තන්තුමය ඵලාවරණ – පොල්, කොට්ටම්බා, දිය කදුරු · පාවෙන හැඩය – නෙලුම් · වාතය පිරි බීජ කවච – ඕලු ස්ඵෝටනය ඵලාවරණය පිපිරී විසිරීම (ස්පර්ශය, තෙත් වීම, වියළීම) – රබර්, මදටිය, බණ්ඩක්කා, කූඩළු","💡 මතක ක්‍රමය : පොල් පාවෙයි · හොර පියා ඹයි · අඹ කනවා · රබර් පුපුරයි","පරාග කලංකය මත → සීනි ද්‍රාවණය → පරාග ප්‍රරෝහණය → පරාග නාළය කීලය ඔස්සේ ඩිම්බය","▸ යුක්තාණුව → කලලය","පාතනෝඵලනය = සංසේ චනයෙන් තොරව ඵල (කෘත්‍රිම වර්ධක ද්‍රව්‍ය) → බීජ නැත : මිදි, දොඩම්, ඇපල්","▸ මව් ශාකයෙන් ඈතට → තරඟය අවම · නව වාසස්ථාන · විවිධත්වයෙන් වැඩි වීම · පළිබෝධ, රෝගකාරකවලින් ආරක්ෂාව","▸ බීජ ප්‍රරෝහණය","📌 බීජ ප්‍රරෝහණය බීජයක් තුළ ඇති කලලය ක්‍රියාශීලි වී වර්ධනය","වෙමින් බීජ පැළයක් බිහිවීම බීජ ප්‍රරෝහණය ලෙස හැඳින්වේ.","📌 බීජ සුප්තතාව ප්‍රරෝහණය සඳහා අත්‍ය වශ්‍ය සාධක පැවතුන ද බීජ ප්‍රරෝහණය නොවීමේ තත්ත්වය බීජ සුප්තතාව ලෙස හැඳින්වේ.","14.3 මානව ප්‍රජනනය : යොවුනුදාව · ද්විතීයික ලිංගික ලක්ෂණ","📌 යොවුනුදාව (Adolescence) ලිංගික වශයෙන් පරිණත වීම හෙවත් යොවුන් විය උදා වීම යොවුනුදාව ලෙස හැඳින්වේ.","පුරු ෂයින් ස්ත්‍රීන් වයස · හෝර්මෝන 13 – 16 · ටෙස්ටොස්ටෙ රොන් 10 – 14 · ඊස්ට්‍රජන්, ප්‍රො ජෙස්ටෙ රොන් රෝම · දේහය","මුහුණ, පපුව, කිහිලි, ඉකිලි, ප්‍රජනක අවයව අවට රෝම · උරහිස් පළල් · අස්ථි, පේශි වේගයෙන් වැඩී දේහය විශාල කිහිලි, ඉකිලි, ප්‍රජනක අවයව අවට රෝම · උකුල පළල් · ස්තන ග්‍රන්ථි · අධශ්චර්ම මේදය → පුෂ්ටිමත් · අස්ථි, පේශි වර්ධනය","විශේෂ ස්වරාලය විශාල → කටහඬ ගැඹුරු · ශුක්‍රාණු නිපදවීම · ප්‍රජනක අවයව විශාල ඩිම්බ මෝචනය (ඔසප් චක්‍රය) ඇරඹේ පුරුෂ ප්‍රජනක පද්ධතිය","💡 මතක ක්‍රමය : ශුක්‍රාණු පාර වෘ – අ – ශු – මු කොටස විස්තරය · කාර්යය","වෘෂණ යුගල වෘෂණ කෝෂය තුළ · අනුඛණ්ඩිකා ≈ 250 · ශුක්‍රධර නාලිකා ≈ 1000 → ශුක්‍රාණු නිපදවීම අපිවෘෂණ යුගල සංවලිත නාලය → ශුක්‍රාණු තාවකාලිකව ගබඩා ශුක්‍ර නාල යුගල අපිවෘෂණයේ සිට ශුක්‍රාණු ගෙන යාම ශුක්‍ර ආශයිකා, පුරස්ථ, කූපර් ග්‍රන්ථි සුදු ස්‍රාවය මුත්‍රමාර්ගයට → ශුක්‍රාණු පරිවහනය, පෝෂණය","ශිෂ්ණය ශුක්‍රාණු සම්ප්‍රේ ෂප්‍රේණය · පේශිමය, රුධිරයෙන් දෘඪ වේ · මුත්‍ර මාර්ගය මේ ඔස්සේ අත්‍ය වශ්‍ය : ජීව්‍ය තාව · වාතය (O2) · ජලය · උෂ්ණත්වය","🔥 ජලය → එන්සයිම සක්‍රිය→ සංචිත ආහාර සරල වේ → බීජ මූලය, බීජාංකුරය වැඩේ","▸ පාලක නළයේ පමණක් ප්‍රරෝහණය · වියළි පුළුන් (ජලය නැත) · නටවා නිවූ ජලය + තෙල් (O2 නැත) · ශීතකරණය (උෂ්ණත්වය අඩු)","▸ අහිතකර පරිසරයට අනුවර්තනයකි හේතු : කලලය පරිණත නැති වීම · බීජාවරණය O2 / ජලයට අපාරගම්‍ය වීම","▸ ඉවත් කිරීම : ටික කලක් ගබඩා කිරීම · බූව පිලිස්සීම – තේක්ක · බීජාවරණය ඉවත් කිරීම – දොඩම් · උණු ජලයේ බහාලීම – ඉපිල් ඉපිල් · තැලීම – නෙල්ලි","▸ වෘෂණය → අපිවෘෂණය → ශුක්‍ර නාලය → මුත්‍ර මාර්ගය → ශිෂ්ණය","🔥 ශුක්‍රාණු + ග්‍රන්ථි ස්‍රාව = ශුක්‍ර තරලය (1 ml තුළ මිලියන ගණනක්)","▸ වෘෂණ කෝෂ දේහයෙන් බාහිරව → ශුක්‍රා ණුවලට දේහ උෂ්ණත්වයට වඩා අඩු උෂ්ණත්වය","▸ ශුක්‍රාණුව සචලයි : හිස · මධ්‍ය ය · වලිගය · වැඩිවියත් සමඟ නිපදවීම ඇරඹේ","▸ කාර්ය : ශුක්‍රාණු නිපදවීම · ස්ත්‍රී පද්ධතියට ඇතුළු කිරීම · ටෙස්ටොස්ටෙ රොන්","▸ ස්ත්‍රී ප්‍රජනක පද්ධතිය","ඩිම්බ කෝෂයක හරස්කඩ කොටස විස්තරය","පැලෝපීය නාළය සිහින් පේශිමය නාලය · පුනීලා කාර කෙළවරේ කඩරැලි → ඩිම්බය නාළයට ගර්භාෂය ඝන බිත්ති සහිත කුහරය · බුද්නය · දේහය · ග්‍රීවය (ගැබ්ගෙ ල) · පැලෝපීය නාළ බුද්නයට යෝනි මාර්ගය ගැබ්ගෙ ලෙන් පසු · යෝනි විවරයෙන් පිටතට ආර්තව චක්‍රයහෙවත් ඔසප් චක්‍රය(Menstrual cycle)","📌 ආර්තව චක්‍රය ලිංගික වශයෙන් පරිණත වූ එනම් වැඩි වියට පත් ස්ත්‍රීන්ගේ ප්‍රජනක පද්ධතිය ආශ්‍රිතව සිදුවන චක්‍රා නුකූල ක්‍රියාවලිය ආර්තව චක්‍රයලෙස හැඳින්වේ.","අවධිය (දින) සිදු වන දේ හෝර්මෝනය","ස්‍යුනිකා 0 – 14 ප්‍රාථමික ස්‍යුනිකා ව → ග්‍රාෆී ස්‍යුනිකා ව (ඩිම්බය මුදා හැරීමට සූදා නම්) FSH (පිටියුටරිය) · ඊස්ට්‍රජන් ලුයුටියල් 14 – 28 ග්‍රාෆී ස්‍යුනිකා ව පිපිරී ඩිම්බය පැලෝපීය නාළයට = ඩිම්බ මෝචනය (≈ 14 වන දින) · සංසේචනය නැත්නම් පීත දේහය → ශ්වේත දේහය","LH (පිටියුටරිය) · ප්‍රො ජෙස්ටෙ රොන් ආර්තව 0 – 4 ගර්භාෂ බිත්තිය බිඳී රුධිරය සමඟ පිට වීම = ආර්තව ප්‍රවාහය ප්‍රො ජෙස්ටෙ රොන් ↓ ප්‍රගුණන 4 – 14 ගර්භාෂ බිත්තිය නැවත වැඩීම · නව සෛල තට්ටුවක් · වාහිනීමත් (කේශනාලිකා සුලභ) ඊස්ට  1).\n(iii) \"ශාකවලින් හොඳ ඵලදාවක් ලබා ගැනීම සඳහා ලිංගික ප්‍රජනනයට වඩා වර්ධක ප්‍රජනනය සුදුසු ය.\"\nමෙම ප්‍රකාශයට හේතු දෙකක් ලියන්න. (ල. 2)\n\nපිළිතුර\nමව් ශාකයේයහපත් ලක්ෂණ (ඉහළ ඵලදාව) එලෙස ම ඇති, මව් ශාකයට සමාන දුහිතෘ ශාක ලැබීම\n(ල. 1)\nඉක්මනින් ඵල ලබා ගත හැකි වීම / රෝග හා පළිබෝ ධවලට ප්‍රතිරෝධී හෝඅහිතකර පරිසරයට\nඔරොත්තු දෙන ප්‍රභේද බෝ කළ හැකි වීම / බීජ නිපදවීම හොඳින් සිදු නොවන ශාක බෝ කළ හැකි වීම\n(ල. 1)\n(B) පහත දැක්වෙන්නේ ගෙවත්තක ස්වා භාවිකව වර්ධක ප්‍රචාරණය වන ශාක කිහිපයකි.\nගොටුකොළ, බිගෝ නියා, පේර, ඉඟුරු, හබරල, රතු ලූනු, අර්තාපල්\n(i) ගොටුකොළ, බිගෝ නියා හා පේර ප්‍රචාරණය වන වර්ධක කොටස පිළිවෙළින් ලියන්න. (ල. 2)\n\nපිළිතුර ගොටුකොළ – ධාවක ; බිගෝ නියා – පත්‍ර ; පේර – මුල් (තුනම ල. 2; දෙකක් ල. 1)\n(ii) ඉඟුරු, හබරල, රතු ලූනු හා අර්තාපල් යන ශාකවල ඇති භූගත කඳන් වර්ගය පිළිවෙළින් නම් කරන්න.\n(ල. 2)\n\nපිළිතුර ඉඟුරු – රයිසෝ මය ; හබරල – කෝ මය ; රතු ලූනු – බල්බය ; අර්තාපල් – ස්කන්ධ ආකන්දය\n(හතරම ල. 2; දෙකක් හෝතුනක් ල. 1)\n(iii) වර්ධක ප්‍රජනනයට අමතරව භූගත කඳන් මගින් ඉටු වන කාර්ය දෙකක් ලියන්න. (ල. 1)\n\nපිළිතුර ආහාර සංචිත කිරීම හා අහිතකර කාල තරණය කිරීම (දෙකම ල. 1)\n(C) රසවත් ඵල දෙන දොඩම් ප්‍රභේදයක අංකුරයක් කපාගෙන, රෝගවලට ඔරොත්තු දෙන ශක්තිමත් මූල\nපද්ධතියක් ඇති දොඩම් පැළයක කඳේ T හැඩයට යෙදූ කැපුමකට ඇතුළු කර පොලිතීන් පටියකින් වෙළන ලදී.\n(i) මෙම බද්ධ ක්‍රමය නම් කරන්න. (ල. 1)\n\nපිළිතුර T බද්ධය (අංකුර බද්ධය) (ල. 1)\n(ii) මෙහි ග්‍රාහකය හා අනුජය වන්නේ කුමක් ද? (ල. 1)\n\nපිළිතුර ග්‍රාහකය – රෝගවලට ඔරොත්තු දෙන, ශක්තිමත් මූල පද්ධතියක් ඇති දොඩම් පැළය ; අනුජය –\nරසවත් ඵල දෙන ප්‍රභේදයේ අංකුරය (දෙකම ල. 1)\n(iii) බද්ධ කිරීමේ දී ග්‍රාහකය හා අනුජය එකිනෙ ක සම්බන්ධ වන්නේ කුමන පටකය මගින් ද? ඒ අනුව පොල්,\nවී වැනි ශාක බද්ධ කළ නොහැක්කේ ඇයි? (ල. 2)\n\nපිළිතුර\nකැම්බියම පටකය (ල. 1)\nපොල්, වී ඒකබීජ පත්‍රී ශාක වන අතර ඒවා යේකැම්බියම පටකය නොමැති නිසා (බද්ධ කළ හැක්කේ\nකැම්බියම සහිත ද්විබීජ පත්‍රී ශාකවලට පමණි) (ල. 1)\n(iv) අංකුරය හොඳින් වර්ධනය වූ පසු, බද්ධ කළ ස්ථානයට 15 cm පමණ ඉහළින් ග්‍රා හකයේ කඳ කපාඉවත්\nකරන්නේ ඇයි? (ල. 1)\n\nපිළිතුර බද්ධ කළ අංකුරයෙන් හටගන්නා නව අංකුර හොඳින් වර්ධනය වීමට (ල. 1).\n(v) ශාක බද්ධ කිරීමේ අවාසියක් ලියන්න. (ල. 1)\n\nපිළිතුර ආයුකාලය කෙටි වීම / සියලු ශාකවලට බද්ධ කිරීම කළ නොහැකි වීම / දැවමය වටිනාකම අඩු\nවීම (ල. 1)\n(D) පටක රෝපණය මගින් කෙටි කාලයක් තුළ පැළ විශාල සංඛ්‍යාවක් නිපදවිය හැකි ය.\n(i) පටක රෝපණය සඳහා සාමාන්‍ය යෙන් පටක ලබා ගන්නා ස්ථාන දෙකක් ලියන්න. (ල. 1)\n\nපිළිතුර අග්‍රස්ථ අංකුරය, පාර්ශ්වික අංකුරය, මූලා ග්‍රයවැනි විභාජක ස්ථාන — දෙකක් (ල. 1)\n(ii) රෝපණ මාධ්‍ය යේසුක්‍රෝස්, ඛනිජ ලවණ, විටමින් හා වර්ධක ද්‍රව්‍ය අඩංගු ය. මාධ්‍ය ය ජෙලටිනීමය\nතත්ත්වයට පත් කිරීමට යොදන ද්‍රව්‍ය ය කුමක් ද? (ල. 1)\n\nපිළිතුර ඒගාර් (ල. 1)\n(iii) මාධ්‍ය යේතැබූ පටක කොටසේ සෑදෙන, අලුත් මුල් හා අංකුර වර්ධනය වන නව පටකය හඳුන්වන නම\nකුමක් ද? (ල. 1)\n\nපිළිතුර කිණකය (Callus) (ල. 1)\n(iv) පටක රෝපණයෙන් ලැබෙන ශාක ක්ලෝනයක් ලෙස හඳුන්වන්නේ ඇයි? (ල. 1)\n\nපිළිතුර ඒවා මාතෘ ශාකයට ප්‍රවේණිකව සර්වසම වන නිසා (ල. 1).\n(v) අතුකැබලි මුල් ඇද්දවීමට වඩා පටක රෝපණයේ ඇති වාසියක් ලියන්න. (ල. 1)\n\nපිළිතුර එකවර / කෙටි කාලයක් තුළ පැළ විශාල සංඛ්‍යාවක් ලබා ගත හැකි වීම / කුඩා ඉඩක් තුළ නිරෝගී\nපැළ විශාල සංඛ්‍යාවක් බෝ කළ හැකි වීම (ල. 1)"},{"t":"රචනා ප්‍රශ්නය 2 14.2 පුෂ්පය, පරාගණය, සංසේචනය, බීජ ප්‍රරෝහණය හා සුප්තතාව ලකුණු 20","b":"(A) රූපයේ දැක්වෙන්නේ දර්ශීය පුෂ්පයක දික්කඩකි.\nA\nB\nE\nF\nG\nH\nC\nD\n(i) A සිට H දක්වා අක්ෂරවලින් දැක්වෙන කොටස් නම් කරන්න. (ල. 2)\n\nපිළිතුර A – කලංකය ; B – කීලය ; C – ඩිම්බය ; D – ඩිම්බ කෝෂය ; E – පරාගධානිය ; F – සූත්‍රිකාව ; G\n– දළ පත්‍රය; H – මණි පත්‍රය(අටම ල. 2; 4–7 ල. 1)\n(ii) මෙම පුෂ්පයේ ජායාංගය සෑදී ඇත්තේ කුමන අක්ෂරවලින් දැක්වෙන කොටස්වලින් ද? (ල. 1)\n\nපිළිතුර A, B හා D (කලංකය, කීලය, ඩිම්බ කෝෂය; C ඩිම්බ, D තුළ පිහිටයි) (ල. 1)\n(iii) G වලින් සෑදුණු පුෂ්ප වලය මගින් ඉටු වන කාර්ය දෙක ලියන්න. (ල. 1)\n\nපිළිතුර ළපටි අවධියේ දී අභ්‍ය න්තර පුෂ්ප කොටස් ආරක්ෂා කිරීම හා පරාගණය සඳහා කෘමීන් ආකර්ෂණය\nකර ගැනීම (දෙකම ල. 1)\n(iv) මෙ ය ද්වි ලිංගික පුෂ්පයකි. ඒක ලිංගික පුෂ්ප දරන ශාක, ඒකගෘහී හා ද්විගෘහී ලෙස වෙන් කරන්නේ\nකෙසේ ද? එක් එක් වර්ගයට නිදසුනක් බැගින් ලියන්න. (ල. 2)\n\nපිළිතුර\nඒකගෘහී — පුමංගී හා ජායාංගී පුෂ්ප දෙවර්ගය ම එකම ශාකයේහට ගැනීම; උදා : වට්ටක්කා /\nබඩඉරිඟු / පොල් / කරවිල (ල. 1)\nද්විගෘහී — පුෂ්ප දෙවර්ගය වෙන වෙන ම ශාක දෙකක හට ගැනීම; උදා : පැපොල් / වැලිස්නේරියා (ල. 1)\n(B) බඩඉරිඟු ශාකයේඅග්‍රයේ පුමංගී පුෂ්ප සහිත පුෂ්ප මංජරියක් ද, කඳේපැත්තෙන් කරල් හටගන්නා ජායාංගී\nපුෂ්ප ද හට ගනී. මෙම ශාකයේපුමංගය, ජායාංගයට පෙර පරිණත වේ.\n(i) බඩඉරිඟු පුෂ්පවල පරාගණ කාරකය කුමක් ද? එම කාරකය මගින් පරාගණය වීමට උපකාරී වන,\nපුෂ්පවල ඇති අනුවර්තන දෙකක් ලියන්න. (ල. 2)\n\nපිළිතුර\nසුළඟ (කාරකය හා අනුවර්තන දෙක ල. 2; කාරකය හා එක් අනුවර්තනයක් ල. 1)\nඅනුවර්තන : පුෂ්ප ශාකයේඅග්‍රස්ථයේ හට ගැනීම / පරාග විශාල ප්‍රමාණයක් නිපදවීම / පරාග කුඩා හා\nසැහැල්ලු වීම / අතුබෙදුණු කලංක / පුෂ්ප මංජරී ලෙස හට ගැනීම\n(ii) බඩඉරිඟු ශාකයේස්ව-පරාගණය වළක්වන අනුවර්තන දෙක නම් කරන්න. (ල. 2)\n\nපිළිතුර\nඒක ලිංගික පුෂ්ප හට ගැනීම (පුමංගී හා ජායාංගී පුෂ්ප වෙන වෙනම) (ල. 1)\nඅසම පරිණතිය — ප්‍රපුං පරිණතිය (ජායාංගයට පෙර පුමංගය පරිණත වීම) (ල. 1)\n(iii) පරාග කලංකය මත තැන්පත් වූ පසුසංසේචනය සිදු වන ආකාරය කෙටියෙන් විස්තර කරන්න. (ල. 2)\n\nපිළිතුර\nකලංකය මත ඇති සීනි ද්‍රාවණය නිසා උත්තේජනය වී පරාගය ප්‍රරෝහණය වේ ; පරාග නාළය කීලය\nඔස්සේ වර්ධනය වී ඩිම්බ කෝෂයේ ඇති ඩිම්බය වෙත ළඟා වේ (ල. 1)\nපරාගය තුළ ඇති පුංජන්මාණුව ඩිම්බය සමඟ සංයෝජනය වී යුක්තාණුව සෑ දේ (ල. 1)\n(C) බීජ ප්‍රරෝහණයට අවශ්‍ය බාහිර සාධක සොයා බැලීමට සිසුවෙක්, සමාන මුංඇට යොදා රූපයේ පරිදි A, B, C,\nD නළ සකස් කර දින කිහිපයක් තැබී ය.\nA – තෙත් පුළුන් මත ; කාමර උෂ්ණත්වයේ\nB – වියළි පුළුන් මත ; කාමර උෂ්ණත්වයේ\nC – නටවානිවා ගත් ජලයේ ගිල්වා, ජලය මත තෙල් තට්ටුවක් යොදා ; කාමර උෂ්ණත්වයේ\nD – තෙත් පුළුන් මත ; ශීතකරණය තුළ\nශීතකරණය\nමුංඇට\nතෙල් තට්ටුව\nA\nතෙත් පුළුන්\nB\nවියළි පුළුන්\nC\nනටවානිවා ගත් ජලය\nD\nතෙත් පුළුන්\n(i) බීජ ප්‍රරෝහණය සිදු වන්නේ කුමන නළයේ ද? (ල. 1)\n\nපිළිතුර A (ල. 1)\n(ii) B, C හා D නළ මගින් පිළිවෙළින් පරීක්ෂා කෙරෙන සාධක මොනවා ද? (ල. 2)\n\nපිළිතුර B – ජලය ; C – වාතය (ඔක්සිජන්) ; D – (සුදුසු) උෂ්ණත්වය (තුනම ල. 2; දෙකක් ල. 1)\n(iii) C නළයේ ජලය නටවානිවා ගැනීමටත්, තෙල් තට්ටුවක් යෙදීමටත් හේතු මොනවා ද? (ල. 1)\n\nපිළිතුර නටවීමෙන් ජලයේ දිය වී ඇති ඔක්සිජන් (වාතය) ඉවත් කිරීම; තෙල් තට්ටුවෙන් වාතය නැවත\nජලයේ දිය වීම වැළැක්වීම (දෙකම ල. 1)\n(iv) ප්‍රරෝහණයට අත්‍ය වශ්‍ය වුව ද, මෙම පරීක්ෂණයේ දී සාධකයක් ලෙස නොසැලකූඅභ්‍ය න්තර සාධකය\nකුමක් ද? ඒ නිසා බීජ තෝරා ගැනීමේ දී සැලකිලිමත් විය යුත්තේ කුමක් ගැන ද? (ල. 1)\n\nපිළිතුර බීජයේ ජීව්‍ය තාව — ජීව්‍ය තාව ඇති (නිරෝගී, හානි නොවූ) බීජ පමණක් යොදා ගැනීම (ල. 1)\n(v) ප්‍රරෝ හණයේ දී ජලය මගින් ඉටුකෙරෙන කාර්යය කුමක් ද? (ල. 1)\n\nපිළිතුර බීජ පත්‍රවල ඇති එන්සයිම සක්‍රියකර සංචිත සංකීර්ණ ආහාර සරල ආහාර බවට ජීරණය කිරීම;\nඑමගින් බීජ මූලය හා බීජාංකුරය වර්ධනය වේ (ල. 1)\n(vi) ප්‍රරෝහණයට අත්‍ය වශ්‍ය සියලු සාධක ලැබුණ ද සමහර බීජ ප්‍රරෝහණය නොවේ. මෙම තත්ත්වය\nහඳුන්වන නම හා එයට හේතු විය හැකි සාධකයක් ලියන්න. (ල. 1)\n\nපිළිතුර බීජ සුප්තතාව ; කලලය පරිණත නොවී තිබීම / බීජාවරණය ඔක්සිජන් හෝජලයට අපාරගම්‍ය වීම\n(ල. 1)\n(vii) තේක්ක හා ඉපිල් ඉපිල් බීජවල සුප්තතාව ඉවත් කිරීමට යොදා ගන්නා ක්‍රමපිළිවෙළින් ලියන්න. (ල. 1)\n\nපිළිතුර තේක්ක – ප්‍රරෝහණයට පෙර පිටත බූව කොටස පිලිස්සීම ; ඉපිල් ඉපිල් – උණු ජලයේ බහාලීම\n(දෙකම ල. 1)"},{"t":"රචනා ප්‍රශ්නය 3 14.3 යොවුනුදාව, පුරුෂ හා ස්ත්‍රී ප්‍රජනක පද්ධති, ආර්තව චක්‍රයලකුණු 20","b":"(A) යොවුනුදාවත් සමඟ පුරු ෂයින් තුළ ශුක්‍රාණු නිපදවීම ආරම්භ වේ. ශුක්‍රාණු ගමන් කරන මාර්ගය පහත\nදැක්වේ.\nවෘෂණය → P → Q → මුත්‍ර මාර්ගය → ශිෂ්ණය ඔස්සේ පිටතට\n(i) යොවුනුදාව යනු කුමක් ද? (ල. 1)\n\nපිළිතුර ලිංගික වශයෙන් පරිණත වීම හෙවත් යොවුන් විය උදා වීම (ල. 1)\n(ii) පුරු ෂයින්ගේ ද්විතීයික ලිංගික ලක්ෂණ ඇති වීමට බලපාන හෝර්මෝනය නම් කර, පුරු ෂයින්ට පමණක්\nආවේණික එවැනි ලක්ෂණ දෙකක් ලියන්න. (ල. 2)\n\nපිළිතුර\nටෙස්ටොස්ටෙ රොන් (ල. 1)\nමුහුණේ හා පපුවේ රෝම වැඩීම / උරහිස් පළල් වීම / ස්වරාලය විශාල වී කටහඬ ගැඹුරු වීම /\nවෘෂණවල ශුක්‍රාණු නිපදවීම ආරම්භ වීම — දෙකක් (ල. 1)\n(iii) P හා Q නම් කරන්න. (ල. 1)\n\nපිළිතුර P – අපිවෘෂණය ; Q – ශුක්‍ර නාලය (දෙකම ල. 1)\n(iv) වෘෂණ, වෘෂණ කෝෂ නම් සම් මල්ල තුළ දේහයෙන් බාහිරව පිහිටීමේ වැදගත්කම කුමක් ද? (ල. 1)\n\nපිළිතුර ශුක්‍රාණු ජනනය උෂ්ණත්වයට සං වේ දී නිසා, නිරෝගී ශුක්‍රාණු සෑදීමට අවශ්‍ය, දේහ උෂ්ණත්වයට වඩා\nඅඩු උෂ්ණත්වයක් වෘෂණවල පවත්වා ගැනීම (ල. 1)\n(v) ශුක්‍රාණු මුත්‍ර මාර්ගයට පැමිණි විට එයට එකතු වන ස්‍රාවය නිකුත් කරන ග්‍රන්ථි දෙකක් නම් කර, එම\nස්‍රාවයේවැදගත්කම ලියන්න. (ල. 1)\n\nපිළිතුර ශුක්‍ර ආශයිකා / පුරස් ිටි ආවේණික රටා හා සම්භාවිතාව (x + y)(x + y) = xx + 2xy + yy → 1 : 2 : 1 පරීක්ෂා මුහුම · දෙමාපියන් සෙවීම ජනිතයින් දෙමාපියන් ප්‍රමුඛ : නිලීන = 3 : 1 Tt × Tt ප්‍රමුඛ : නිලීන = 1 : 1 Tt × tt සියල්ල නිලීන tt × tt සියල්ල ප්‍රමුඛ අඩු තරමින් එක් අයෙක් TT","20.3 ප්‍රවේණි විද්‍යා වේ මූලික සංකල්ප","📌 සමයුග්මක (Homozygous) කිසියම් ලක්ෂණයක් සඳහා වූ ජාන දෙක සමාන නම් එම ජීවියා එම ලක්ෂණයට සමයුග්මක වේ.","📌 රූපානුදර්ශය ජීවියකුගේ බාහිර වශයෙන් ප්‍රකාශ වන ලක්ෂණය","රූපානුදර්ශය (phenotype) ලෙස හැඳින්වේ.","📌 විෂම යුග්මක (Heterozygous) කිසියම් ලක්ෂණයක් සඳහා වූ ජාන දෙක අසමාන නම් එම ජීවියා එම ලක්ෂණයට විෂම යුග්මක වේ.","📌 ප්‍රවේ ණිදර්ශය එම ලක්ෂණය තීරණය කිරීම සඳහා ජීවියා තුළ ඇති ජාන සංයුතිය එම ජීවියාගේ ප්‍රවේණිදර්ශය (genotype) ලෙස හැඳින්වේ.","ග්‍රෙ ගග්‍රෙර් මෙන්ඩල් (ඔස්ට්‍රියානු පූජක) → ආවේණිය ගැන මුල්ම විද්‍යාත්මක පරීක්ෂණ → ප්‍රවේණි විද්‍යා වේ (Genetics) පියා · 1865 · ගෙවතුමෑ (Pisum sativum)","▸ ගෙවතුමෑ ඇයි? පහසු වගාව · ඉක්මන් ඵලදාව · නුමුහුම් ශාක","▸ පහසුවෙන් හඳුනන පරස්පර ලක්ෂණ යුගල","▸ ස්වා භාවිකව ස්ව-පරාගණය · අවශ්‍ය විට පර-පරාගණය · පරම්පරාව දිගටම","▸ P : නුමුහුම් උස × නුමුහුම් මිටි (පර-පරාගණය) → F1 සියල්ල උස","▸ F1 ස්ව-පරාගණය → F2▸ : උස : මිටි ≈ 3 : 1 යුගල් 7, වරකට එකක් · ශාක විශාල සංඛ්‍යාවක් → විශ්වා සදායී","▸ ඒකාංග මුහුම → ලක්ෂණ යුගලයකින් එකක් බැගින් පමණක් ප්‍රවේණිගත වීම","▸ F 🔥 1 හි ප්‍රකාශ වූ ලක්ෂණය (උස) → ප්‍රමුඛ අතරමැදි ලක්ෂණ නැත → එක් ලක්ෂණයකට වෙනස් සාධක දෙකක්","▸ ප්‍රමුඛ → කැපිටල් (T) · නිලීන → සිම්පල් (t) · ලක්ෂණයකට සාධක යුගලයක්","▸ නුමුහුම් උස TT · නුමුහුම් මිටි tt · මිටි නිලීනව ඇති උස Tt F1 × F1 = Tt × Tt → F2▸ (කොටුව යෝජනාකළේ පනට්)","🔥TT : Tt : tt = 1 : 2 : 1","🔥උස : මිටි = 3 : 1","▸ සම්භාවිතාව = යම් සිද්ධියක් සිදුවීමට ඇති ඉඩකඩ පබළු (W 50 + R 50, බඳුන් දෙකක්, අහඹුව ~50 වරක්) : RR ¼ · RW + WR 2/4 · WW ¼ → 1 : 2 : 1 = F2 ප්‍රවේණිදර්ශ","▸ කාසි : දෙකම සිරස ½ × ½ = ¼ (ගුණ) · සිරස–අගය","හෝඅගය–සිරස ¼ + ¼ = ½ (එකතු)","▸ ප්‍රමුඛ ශාකය (කොළ කරල්) × නිලීන සමයුග්මක (gg)","▸ ජනිතයින් සියල්ල ප්‍රමුඛ → GG · 1 : 1 → Gg ජාන ප්‍රකාශය · රූපානුදර්ශය හා ප්‍රවේණිදර්ශය","R වටකුරු · r රැළි රූපානුදර්ශය ප්‍රවේණිදර්ශය","සමයුග්මක වටකුරු බීජ RR විෂම යුග්මක වටකුරු බීජ Rr සමයුග්මක රැළි බීජ rr","💡 මතක ක්‍රමය : රූප = පෙනෙන දේ · ප්‍රවේණි = ඇතුළේ ජාන ප්‍රවේණික ද්‍රව්‍ය ය · DNA හා ජාන · ජාන ප්‍රතිබද්ධය","📌 ජානය (Gene) ජානයක් යනු යම් ලක්ෂණයක් සඳහා වග කියන්නා වූ DNA අණුවක පිහිටි නිශ්චිත භස්ම අනුපිළිවෙ ළකි. වෙනත් ආකාරයකින් කියතොත් යම් ලක්ෂණයක් සඳහා විශේෂිත වූ DNA අණු කොටසකි.","💡 මතක ක්‍රමය : වර්ණදේහය ⊃ DNA ⊃ ජානය","⊃ භස්ම අනුපිළිවෙළ","20.4 – 20.5 මානව ආවේණිය · ලිංග නිර්ණය (Sex determination)","📌 ආවේණිය · ප්‍රවේණිය ආවේණික ලක්ෂණ ඉදිරි පරම්පරා වට සම්ප්‍රේ ෂප්‍රේණය","වීම ආවේණිය (Heredity) ලෙස හඳුන්වන අතර එම ලක්ෂණ සම්ප්‍රේ ෂප්‍රේණය වීමේ ක්‍රියාවලිය ප්‍රවේණිය","(Inheritance) ලෙස හඳුන්වයි.","ජීවියා n ජීවියා n ජීවියා n ගෙවතු මෑ 14 වී 24 චිම්පන්සියා 48 රතු ළූණු 16 තක්කාලි 24 අන්නාසි 50 බඩ ඉරිඟු 20 මීයා 40 කාප් මත්ස්‍ය යා 104 X Y X XX ♀ XY ♂ X XX ♀ XY ♂","💡 මතක ක්‍රමය : අම්මා දෙන්නේ X ම යි · තාත්තා X හෝ Y","20.6 මානව ප්‍රවේණික ආබාධ · ලිංග ප්‍රතිබද්ධ ප්‍රවේණිය","හීමෝ පීලියාව (Haemophilia) රතු–කොළ වර්ණාන්ධතාව (Colour blindness) ජානය X මත නිලීන h (H සාමාන්‍ය) X මත නිලීන c (C සාමාන්‍ය) ලක්ෂණය රුධිරය කැටි නොගැසේ → සුළුතුවාලයෙන් අධික රුධිර වහනය, මරණය පවා රතු හා කොළ වෙන් කර හඳුනා ගැනීම අපහසුයි · බහුලතම ලිංග ප්‍රතිබද්ධ ආබාධය","කා ට? පිරිමින්ට පමණි · ගැහැ ණුන් වාහක පිරිමින්ට වැඩියෙන් · ගැහැ ණුන්ට කලාතුරකින්","▸ මෙන්ඩල්ගේ අංශුමය සාධක = ජාන (genes) ජාන ප්‍රකාශය (Gene expression) = ලක්ෂණයේ ජාන යුගලය : RR, rr, Rr","🔥RR හා Rr → රූපානුදර්ශ සමානයි · ප්‍රවේණිදර්ශ වෙනස් ප්‍රවේණික ද්‍රව්‍ය ය = වර්ණදේහවල DNA (ඩිඔක්සි රයිබෝ නියුක්ලෙයික් අම්ලය)","▸ ද්විත්ව හෙලික්සය → වොට්සන් හා ක්‍රික්1953 (අමතර) දක්ෂිණාවර්ත, ප්‍රතිවිරුද්ධ දිශා දා ම දෙක (සීනි + පොස්පේට්) · භස්ම යුගල A–T, C–G","▸ ලක්ෂණ තීරණය → භස්ම යුගල අනුපිළිවෙළ · වර්ණදේහයක ජාන අතිවිශා ල ගණනක්, එකකට නිශ්චිත ස්ථානයක්","▸ ගෙනෝමය = ජීවියකුගේ ජාන සියල්ල · මානව ගෙනෝම ව්‍යා පෘතිය → භස්ම අනුපිළිවෙළ සිතියම් ගත කිරීම · අහිතකර විය හැකි දේ : රක්ෂණ සමාගම්වලට රෝග තත්ත්ව හෙළි වීම","▸ සමජාත (සමප්‍රභව) වර්ණදේහ යුගලය : එකම ලක්ෂණ පෙළ · දිග, පළල, සෙන්ට්‍රො මියර ස්ථානය සමානයි · එකක් මවගෙන්, අනෙක පියා ගෙන් · ජාන යුගලය අනුරූප ස්ථානවල","▸ මෙන්ඩල් : ජන්මාණු සෑදීමේ දී ජාන ස්වාධීනව වියුක්ත වේ · මෝර්ගන් : සෑම විටම නොවේ (අනපේ ක්ෂිත අනුපාත)","▸ ප්‍රතිබද්ධ ජාන (Gene linkage) = එකම වර්ණදේහය මත පිහිටි, ස්වාධීනව වියුක්ත නොවන ජාන මිනිසා 46 · සංඛ්‍යාව විශේෂයට නියතයි","(අනන්‍ය තාව) · සංකීර්ණත්වය පෙන්වන්නේ නැත (කාප් > මිනිසා)","▸ සංසේ චනයේ දී ලිංග වර්ණදේහ එක්වන ආකාරය","අනුව ගැහැණු / පිරිමි බව → ලිංග නිර්ණය","▸ දේහ සෛලය 46 = 22 යුගල් අලිංග (දෛහික) + 1 යුගල ලිංග","▸ ♀ XX · ♂ XY → Y කුඩා යි · පිරිමියාගේ X = ගැහැ ණියගේ X","▸ ඩිම්බය 22 + X පමණි · ශුක්‍රාණුව 22 + X හෝ 22 + Y ♀ : ♂ = 1 : 1 · පුතා ට සාධකය පියා ගෙන් (Y) · 50% (කලින් දරුවන් කවුරු වුවත්)","🔥 X, Y ජාන සියල්ල ලිංග නිර්ණයට නොවේ · Y ඉතා කෙටියි → X ජාන බොහොමයකට Y මත අනුරූප ජාන නැත → පිරිමියා ට X ජාන ප්‍රමුඛ / නිලීන සියල්ල ප්‍රකාශ වේ","▸ ගැහැ ණියට X දෙකක් → නිලීන ලක්ෂණය පෙනෙන්නේ X දෙකෙහිම නිලීන ජානය ඇත්නම් පමණි · එකක් නම් වාහක","🔥පිරිමියා ට X එකයි → රෝගී හෝනිරෝගී · කිසිදා වාහකයෙක් නොවේ හීමෝ පීලියාව හා වර්ණාන්ධතාව ප්‍රවේණිගත වන හැටි X H Y X H XHXH නිරෝගී දුව XHY නිරෝගී පුතා X h XHXh වාහක දුව XhY රෝගී පුතා X C Y X c XCXc වාහක දුව XcY වර්ණාන්ධ පුතා X c XCXc වාහක දුව XcY වර්ණාන්ධ පුතා","💡 මතක ක්‍රමය : පුතාගේ X = අම්මාගේ X (තාත්තා ගෙන් Y) · පිරිමියා ට වාහක වෙන්න X දෙකක් නැහැ ජාන විකෘති හා ඒ නිසා ඇති වන ප්‍රවේණික ආබාධ","📌 ජාන විකෘතිය (Gene mutation) වර්ණදේහවල ඇති ප්‍රවේණික ද්‍රව්‍ය වන DNA හි සිදුවන වෙනස්කම් නිසා එක් ජානයක ඇතිවන විකෘතියක්, ජාන විකෘතියක් ලෙස හැඳින්වේ.","ඇලි බව (Albinism) තැලසීමියාව (Thalassaemia) විකෘති ජානය මෙලනින් (සමේවර්ණකය) නිපදවීමට මූලික, දෛහික වර්ණදේහයක ජානයහිමොග්ලොබින් (O2 පරිවහන ප්‍රෝ ටීනය) නිෂ්පා දනයට බලපාන, දෛහික වර්ණදේහයක ජානය","ලක්ෂණ සම, හිසකෙස්, ඇසිපිහාටු අසාමාන්‍ය ලෙස සුදු · ඇලි සතුන් ද (මොණරා) ප්‍රධාන ලක්ෂණය නිරක්තිය","ප්‍රවේණිය නිලීන → නිලීන සමයුග්මක අයට පමණි tt රෝගී · Tt වාහක · TT නිරෝගී නිදසුන තැලසීමියා වාහකයින් Tt × Tt → TT : Tt : tt = 1 : 2 : 1 → රෝගී දරුවෙක් ¼ · වාහකයෙක් ½ · ලංකා වේ රෝගීන් වැඩි ප්‍රදේශවල ලේනෑ විවාහ බහුලයි","ප්‍රවේණිය ප්‍රයෝජනයට · අභිජනනය හා 20.7 ජාන ඉංජිනේ රුවි ජනනය කර වැඩි දියුණු කළ ජීවීන් සඳහා\nනිදසුන් දෙකක් දෙන්න. (ල. 1)\n\nපිළිතුර වැඩි කිරි දෙන එළදෙ නුන් / වැඩි බිත්තර දෙන කිකිළියන් / අඩු කාලයකින් වැඩි මස් දෙන කුකුළන් /\nපළිබෝධ ප්‍රතිරෝධී, වැඩි අස්වැ න්නක් දෙන බෝග / බීජ රහිත පලතුරු (නාරං) — ඕනෑ ම දෙකක්\n(ii) ප්‍රතිසංයෝජිත DNA තාක්ෂණය යනු කුමක් ද? (ල. 1)\n\nපිළිතුර වෙනස් ප්‍රභවවලින් ලබා ගත් DNA අණු කොටස් බද්ධ කර නව (ප්‍රතිසංයෝජන) DNA අණු නිපදවන\nතාක්ෂණය (ජාන ඉංජිනේ රුවිද්‍යාව).\n(iii) ජාන තාක්ෂණය මගින් ජීවියකුගේ ප්‍රවේණිදර්ශය වෙනස් කළ හැකි ක්‍රමදෙ ක සඳහන් කරන්න. (ල. 1)\n\nපිළිතුර ජානවලින් ඇතැම් DNA කොටස් ඉවත් කිරීම ; අමතර DNA කොටස් ඇතුළු කිරීම\n(iv) කර්මාන්ත ක්ෂේ ත්‍රයේ දී ජාන තාක්ෂණයෙන් වැඩි දියුණු කළ ක්ෂුද්‍ර ජීවීන් යොදා නිපදවන නිෂ්පාදන\nදෙකක් ලියන්න. (ල. 1)\n\nපිළිතුර ඇමයිලේස් වැනි එන්සයිම / MSG වැනි කෘත්‍රිමඇමයිනෝ අම්ල / විටමින් B12 හා E (නීල හරිත\nඇල්ගී) — ඕනෑ ම දෙකක්\n(v) අපරා ධකරුවකු හඳුනා ගැනීමට DNA තාක්ෂණය යොදා ගන්නා ආකාරය කෙටියෙන් පැහැදිලි කරන්න.\n(ල. 1)\n\nපිළිතුර අපරාධ ස්ථානයෙන් ලබා ගත් රුධිරය / හිසකෙස් / ශුක්‍රාණු ආදියේ DNA, සැකකරුගේ DNA සමඟ\nසැසඳීම.\n(vi) 'ජාන ප්‍රතිකාරය' (Gene therapy) යනු කුමක් ද? (ල. 1)\n\nපිළිතුර රෝග ඇති කරන ජාන වෙනුවට සාමාන්‍ය ජාන බද්ධ කිරීම."}],"mcq":[{"n":170,"q":"මෙන්ඩල්ගේ පරීක්ෂණ ප්‍රතිඵල අනුව ගෙවතුමෑ ශාකයේලක්ෂණ පිළිබඳ ව පහත ප්‍රකාශ සලකාබලන්න. A – බීජ වර්ණයේ දී කොළ පැහැ ය කහ පැහැ යට ප්‍රමුඛ වේ. B – කරල්වල පැහැ යේ දී කොළ පැහැ ය කහ පැහැ යට ප්‍රමුඛ වේ. C – පුෂ්ප පිහිටීමේ දී අක්ෂීය පිහිටීම අග්‍රස්ථ පිහිටීමට ප්‍රමුඛ වේ. මෙයින් සත්‍ය වන්නේ,","o":["A පමණි.","A හා B පමණි.","B හා C පමණි.","A, B හා C සියල්ලම ය."],"a":3,"e":"20.1 වගුව : බීජ වර්ණයේ කහ ප්‍රමුඛයි (A අසත්‍ය යි); කරල් පැහැ යේකොළ ප්‍රමුඛයි (B සත්‍ය යි); අක්ෂීය පිහිටීම ප්‍රමුඛයි (C සත්‍ය යි). බීජ හා කරල් වර්ණ පටලවා ගන්නා අය (4) තෝරති."},{"n":171,"q":"ප්‍රවේණි විද්‍යා වේ පියා ලෙස සැලකෙන ග්‍රෙ ගග්‍රෙර් මෙන්ඩල් සිය පරීක්ෂණ සඳහා ගෙවතුමෑ ශාකය තෝරා ගැනීමට හේතුවක් නොවන්නේ කුමක් ද?","o":["ස්වා භාවිකව සෑම විටම පර-පරාගණය පමණක් සිදු වීම","ඉතා කෙටි කාලයකින් ඵලදාව ලබා ගත හැකි වීම","පහසුවෙන් හඳුනා ගත හැකි පරස්පර ලක්ෂණ යුගල තිබීම","නුමුහුම් ශාක ලබ
