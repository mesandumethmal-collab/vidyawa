y) ශක්තිය යනු කාර්ය කිරීමේ හැකියාව යි.","💡 මතක ක්‍රමය : ශක්තිය = කාර්යය කරන්න තියෙන හැකියාව · කාර්යය = ඒ ශක්තිය වැ ය වීම.","චාලක ශක්තිය (Kinetic energy)","📌 චාලක ශක්තිය වස්තුවක චලනය නිසා එම වස්තුව සතුශක්තිය","චාලක ශක්තිය ලෙස හැඳින්වේ.","2 m v 2 · kg, m s −1 → J නිදසුන 300 g, 4 m s −1 → Ek = 1 2 × 0.3 × 4","2 = 2.4 J විභව ශක්තිය (Potential energy)","📌 විභව ශක්තිය වස්තුවක පිහිටීම අනුව හෝවස්තුවක හැඩය වෙනස් වීම නිසා හෝගබඩා වන ශක්තිය විභව ශක්තිය ලෙස හැඳින්වේ.","වර්ගය ගබඩා වන්නේ නිදසුන ගුරුත්වාකර්ෂණ විභව ශක්තිය","ගුරුත්වා කර්ෂණයට විරුද්ධව ඉහළට එසවීමට කළ කාර්යය","ගසක ඇති ගෙඩිය · ඉහළ ජලාශයක ජලය","ප්‍රත්‍යාප්‍ර ත්‍යාස්ථ විභව ශක්තිය","ඇදීමෙන් හැඩය වෙනස් කිරීමට කළ කාර්යය","ඇද තැබූ රබර් පටිය · දුන්න Ep = m g h නිදසුන 400 g, 2.5 m උසින් → 0.4 × 10 × 2.5 = 10 J","💡 මතක ක්‍රමය : චලනය නිසා → චාලක · පිහිටීම / හැඩය නිසා → විභව විභව ශක්තිය : උස හා ස්කන්ධයේ බලපෑම කිරි මැටි ස්ථරය මතට අතහැරීම වෙනස් කළේ නියතව තැබුවේ නිරීක්ෂණය → නිගමනය","වානේ ගෝලය විවිධ උසවල සිට උස ස්කන්ධය (එකම වස්තුව · එකම පෘෂ්ඨය ගැටේ) උස ↑ → වලේගැඹුර ↑ → h ↑ නම් Ep ↑ වැලි ප්‍රමාණය වැඩි කළ ප්ලා ස්ටික් බෝතලය","ස්කන්ධය උස (≈ 1 m) ස්කන්ධය ↑ → ගැඹුර ↑ → m ↑ නම් Ep ↑ ශක්ති පරිවර්තනය : චාලක ⇄ විභව අවස්ථාව චාලක ශක්තිය විභව ශක්තිය","ඉහළට විසි කළ වස්තුව නගින විට අඩු වේ වැඩි වේ උපරිම උසේ දී (v = 0) ශූන්‍ය යි උපරිමයි","පහළට වැටෙන විට වැඩි වේ අඩු වේ පානොපැ ද කන්දක් නගින බයිසිකලය","අඩු වේ (මුදුනේ අවම) වැඩි වේ (මුදුනේ උපරිම) කන්ද පහළට යන බයිසිකලය වැඩි වේ අඩු වේ ඔන්චිල්ලාව : පහළම තැන → ඉහළම තැන අඩු වේ · ඉහළම තැන ශූන්‍ය යි","වැඩි වේ · ඉහළම තැන උපරිම ඔන්චිල්ලාව : ඉහළම තැන → පහළම තැන වැඩි වේ අඩු වේ නිදසුන 1 kg ගලක් 15 m උසින් අතහරී : මුලදී Ep = 1 × 10 × 15 = 150 J","6 m දී Ep = 60 J → Ek = 150 − 60 = 90 J පොළොව ළඟ Ek = 150 J","💡 මතක ක්‍රමය : නගිද්දී චාලක → විභව · බහිද්දී විභව → චාලක · මුදුනේ v = 0","▸ ඒකකය → ජූලය (J) (කාර්යයට වගේම) ආකාර : තාප · විද්‍යුත් · චුම්බක · ආලෝක · ධ්වනි · යාන්ත්‍රික","▸ යාන්ත්‍රික(Mechanical) → වර්ග දෙකයි : විභව · චාලක","▸ ශක්ති හානි නැත්නම් → කාර්යය = වැ ය වූ ශක්තිය","▸ ට්‍රොලිය : v ↑ හෝ m ↑ → ට්‍රොලිය වැඩි දුරක්  කොපමණ ද? හේතුව දෙන්න.\n(ල. 1)\n\nපිළිතුර 10 m s⁻¹\n(පහළට) — පහළට එන විට විභව ශක්තිය (10 J) නැවත සම්පූර්ණයෙන් ම චාලක\nශක්තිය බවට පත් වන නිසා (ල. 1).\n(B) ස්කන්ධය 45 kg වන ශිෂ්‍යාවක් ස්කන්ධය 5 kg වන පාසල් බෑගය ද රැගෙන, එක් පඩියක සිරස් උස 15 cm\nවන පඩි 40 කින් යුත් පඩි පෙළක් නැග්ගා ය. ඇයට ඒ සඳහා මිනිත්තු 1 ක් ගත විය.\n(i) ජවය අර්ථ දක්වා, එහි SI ඒකකය ලියන්න. (ල. 2)\n\nපිළිතුර\nඒකක කාලයක දී කරනුලබන කාර්ය ප්‍රමාණය / කාර්ය කිරීමේ ශීඝ්‍රතාව (ල. 1)\nවොට් (W) / J s⁻¹\n(ල. 1)\n(ii) ඇය නගින මුළු සිරස් උස මීටරවලින් සොයන්න. (ල. 1)\n\nපිළිතුර 40 × 0.15 m = 6 m (ල. 1)\n(iii) පඩි පෙළ නැගීමේ දී ඇය ගුරු ත්වයට විරුද්ධව කරන කාර්යය ගණනය කරන්න. (ල. 2)\n\nපිළිතුර\nඔසවන මුළු බර = (45 + 5) kg × 10 m s⁻² = 500 N (ල. 1)\nW = 500 N × 6 m = 3000 J (ල. 1)\n(iv) ඇයගේ ජවය ගණනය කරන්න. (ල. 2)\n\nපිළිතුර\nt = මිනිත්තු 1 = 60 s (ල. 1)\nP =\n3000 J\n60 s\n= 50 W (ල. 1)\n(v) පඩි පෙළ මුදුනට පැමිණි විට, බෑගය සමඟ ඇයගේ ගුරුත්වාකර්ෂණ විභව ශක්තියේ වැඩි වීම කොපමණ\nද? හේතුව දෙන්න. (ල. 1)\n\nපිළිතුර 3000 J — ගුරු ත්වයට විරුද්ධව කළ කාර්යය විභව ශක්තිය ලෙස ගබඩා වන නිසා (ල. 1).\n(C) එදිනෙ දා ජීවිතයේ දී විභව ශක්තිය යොදා ගන්නා අවස්ථා රැසකි. ගොඩනැගිලි ඉදිකිරීමේ දී අත්තිවාරම්\nදැමීමට පෙර කුලුනු පොළොවට සිටුවීමට ජම්බාරයක් භාවිත කෙරේ. ස්කන්ධය 500 kg වන ජම්බාරයක්\nයන්ත්‍රයක් මගින් කුලුනේහිසට 4 m ඉහළට ඔසවා කුලුන මතට මුදා හරිනු ලැබේ.\n(i) කුලුනේහිසට සාපේක්ෂව 4 m උසේ දී ජම්බාරයේ ගුරුත්වාකර්ෂණ විභව ශක්තිය ගණනය කරන්න.\n(ල. 1)\n\nපිළිතුර Ep = mgh = 500 × 10 × 4 = 20 000 J (ල. 1)\n(ii) ජම්බාරය කුලුනේ වදින මොහොතේ එහි ඇති ශක්තිය කුමන ආකාරයේ ද? එම ශක්තිය නිසා කුලුනට\nසිදු වන්නේ කුමක් ද? (ල. 1)\n\nපිළිතුර චාලක ශක්තිය ; එම ශක්තිය කුලුනට ලැබී කුලුන පොළොව තුළට කිඳා බසී (ල. 1).\n(iii) ජල විදුලි බලාගාරයක දී ඉහළ ජලාශයක ගබඩා කළ ජලයෙන් විදුලිය ලැබෙන විට සිදු වන ශක්ති\nපරිවර්තන අනුපිළිවෙළින් ලියන්න. (ල. 1)\n\nපිළිතුර විභව ශක්තිය → චාලක ශක්තිය (ගලන ජලය, කරකැ වෙන ටර්බයිනය) → විද්‍යුත් ශක්තිය (ල. 1)\n(iv) දර පැලීමේ දී කුළු ගෙඩිය වැඩි උසකට ඔසවා කුඤ්ඤය මතට මුදා හළ විට කුඤ්ඤය වඩා ගැඹුරට\nකිඳා බසින්නේ ඇයි? (ල. 1)\n\nපිළිතුර උස වැඩි නිසා කුළු ගෙඩියේ ව රියක ස්කන්ධය · B හි පරිමාව අඩු → පීඩනය ↑ B හි ශීඝ්‍රතාව වැඩියි ඒකක කාලයක ගැටෙන අංශු ↑ උත්ප්‍රේ රප්‍රේක අලුත් H2O2 සමාන පරිමා 2 · එකකට කිරූ MnO2 0.2 g · අවසානයේ පෙරා අවශේෂය","(Residue) වියළා කිරීම O2 බුබුළු වේගයෙන් · MnO2 ස්කන්ධය නොවෙනස් ⇒ උත්ප්‍රේ රප්‍රේකයකි 2H2O2(aq) → 2H2O(l) + O2(g) නිදසුන පැත්ත 2 cm ඝනකය : 6 × (2 × 2) = 24 cm2 → පැත්ත 1 cm ඝනක 8 කට කැපූ විට : 8 × 6 × (1 × 1) = 48 cm2 ⇒ කුඩා කරන තරමට පෘෂ්ඨ වර්ගඵලය ↑","💡 මතක ක්‍රමය : රත් කළොත් අංශු දුවනවා · සාන්ද්‍ර කළොත් සෙනඟ වැඩියි · කුඩු කළොත් මුහුණත් වැඩියි","→ හැම එකෙන්ම ගැටුම් ↑ ශීඝ්‍රතා ප්‍රස්තාර කියවීම වේගවත් සෙමින් (කැ ට) තිරස් ⇒ ප්‍රතික්‍රියාව අවසන් නිපදවූ ඵල ප්‍රමාණය","සමාන ප්‍රතික්‍රියක · වේගවත් = කුඩු / රත් කළ / සාන්ද්‍ර / උත්ප්‍රේ රප්‍රේක සහිත උත්ප්‍රේ රප්‍රේක හා නිශේධක","📌 උත්ප්‍රේරක (Catalysts) රසායනික ප්‍රතික්‍රියාවක ශීඝ්‍රතාව වැඩි කරන නමුත් ප්‍රතික්‍රියාවේ දී වැ ය නොවන ද්‍රව්‍ය උත්ප්‍රේ රප්‍රේක ලෙස හැඳින්වේ.","📌 නිශේධක / මන්දක (Inhibitors) ප්‍රතික්‍රියාවක ශීඝ්‍රතාව වැඩි කරන මෙන් ම අඩු කරන ද්‍රව්‍ය ද ඇත. එසේප්‍රතික්‍රියා ශීඝ්‍රතාව අඩුකරන ද්‍රව්‍ය","නිශේධක හෙවත් මන්දක ලෙස හැඳින්වේ.","▸ අංශු ගැටිය යුතුයි + ප්‍රමාණවත් ශක්තියක් → බන්ධන බිඳී නව බන්ධන → ඵල","▸ සාධක 4 : පෘෂ්ඨ වර්ගඵලය · උෂ්ණත්වය · සාන්ද්‍රණය (වායු නම් පීඩනය) · උත්ප්‍රේ රප්‍රේක","🔥එක් සාධකයක් පමණක් වෙනස් කර, අනෙක් සියල්ල (ස්කන්ධය, පරිමාව, උෂ්ණත්වය) නියතව","▸ එකම අම්ලය වැඩි පරිමාවක් → සාන්ද්‍රණය නොවෙනස් → ශීඝ්‍රතාව වැඩි නොවේ","🔥බෑවුම වැඩි ⇒ ශීඝ්‍රතාව වැඩි","▸ ආරම්භයේ ශීඝ්‍රතාව වැඩිම → ක්‍රමයෙන් අඩු වේ","▸ වක්‍රයතිරස් ⇒ ප්‍රතික්‍රියාව අවසන් (ශීඝ්‍රතාව = 0)","🔥සමාන ප්‍රතික්‍රියක → අවසාන ප්‍රමාණය සමානයි","ස්කන්ධය මනින විට (CO2 පිට වේ) → වක්‍රයපහළට බෑ වී තිරස්","▸ MnO2 0.2 g → පෙරා, වියළා කිරූ විට 0.2 g ම → වැ ය නොවේ","🔥 කුඩා ප්‍රමාණයක් → විශාල ප්‍රතික්‍රියක ප්‍රමාණයකට සෑහේ","▸ ඒ ඒ ප්‍රතික්‍රියාවට විශිෂ්ට උත්ප්‍රේ රප්‍රේක ඇත භෞ තික ස්වභාවය වෙනස් විය හැක · රසායනික වෙනසක් නැත","▸ H2O2 වියෝජනය අඩු කිරීමට → H2 🔥 SO4 බිංදුවක් කර්මා න්තවල උත්ප්‍රේ රප්‍රේක · අමතර දැනුමට රසායනික කර්මා න්තය උත්ප්‍රේ රප්‍රේකය","ඇමෝනියා : හේබර් ක්‍රමය සවිවර යකඩ සල්ෆියුරික ණි","• සංවිධාන මට්ටම් : හෘත් පේශි සෛල → හෘත් පටකය → හෘදය → රුධිර සංසරණ පද්ධතිය → ජීවියා","• ප්‍රභා ස්වයං පෝෂී (ශාක) · රසායනික ස්වයං පෝෂී (බැක්ටීරියා) · විෂමපෝෂී (සතුන්) KOH → CO2 අවශෝෂණය · හුනුදියර කිරි පැහැ → CO2· බීජ + KOH → නළයේ ජලය නඟී → O2•","• බහිස්ස්‍රාවය : මූත්‍ර (වකුගඩු) · දහදිය (සම) · ප්‍රශ්වාසය (පෙනහැලි) · ශාකයේපුටිකා · ආමාශය නොවේ","• උත්තේජය හා ප්‍රතිචාරය : ස්පර්ශය → නිදිකුම්බා පත්‍ර හැකිළීම · ශබ්දය → කන් වසාගැනීම","• වෛරස : සෛල නොවේ · DNA හෝ RNA + ප්‍රෝටීන් කොපුව · ගුණනය සජීවී ධාරක සෛලය තුළ පමණි සෛලීය සංවිධානය · පෝෂණය · ශ්වසනය · උද්දීප්‍ය තාව හා සමායෝජනය · බහිස්ස්‍රාවය · චලනය · ප්‍රජනනය · වර්ධනය හා විකසනය → සෑම ජීවියෙ ක්ම සෑම විටම සියල්ල නොපෙන්වයි (එකක් හෝකිහිපයක්)","▸ ඒක සෛලික → ඉන්ද්‍රියිකා මට්ටම (පටක නැත) : ක්ලැමිඩො මොනාස්, යුග්ලීනා, ඇමීබා, පැරමීසියම් (පොකුණු ජලය / පිදුරු නිස්සාරකය)","🔥 බහුසෛලික → යුක්තාණුව (ශුක්‍රාණුව + ඩිම්බය) → විභාජනය → විවිධ සෛල වර්ග · උසස් ජීවීන් → පටක, පද්ධති මට්ටම","▸ ශාක : පරාග, අපිචර්මීය, ඉනි මෘදු ස්ථර, පාලක, ශෛලම, ප්ලෝයම, මූල කේශ සෛල","▸ මිනිසා : සම, ස්නායු, අස්ථි, පේශි, ජන්මාණු සෛල, රතු / සුදු රුධිරාණු","▸ ජීවීන්ගේ ලාක්ෂණික","8.2 පෝෂණය (Nutrition)","📌 පෝෂණය (Nutrition) ජීවය පවත්වා ගැනීම සඳහා ශක්තිය හා ද්‍රව්‍ය","ලබා ගැනීමේ ක්‍රියාවලිය පෝෂණය ලෙස හඳුන්වයි.","පෝෂණ ක්‍රමය ශක්තිය / ආහාරය නිදසුන ප්‍රභා ස්වයං පෝෂී ආලෝක ශක්තිය බොහොමයක් ශාක රසායනික ස්වයං පෝෂී රසායනික ප්‍රතික්‍රියා බොහෝ බැක්ටීරියා විෂමපෝෂී ශාක නිපදවූ / ජීවී සම්භව කාබනික ආහාර සතුන් කාබන් ඩයොක්සයිඩ් + ජලය ⟶ ග්ලූකෝස් + ඔක්සිජන් · 6CO2 + 6H2O ⟶ C6H12O6 + 6O2","8.3 ශ්වසනය (Respiration)","📌 සෛලීය ශ්වසනය (Cellular respiration) ජීව සෛල තුළ දී සංචිත ආහාර මගින් ශක්තිය නිපදවන ක්‍රියාවලිය සෛලීය ශ්වසනය ලෙස හැඳින්වේ.","🔥 CO2 පිට වන බව (ක්‍රියා. 02) 🔥 O2 අවශෝෂණය කරන බව (ක්‍රියා. 03) ඇටවුම P → A KOH → B හුනුදියර → C මැඩියා → D හුනු දියර → E ජලය ඉවත් කරයි → වායු ධාරා ව ප්‍රරෝහණය වන බීජ, ප්ලා ස්කු 2 · A ට පමණක් KOH · U නළය වර්ණ කළ ජලයේ · ක්ලිපය තද කෙරේ නිරීක්ෂණය","KOH වාතයේ CO2 ඉවත් කරයි → B වෙනසක් නැත · D කිරි පැහැ → ශ්වසනයේ දී CO2 පිට වේ KOH බීජ පිට කරන CO2 ගනී → A නළයේ ජලය","නඟී → O2 අවශෝෂණය වේ · B පැහැදිලි වෙනසක් නැත (CO2 ≈ O2) අමතර පාලකය : මැඩියා නැති ඇටවුම · මැඩියා වෙනුවට ප්‍රරෝහණය වන මුං, මෑ, වී, බඩඉරිඟු උපකල්පන : ආරම්භයේ CO2 නොසැලකිය හැකි තරම් කුඩා යි · පිට වන CO2 = ගන්නා O2 පරිමාව","💡 මතක ක්‍රමය : KOH කන්නේ CO2· හුනුදියර කිරි වුණොත් CO2 ආවා","8.4 උද්දීප්‍ය තාව හා සමායෝජනය (Irritability & Co-ordination)","📌 උත්තේජය (Stimulus) ප්‍රතිචාරයක් ඇති කරලීමට සමත් වෙනස්වීමක් උත්තේ ජයක් ලෙස හඳුන්වයි.","📌 උද්දීප්‍ය තාව (Irritability) බාහිර හා අභ්‍ය න්තර පරිසරවලින් පැමිණෙන උත්තේජවලට ප්‍රතිචාර දැක්වීමට ඇති හැකියාව උද්දීප්‍ය තාවයි.","📌 සමායෝජනය (Co-ordination) උත්තේජ සඳහා ප්‍රතිචාර දැක්වීමේ දී විවිධ ඉන්ද්‍රියයන් අතර සම්බන්ධීකරණය සමායෝජනය ලෙස හඳුන්වයි.","ජීවියා උත්තේජය ප්‍රතිචාරය","මිනිසා අධික ශබ්දය කන් දෙක වසාගැනීම ඇතැම් කෘමීන් ආලෝකය / අඳුර ආලෝකය / අඳුර දෙසට පියා ඹීම","🔥 නිදිකුම්බා ස්පර්ශය පත්‍රහැකිළීම → ස්පර්ශ සං වේ දී තෝර, සියඹලා, කතුරුමුරුං ගා ආලෝකය","(රාත්‍රිය) රාත්‍රියේ හැකිළීම → ආලෝක සං වේ දී ස්වයං පෝෂී → ආහාර තමන් විසින් ම · ගබඩා ව : කඳ, මුල්, පත්‍ර,ත්‍රඵල","▸ දිරා පත් කරන්නන් → මෘතෝපජීවීන්","🔥අග මුල නැති වැල → ප්‍රභා ස්වයං පෝෂී නොවේ","▸ ප්‍රභාසංශ්ලේෂණය → ශාක සෛලවල හරිතලව තුළ හරිතප්‍රදආධාරයෙන් ආහාර නිපදවීම (ආලෝක ශක්තිය) ආහාර ජීරණයේ අන්තඵල + O2 → ශක්තිය · ප්‍රතික්‍රියා දා මයකි → ඍජුව නොපෙනේ → පරීක්ෂණ / ආශ්වාස\u0002ප්‍රශ්වාස▸ උත්තේජය → බාහිර හෝඅභ්‍ය න්තර වෙනස්වීමක් : ආලෝකය, ශබ්දය, රසායනික / යාන්ත්‍රිකම්පන","▸ ප්‍රතිචාරය → වෙනස්වීම්වලට ක්‍රියාකිරීම","▸ සං වේ දී ඉන්ද්‍රිය : ඇස, කන, නාසය, දිව, සම","▸ සමායෝජනයට → ස්නායු, පේශි, හෝර්මෝන","▸ ශාක ද උත්තේජවලට ප්‍රතිචාර දක්වයි","8.5 බහිස්ස්‍රාවය (Excretion)","📌 බහිස්ස්‍රාවය (Excretion) පරිවෘත්තීය ක්‍රියාවල දී නිපදවෙන අපද්‍රව්‍ය","සිරු රෙන් බැහැර කිරීම බහිස්ස්‍රා වයයි.","සංවෘත්තිය සරල → සංකීර්ණ · ශක්තිය ගබඩා අපවෘත්තිය සංකීර්ණ → සරල · ශක්තිය නිදහස් පරිවෘත්තිය සියලු ජෛව රසායනික ප්‍රතික්‍රියා = සංවෘත්තිය + අපවෘත්තිය","බැහැර වන්නේ බහිස්ස්‍රා වී ඵල ඉන්ද්‍රිය / ව්‍යුහය","මූත්‍ර යුරියා, ජලය, ලවණ වකුගඩු දහදිය ජලය, ලවණ සම ප්‍රශ්වාස වාතය CO2, H2O පෙනහැලි ශාක CO2(ශ්වසනය) · O2 (ප්‍රභාසංශ්ලේෂණය) පත්‍රවල පුටිකා, වා සිදුරු","8.6 චලනය (Movement) ජීවියා චලනයට ඒක සෛලික පක්ෂ්ම, කශිකා, ව්‍යාජ පා ද බහුසෛලික පේශි + පා ද, වරල්, පියා පත් ශාක අග්‍රස්ථය → ආලෝකය · මුල → ගුරු ත්වය","8.7 ප්‍රජනනය (Reproduction)","📌 ප්‍රජනනය (Reproduction) ඒක සෛලික ජීවියකු හෝබහුසෛලික ජීවියකු තම වර්ගයාගේ ඉදිරි පැවැත්ම සඳහා නව පරම්පරාවක් බිහි කිරීමේ කාර්යා වලිය ප්‍රජනනය නම් වේ.","ලිංගික අලිංගික එකම විශේෂයේ දෙදෙනකුගේ ජන්මාණු (පුං + ජායා) → යුක්තාණුව (මුල් ම සෛලය) තනි ජීවියකු · වර්ධක කොටස් මගින් බෝවීම","8.8 වර්ධනය හා විකසනය (Growth and Development)","📌 සෛල වර්ධනය (Growth) සෛල වර්ධනය යනු ජීවී සෛලයක ප්‍රත්‍යාප්‍ර ත්‍යාවර්ත නොවන වියළි බරෙ හි වැඩි වීමයි.","📌 විකසනය (Development) විකසනය ලෙස හඳුන්වන්නේ සෛල සංකීර්ණභා වයෙන් ඉහළ යාමයි.","ජීවියා වර්ධනය ලෙස සැලකෙන්නේ බහුසෛලික ප්‍රධාන වශයෙන් විභාජනයෙන් සෛල සංඛ්‍යාව වැඩි වීම ඒක සෛලික (පැරමීසියම්, යීස්ට්, ක්ලැමිඩො මොනාස්) සෛලයේ ප්‍රමාණය හා පරිමාව වැඩි වීම 1. ප්‍රත්‍යාප්‍ර ත්‍යාවර්ත නොවන පරිදි සෛල ප්‍රමාණයෙන් විශාල වීම 2. සෛල විභාජනය මගින් සෛල සංඛ්‍යාව වැඩි වීම 3. සෛල විශේෂණය වීම ජීවී ද? අජීවී ද? · වෛරස (Virus)","💡 මතක ක්‍රමය : වෛරසය ධාරක සෛලය","ඇතුළේ විතරයි ජීවී වෛරසය","ව්‍යුහය න්‍ය ෂ්ටික අම්ලය (DNA හෝ RNA) + ප්‍රෝටීන් කොපුව · සෛල ලෙස නොසැලකේ · විවිධ හැඩ, විශාලත්ව ප්‍රමාණය බැක්ටීරියාවකින් 1000න් පංගුවක් පමණ → ඉලෙක්ට්‍රෝන අණ්වීක්ෂයෙන් පමණි පරිවෘත්තිය ඉන්ද්‍රියිකා නැත → නැත → ක්‍රියාත්මක වන්නේ සජීවී ධාරක සෛලයක් තුළ පමණි ජීවී ලක්ෂණය","ප්‍රජනනය පමණි : ධාරක සෛල පටලය බිඳ DNA / RNA මුදා හැරේ → ගුණනය → නව වෛරස දහස් ගණනක් රෝග ශාක : මිරිස් කොළ කොඩවීම, කෙසෙල් වඳ පීදීම · සතුන් : ඩෙංගු, සෙම්ප්‍රතිශ්‍යාව, ඉන්ෆ්ලුවෙ න්සා, AIDS සතුන්ගේ ප්‍රධාන ඵල → යුරියා · ලවණ · CO2 🔥 · ජලය","මිනිසා ගේ නයිට්‍රජනීය බහිස්ස්‍රාවය → වකුගඩු · නොකළොත් විෂ · ආමාශය බහිස්ස්‍රා වී නොවේ","▸ ආහාර · ආරක්ෂාව · ප්‍රජනනය සඳහා → මුළු දේහය හෝකොටසක් · ඉන්ද්‍රියිකා ද","▸ සමායෝජනයේ ප්‍රතිඵලය : ආලෝකය / අඳුර, රසායනික, ගුරුත්වා කර්ෂණය, තාපය, කම්පන / ස්පර්ශය","▸ කුණු ගොඩේ සුදු නූල් = දිලීරයේ වර්ධක කොටස · හතු = ලිංගික ප්‍රජනනයට සෑදෙන උපාංග","🔥ප්‍රධාන පියවර තුන","▸ යුක්තාණුව → විභාජනය → විශේෂණය වූ පටක · මිනිසා : යුක්තාණුව → ගර්භාෂය තුළ කල  වැඩි ශක්තියක් සෛල පටල පොස්ෆොලිපිඩ · කොලෙස්ටෙ රොල් ජල සංරක්ෂණය කියුටින් · ඉටි → විජලනය නැත තාප පරිවාරක අධඃ චර්මීය මේදය (අචලතාපී) ඉන්ද්‍රිය ආරක්ෂාව කම්පන අවශෝෂණය","හෝර්මෝන ඊස්ට්‍රජන් · ටෙස්ටොස්ටෙ රොන් · කෝ ටිසොන්","▸ පොලිසැකරයිඩ තුනේම ඒකකය ග්ලුකෝස් → වෙනස : අණු ගණන හා සම්බන්ධ වන ආකාරය","🔥වැදගත්කම : ප්‍රධාන ශක්ති ප්‍රභවය · සංචිත ආහාරය · සෛල බිත්තිය · නියුක්ලෙයික් අම්ලවල සංඝටකයක්","▸ සියලු සජීවී සෛලවල අත්‍ය වශ්‍ය සංඝටකයක් · මිනිස් සිරු රෙන් ≈ 17%","🔥සෑම විටම C, H, O, N · ඇතැම් විට S","▸ ආහාර : මස් · මාළු · බිත්තර සුදු මදය · මාශ බෝග කාර්ය : ශක්තිය (කාබොහයිඩ්‍රේ ට, මේ ද නොසෑහෙන විට) · ව්‍යුහය (සෛල පටලය · කෙස්, පිහා ටුවල කෙරටින්) · එන්සයිම · හෝර්මෝන (සමායෝජනය, සමස්ථිතිය) · ප්‍රතිදේහ (රෝගවලින් ආරක්ෂාව)","🔥 අමතර : R වෙනස් → ඇමයිනොඅම්ල 20 · සරලතම ග්ලයිසින් (R = H) · ශරීරයේ සෑදිය නොහැකි = අත්‍ය වශ්‍ය","ඇමයිනොඅම්ල · මයොසීන්, ඇක්ටින් → පේශි · ඔසෙයින් → අස්ථි · හිමොග්ලොබින් → රතු රුධිරාණු · කෙරටින් → කෙස් · ලෙගියුමින් → මාශ බෝග · ග්ලුටන් → තිරිඟු · ඇල්බියුමින් → බිත්තර සුදු","▸ සුක්‍රෝස් → ග්ලුකෝස් : පිටත තනුක අම්ල + රත් කළ යුතුයි · ජීරණ එන්සයිම → අඩු උෂ්ණත්වයේ පහසුවෙන් පාන් පිටි 2 ml + ඇමයිලේස් (ප්‍රරෝහණය වන මුංඅඹරා පෙරූයුෂ 2 ml) → මිනිත්තු 2න් 2ට අයඩින් : නිල් → ක්‍රමයෙන් දුඹුරු → අයඩින් පාට (කහ/දුඹුරු) → පිෂ්ටය මෝල්ටෝස් බවට","▸ C, H, O · කාබොහයිඩ්‍රේ ටවලට වඩා O අඩුයි","▸ ජලයේ දිය නොවේ · කාබනික ද්‍රාවකවල දිය වේ","▸ ආහාර : රටකජු · පොල් · තල · බටර් · මාගරින් අමතර : සන්තෘප්ත → තනි බන්ධන · ඝන · අසන්තෘප්ත → ද්විත්ව බන්ධන · ද්‍රව","▸ හඳුනා ගැනීමේ පරීක්ෂා (ආහාර සංඝටක හා මූලද්‍රව්‍ය) සොයන්නේ කරන දේ ධන නිරීක්ෂණය","පිෂ්ටය අයඩින් ද්‍රාවණය බිංදුවක් දම්පා ටට හුරු නිල් (කළුනිල්) ග්ලුකෝස් බෙනඩික්ට් + ජල තාපකයේ ක්‍රමයෙන් රත් නිල් → කොළ → කොළ කහ → තැඹිලි → ගඩොල් රතු සුක්‍රෝස් බෙනඩික්ට් + රත් → වෙනසක් නැත · තනුක H2SO4 + රත් → NaOH න් උදා සීන → බෙනඩික්ට් + රත් දෙවනුව ගඩොල් රතු (අම්ලය සුක්‍රෝස් → ග්ලුකෝස්) ප්‍රෝටීන් (N) බයියුරේට් : බිත්තර සුදු / පරිප්පු + NaOH වැඩිපුර + CuSO4 තද දම් → ප්‍රෝටීන් → N ඇත ලිපිඩ සුඩාන් III + තෙල් → හොඳින් සොලවන්න තෙල් ස්තරය රතු ජලය වියළි මස් / බිත්තර කටු / පත්‍රකුඩු ර ීන්, එන්සයිම, ලිපිඩ, නියුක්ලෙයික් අම්ල ලකුණු 10","b":"ප්‍රරෝහණය වන මුංබීජ ජලය ස්වල්පයක් සමඟ අඹරා පෙරා ගත් ද්‍රාවණයක් (X) 2 ml ක්, පාන් පිටි ජලයේ දිය\nකර සාදා ගත් මිශ්‍රණයක් 2 ml කට එකතු කරන ලදී. ඉන්පසු මිනිත්තු දෙකෙන් දෙකට මිශ්‍රණයෙන් බිංදුව බැගින්\nසුදු පිඟන් ගඩොලක් මත තබා, එයට අයඩින් ද්‍රා වණ බිංදුවක් එක් කරන ලදී.\n(i) ලැබුණු නිරීක්ෂණ කිහිපයක් වගුවේ දැක්වේ. මිනිත්තු 2 දී කළුනිල් වර්ණයක් ලැබුණේ ඇයි? (ල. 1)\nකාලය (මිනිත්තු) 2 8 14 20\nඅයඩින් සමඟ ලැබුණු වර්ණය කළුනිල් නිල් දුඹුරු අයඩින්වල වර්ණයම (කහ / දුඹුරු)\n\nපිළිතුර මිශ්‍රණයේ පිෂ්ටය ඇති නිසා (පිෂ්ටය අයඩින් සමඟ කළුනිල් වර්ණය දෙයි).\n(ii) මිනිත්තු 20 දී අයඩින්වල වර්ණයම ලැබුණේ ඇයි? X හි ඇති එන්සයිමය නම් කරමින් පැහැදිලි කරන්න. (ල. 1)\n\nපිළිතුර X හි ඇති ඇමයිලේස් (ල. ½) පිෂ්ටය මෝල්ටෝස් බවට පත් කළ නිසා මිශ්‍රණයේ පිෂ්ටය ඉතිරි නැත (ල.\n½).\n(iii) එන්සයිම යනු මොනවා ද? (ල. 1)\n\nපිළිතුර ජීවීන් තුළ සිදු වන ජෛව රසායනික ප්‍රතික්‍රියාවල ශීඝ්‍රතාව වැඩි කිරීමට ජීවීන් විසින්ම නිපදවනුලබන\nවිශේෂිත ප්‍රෝටීන් / කාබනික උත්ප්‍රේ රප්‍රේක.\n(iv) X ද්‍රාවණයේ ප්‍රෝටීන් අඩංගු බව තහවුරු කිරීමට කළ හැකි පරීක්ෂා වේ දී එකතු කරන ප්‍රතිකාරක දෙක එකතු\nකරන පිළිවෙළින් ලියා, ධන නිරීක්ෂණය සඳහන් කරන්න. (ල. 2)\n\nපිළිතුර සෝඩියම් හයිඩ්‍රො ක්සයිඩ් වැඩි පරිමාවක්, පසුව කොපර් සල්ෆේට් බිංදු කිහිපයක් (ල. 1). ද්‍රාවණය තද දම්\nපැහැ යට හැරේ (ල. 1). (බයියුරේට් පරීක්ෂාව)\n(v) ප්‍රෝ ටීන්වල සෑම විටම අඩංගු වන, නමුත් කාබොහයිඩ්‍රේටවල අඩංගු නොවන මූලද්‍රව්‍ය ය කුමක් ද? (ල. 1)\n\nපිළිතුර නයිට්‍රජන් (N)\n(vi) එන්සයිම ලෙස ක්‍රියා කිරීමට අමතරව ප්‍රෝ ටීන්වල වැදගත්කම් දෙකක් ලියන්න. (ල. 1)\n\nපිළිතුර ඕනෑ ම දෙකක් (ල. ½ බැගින්) : ශක්ති ප්‍රභවයක් ලෙස (කාබොහයිඩ්‍රේ ට හා මේ ද නොසෑහෙන විට) /\nව්‍යු හා ත්මක සංඝටක සෑදීම (සෛල පටලය, කෙස්වල කෙරටින්) / හෝර්මෝන ලෙස / ප්‍රතිදේහ ලෙස\n(vii) ලිපිඩ ජලයේ දිය නොවේ.\n(a) ලිපිඩ දිය වන්නේ කුමන වර්ගයේ ද්‍රාවකවල ද? (ල. 1)\n\nපිළිතුර කාබනික ද්‍රාවකවල\n(b) ලිපිඩ සෑදීම සඳහා එකතු වන සංඝටක දෙක නම් කරන්න. (ල. 1)\n\nපිළිතුර මේ ද අම්ල හා ග්ලිසරෝල් (ල. ½ බැගින්)\n(viii) නියුක්ලෙයික් අම්ලවල තැනුම් ඒකකය නම් කර, නියුක්ලෙයික් අම්ලවල අඩංගු මූලද්‍රව්‍ය පහ ලියන්න. (ල. 1) ූනන : 2n → 2n · 2 සර්වසම ඌනන : 2n → n · 4 · ප්‍රභේදන","• සෛල වාදයේ කරුණු තුන · සෛලය = ව්‍යුහමය හා කෘත්‍ය මය ඒකකය","• ඉන්ද්‍රියිකා → කෘත්‍ය : මයිටො කොන්ඩ්‍රියම, රයිබොසෝම, රළු / සිනිඳු ජාලිකා, ගොල්ගි, රික්තකය","• ශාක හා සත්ත්ව සෛල වෙනස (බිත්තිය, හරිතලව, රික්තකය) · රූපයේ කොටස් නම් කිරීම","• සෛල බිත්තිය (අජීවී) හා ප්ලාස්ම පටලය (සජීවී, වරණ පාරගම්‍ය)","• අනූනන හා ඌනන : දුහිතෘ සෛල 2 / 4 · 2n → 2n / 2n → n · සිදු වන තැන · වැදගත්කම 1665 රොබට් හුක් → කිරල ඇබය → මී වදය වැනි කුටීර → සෛල (cells)","▸ 1838 ශ්ලයිඩන්, ශ්වාන්, වර්කොව් → සෛල වාදය","▸ කෘත්‍ය යට හැඩ ගැසුණු කුඩා ම ජෛවීය ඒකකය","▸ O2 → රතු රුධිරාණු · ආවේග → ස්නායු සෛල","▸ ඒක සෛලික (තනි සෛලය) · බහුසෛලික හැඩය, ප්‍රමාණය, ක්‍රියාකා රිත්වය විවිධයි · පියවි ඇසට නොපෙනේ → ආලෝක අණ්වීක්ෂය","▸ කොපුල් සෛල (සත්ත්ව) → මුඛය සෝදායෝගට් හැන්දකින් කම්මුලේ ඇතුළු පැත්ත සූරා ගැනීම","▸ ලුනු සිවිය (ශාක) → මාංසල කැබැල්ලේ සිවිය → ජලය සහිත ඔරලෝ සුතැටිය → පින්සලෙන් කදාවට","▸ කදාව : ජල බින්දුව → නියැ දිය → වැසුම් පෙත්ත පරිස්සමෙන් (වායුබුබුළු නැතිව) → ආලෝක අණ්වීක්ෂය","වර්ග හා සංඛ්‍යාව → සෛලයේ කෘත්‍ය ය අනුව · බොහොමයක් → ඉලෙක්ට්‍රෝන අණ්වීක්ෂය","▸ දර්ශීය සෛලය → සියලු ඉන්ද්‍රියිකා ඇති සේ නිර්මාණය","කළ සෛලය · ජීව ලෝකයේනොපවතී","▸ ශාක හා සත්ත්ව සෛලවල ව්‍යුහය හා කෘත්‍ය","දර්ශීය ශාක සෛලය","දර්ශීය සත්ත්ව සෛලය","🔥 සත්ත්ව සෛලය හා ශාක සෛලය : ප්‍රධාන වෙනස්කම් සත්ත්ව සෛලය (කොපුල් සෛල) ශාක සෛලය (ලුනු සිවිය) සෛල බිත්තිය නැත → පිටත ආවරණය ප්ලාස්ම පටලය ඇත (සෙලියුලෝස්) → පටලය ඊට ඇතුළතින් සෛල ප්ලාස්මය වැඩි ඉඩ ගනී · න්‍ය ෂ්ටිය කේන්ද්‍රගතව සෛලයේ පර්යන්තයට තල්ලු වී රික්තකය විශාල රික්තක නැත (කුඩා තාවකාලික ඒවා විය","හැක) · ඒක සෛලිකයන්ට සංකෝ චක රික්තක විශාල මධ්‍ය රික්තකයක් හෝකිහිපයක් හරිතලව නැත බොහෝ විට ඇත කේන්ද්‍ර දේහය ඇත නැත","6.4 සෛල ඉන්ද්‍රියිකා හා ව්‍යුහ : ව්‍යුහය → කෘත්‍ය ය (ශ්‍රමවිභජනය) ව්‍යුහය ලක්ෂණ කෘත්‍ය ය","සෛල බිත්තිය (ශාක) අජීවී · ප්‍රධාන සංඝටකය සෙලියුලෝස් හැඩය · සන්ධාරණය · ආරක්ෂාව ප්ලාස්ම පටලය පොස්පොලිපිඩ + ප්‍රෝටීන් · සජීවී · අර්ධ / වරණ පාරගම්‍ය","ආවරණය · ද්‍රව්‍ය ඇතුළු වීම / පිට වීම පාලනය","සෛල ප්ලාස්මය ඉන්ද්‍රියිකා හැර ජල්ලිමය තරලය · කාබනික + අකාබනික හැඩය · ඉන්ද්‍ ප්‍රෝටීන් සාදයි · රළු = ගෙනියයි · සිනිඳු = ලිපිඩ · ගොල්ගි = ස්‍රාවය","▸ පටලවලින් වට වූ : න්‍ය ෂ්ටිය, මයිටො කොන්ඩ්‍රියා, ජාලිකා, ගොල්ගි · පටල නොදරන : රයිබොසෝම","🔥වර්ධනය පළමුව → උපරිම සීමා වට පසු → විභාජනය · ගුණනය 1 → 2 → 4 → 8 …","🔥සත්‍ය න්‍ය ෂ්ටික සෛලය : න්‍ය ෂ්ටිය පළමුව → අනතුරු ව සෛල ප්ලාස්මය","▸ විභාජනයට පෙර නූල් වැනි වර්ණදේහ → වර්ණදේ හාංශවලට වෙන් වේ · ප්‍රවේණික ද්‍රව්‍ය වර්ණදේහ තුළ","▸ දෛහික සෛලයක සංඛ්‍යාව නියතයි : මිනිසා 46 (23 n + 23 n = 2n) · ගෙම්බා 26 · වී 24","▸ සමජාතීය වර්ණදේහ යුගලය → සමාන ප්‍රවේණික තොරතුරු · එකක් මවගෙන්, අනෙක පියා ගෙන්","🔥ශුක්‍රාණුව (n) + ඩිම්බය (n) → යුක්තාණුව (2n) · මිනිසා : 46 → ජන්මාණු 23 → 23 + 23 = 46"],"essays":[{"t":"රචනා ප්‍රශ්නය 1 6.1–6.4 සෛලය, සෛල වාදය, සෛලවල ව්‍යුහය, ඉන්ද්‍රියිකා හා කෘත්‍ය ලකුණු 20","b":"(A) ශිෂ්‍ය යෙක් කොපුල් සෛල නියැදියක් හා ලුනු සිවියක් වෙන වෙනම වීදුරු කදා මත ඇති ජල බින්දු මත තබා,\nවැසුම් පෙත්තකින් වසාආලෝක අණ්වීක්ෂයෙන් නිරීක්ෂණය කළේ ය.\n(i) කොපුල් සෛල නියැ දිය ලබා ගන්නා ආකාරය කෙටියෙන් ලියන්න. (ල. 1)\n\nපිළිතුර මුඛය සෝදා, පිරිසිදු (යෝගට්) හැන්දක් වැනි දෙයකින් කම්මුලේ ඇතුළු පැත්ත පරිස්සමෙන් සූරා\nගැනීම.\n(ii) වැසුම් පෙත්ත තැබීමේ දී සැලකිලිමත් විය යුතු කරුණ කුමක් ද? ඊට හේතුවක් දෙන්න. (ල. 2)\n\nපිළිතුර වායුබුබුළු ඇතුළු නොවන සේ වැසුම් පෙත්ත පරිස්සමෙන් පහත් කිරීම (ල. 1). වායුබුබුළු නිසා\nසෛල පැහැදිලිව නොපෙනේ / බුබුළු සෛල ලෙස වරදවා හඳුනා ගත හැකි නිසා (ල. 1).\n(iii) සෛල වර්ග දෙකෙහිම දැකිය හැකි ව්‍යුහ දෙකක් ද, ලුනු සිවියේ සෛලවල පමණක් දැකිය හැකි ව්‍යුහ\nදෙකක් ද ලියන්න. (ල. 2)\n\nපිළිතුර දෙකෙහිම : න්‍ය ෂ්ටිය, සෛල ප්ලාස්මය (ල. ½ × 2). ලුනු සිවියේ පමණි : සෛල බිත්තිය, විශාල\nරික්තකය (ල. ½ × 2). (හරිතලව පිළිනො ගනී — ලුනු සිවියේ සෛලවල හරිතලව නොපෙනේ.)\n(iv) මෙම සෛලවල ඇති ඉන්ද්‍රියිකා බොහොමයක් නිරීක්ෂණය කිරීමට භාවිත කළ යුතු අණ්වීක්ෂය කුමක් ද?\n(ල. 1)\n\nපිළිතුර ඉලෙක්ට්‍රෝන අණ්වීක්ෂය.\n(v) සෛලය ජීවයේ කෘත්‍ය මය ඒකකය ලෙස සැලකෙන්නේ ඇයි? මිනිස් දේහයෙන් නිදසුනක් සහිතව ලියන්න.\n(ල. 2)\n\nපිළිතුර කිසියම් කෘත්‍ය යක් (කාර්යයක්) ඉටු කිරීමට හැඩ ගැසුණු කුඩා ම ජෛවීය ඒකකය සෛලය නිසා (ල.\n1). නිදසුන : ඔක්සිජන් පරිවහනයට රතු රුධිරාණු / ආවේග සන්නයනයට ස්නායු සෛල (ල. 1).\n(B) ඉලෙක්ට්‍රෝන අණ්වීක්ෂීය තොරතුරු පදනම් කර ඇඳි දර්ශීය සෛලයක රූප සටහනක් පහත දැක්වේ.\nA\nE\nB\nD\nC\nG\nF\nH\n(i) \"දර්ශීය සෛලය\" යනු කුමක් ද? (ල. 1)\n\nපිළිතුර සෛලයක තිබිය යුතු සියලු ම ඉන්ද්‍රියිකා අඩංගු වන සේ නිර්මාණය කරන ලද සෛලය (ජීව\nලෝකයේඑවැනි සෛලයක් නොපවතී).\n(ii) මෙ ය ශාක සෛලයක් බව හඳුනා ගැනීමට උපකාරී වන, රූපයේ දැක්වෙන ලක්ෂණ දෙකක් අක්ෂරය සහ\nනම සමඟ ලියන්න. (ල. 2)\n\nපිළිතුර ඕනෑ ම දෙකක් (ල. 1 × 2) : B — සෛල බිත්තිය ; C — හරිතලව ; F — විශාල මධ්‍ය රික්තකය.\n(iii) A, D, G හා H ලෙස නම් කර ඇති කොටස් නම් කරන්න. (ල. 2)\n\nපිළිතුර A — න්‍ය ෂ්ටිකාව ; D — මයිටො කොන්ඩ්‍රියම ; G — තානප්ලාස්ටය (රික්තක පටලය) ; H — ගොල්ගි\nසංකීර්ණය (ල. ½ × 4)\n(iv) B සෑදී ඇති ප්‍රධාන සංඝටකය නම් කර, B හි කෘත්‍ය දෙකක් ලියන්න. (ල. 2)\n\nපිළිතුර සෙලියුලෝස් (ල. 1). සෛලයේ හැඩය පවත්වා ගැනීම / සන්ධාරණය / ආරක්ෂාව — ඕනෑ ම දෙකක්\n(ල. ½ × 2).\n(C) සෛලයක ඇති සෑම ව්‍යු හයක් ම ඊට සුවිශේෂී කෘත්‍ය යක් ඉටුකරයි.\n(i) පහත විස්තරවලට ගැළපෙන ඉන්ද්‍රියිකාව නම් කරන්න.\n(a) පෘෂ්ඨයට රයිබොසෝම සම්බන්ධ වී ඇති, ප්‍රෝටීන් පරිවහනය කරන පටල ජාලය\n(b) රයිබොසෝම රහිත, ලිපිඩ හා ස්ටෙ රොයිඩ නිපදවා පරිවහනය කරන නාලාකාර මඩි ජාලය (ල. 2)\n\nපිළිතුර (a) රළුඅන්තඃ ප්ලාස්මීය ජාලිකා (ල. 1) ; (b) සිනිඳුඅන්තඃ ප්ලාස්මීය ජාලිකා (ල. 1)\n(ii) මයිටො කොන්ඩ්‍රියා \"සෛලයේ ජවපො ළවල්\" ලෙස හැඳින්වෙන්නේ ඇයි? (ල. 1)\n\nපිළිතුර මයිටො කොන්ඩ්‍රියා තුළ ස්වායු ශ්වසන ප්‍රතික්‍රියා සිදු වී (පරිවෘත්තීය ක්‍රියා සඳහා අවශ්‍ය) ශක්තිය\nනිදහස් කරන නිසා.\n(iii) න්‍ය ෂ්ටිය තුළ ඇති ක්‍රො මැටින් ද්‍රව්‍ය සෛල විභාජනයේ දී කුමන ව්‍යුහ ලෙස දිස් වේ ද? එම ව්‍යුහවල\nකෘත්‍ය ය කුමක් ද? (ල. 2)\n\nපිළිතුර වර්ණදේහ (ල. 1). ප්‍රවේණික ද්‍රව්‍ය ගබඩා කිරීම / පරම්පරා වෙන් පරම්පරා වට ආවේණික ලක්ෂණ\nඋරුම කර දීම (ල. 1)."},{"t":"ව්‍යුහගත රචනා ප්‍රශ්නය 2 6.5 සෛල වර්ධනය, සෛල විභාජනය, අනූනන හා ඌනන විභාජනය ලකුණු 10","b":"මිනිස් දේහයේසිදු වන සෛල විභාජන ක්‍රමදෙකක් X හා Y රූපයේ දැක්වේ. සෛල තුළ ඇති සංඛ්‍යා වලින් එම\nසෛලවල වර්ණදේහ සංඛ්‍යාව දැක්වේ (Q හා P සෛලවල වර්ණදේහ සංඛ්‍යා දක්වා නැත).\n46\n46 46\nX\n46\nQ Q\nP P P P\nවිභාජනය 1\nවිභාජනය 2\nY\n(i) සෛලයක් විභාජනය වීමට පෙර වර්ධනය වේ. \"සෛල වර්ධනය\" යනු කුමක් ද? (ල. 1)\n\nපිළිතුර සෛලයක ප්‍රමාණය හෝවියළි බර (ස්කන්ධය) අප්‍රතිවර්ත්‍ය ලෙස වැඩි වීම.\n(ii) X හා Y විභාජන ක්‍රමනම් කරන්න. (ල. 1)\n\nපිළිතුර X — අනූනන විභාජනය ; Y — ඌනන විභාජනය (ල. ½ × 2)\n(iii) Q හා P සෛලවල වර්ණදේහ සංඛ්‍යා ලියන්න. (ල. 2)\n\nපිළිතුර Q = 23 (ල. 1) ; P = 23 (ල. 1). (ඌනන විභාජනයේ දෙවන පියවර අනූනන විභාජනයක් ලෙස සිදු වන\nනිසා සංඛ්‍යාව තවත් අඩු නොවේ.)\n(iv) Y ක්‍රමය මිනිස් දේහයේසිදු වන්නේ කුමන සෛල සෑදීමේ දී ද? එවැනි සෛල දෙකක් සංයෝජනය වී සෑදෙන\nයුක්තාණුවේ වර්ණදේහ සංඛ්‍යාව කීය ද? (ල. 2)\n\nපිළිතුර ජන්මාණු (ශුක්‍රාණු / ඩිම්බ) සෑදීමේ දී (ල. 1). 46 (n + n = 23 + 23 = 2n) (ල. 1).\n(v) සමජාතීය වර්ණදේහ යුගලයක් යනු කුමක් ද? (ල. 1)\n\nපිළිතුර සමාන ප්‍රවේණික තොරතුරු දරන වර්ණදේහ යුගලයක් (එකක් මවගෙන් ද අනෙක පියා ගෙන් ද ලැබේ).\n(vi) X ක්‍රමයේ වැදගත්කම් දෙකක් ලියන්න. (ල. 1)\n\nපිළිතුර බහුසෛලික ජීවීන්ගේ දේහ වර්ධනය / අලිංගික ප්‍රජනන ක්‍රමයක් වීම / තුවා ල සුව වීම, මැරුණු සෛල\nවෙනුවට නව සෛල ලබාදීම — ඕනෑ ම දෙකක් (ල. ½ × 2)\n(vii) Y ක්‍රමයේ වැදගත්කම් දෙකක් කෙටියෙන් පැහැදිලි කරන්න. (ල. 2)\n\nපිළිතුර ජන්මාණුවල වර්ණදේහ සංඛ්‍යාව අඩක් වන නිසා සංසේ චනයෙන් පසුපරම්පරා වෙන් පරම්පරා වට\nවර්ණදේහ සංඛ්‍යාව නියතව පවත්වා ගැනේ (ල. 1). වර්ණදේහවල ව්‍යුහමය වෙනස්කම් නිසා ප්‍රභේදන (නව\nලක්ෂණ) හට ගැනීම — පරිණා මයට වැදගත් (ල. 1)."}],"mcq":[{"n":223,"q":"සෛලය පිළිබඳ ව පහත ප්‍රකාශ සලකාබලන්න. A – 1665 දී රොබට් හුක් කිරල ඇබයක ඡේදයක් අණ්වීක්ෂයෙන් නිරීක්ෂණය කර, එහි දුටු කුටීර සෛල ලෙස නම් කළේ ය. B – සෛල වාදයට අනුව සියලු ම ජීවීන් සෑදී ඇත්තේ සෛල රාශියකිනි. C – සෛල වාදයට අනුව නව සෛල ඇති වන්නේ කලින් පැවති සෛලවලිනි. මෙයින් සත්‍ය වන්නේ,","o":["A පමණි.","A හා B පමණි.","A හා C පමණි.","A, B හා C සියල්ලම ය."],"a":3,"e":"A, C සත්‍ය යි. B අසත්‍ය යි — සෛල වාදයට අනුව ජීවීන් සෑදී ඇත්තේ එක් සෛලයකින් හෝසෛලවලිනි (ඒක සෛලික ජීවීන් ද ඇත)."},{"n":224,"q":"සෛලයක ආවරණ පිළිබඳ ව පහත ප්‍රකාශ සලකාබලන්න. A – ප්ලාස්ම පටලය සෑදී ඇත්තේ ප්‍රධාන වශයෙන් පොස්පොලිපිඩ හා ප්‍රෝ ටීන්වලිනි. B – ප්ලාස්ම පටලය මගින් සෛලය තුළට ද්‍රව්‍ය ඇතුළු වීම හා සෛලයෙන් ද්‍රව්‍ය ඉවත් වීම පාලනය කරයි. C – සෛල බිත්තිය ද ප්ලාස්ම පටලය මෙන් <script>
const D=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app');
const HUES=['#3b6cff','#8b5cf6','#0d9488','#16a34a','#ea580c','#db2777'];
let P={},LAST=null;try{P=JSON.parse(localStorage.getItem('wow-prog')||'{}');LAST=localStorage.getItem('wow-last')}catch(e){}
const save=()=>{try{localStorage.setItem('wow-prog',JSON.stringify(P))}catch(e){}};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const L=D.lessons,ids=Object.keys(L);
const colorOf={};D.units.forEach((u,i)=>u.l.forEach(k=>colorOf[k]=HUES[i%6]));
const essN=ids.reduce((a,k)=>a+L[k].essays.length,0);
const allQ=ids.flatMap(k=>L[k].mcq).concat(D.finale);
function prog(qs){let d=0,c=0;qs.forEach(q=>{if(P[q.n]!=null&&P[q.n]!==-1){d++;if(P[q.n]===q.a)c++}});return{d,c}}
function ring(p,size,col,label){const r=size/2-5,C=2*Math.PI*r;const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width',size);s.setAttribute('height',size);s.setAttribute('viewBox','0 0 '+size+' '+size);
  s.innerHTML='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="rgba(128,128,160,.25)" stroke-width="7"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C*(1-p)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-family="Inter,sans-serif" font-weight="800" font-size="'+size*0.27+'" fill="currentColor">'+label+'</text>';return s}
function mount(n){app.innerHTML='';const v=el('div','view');app.append(v);return v}
function home(){
  const v=mount();
  const h=el('section','hero');const w=el('div','wrap');
  w.innerHTML='<span class="tag">SCIENCE with CK Sir</span><h1>10 ශ්‍රේණිය<br><em>විද්‍යාව</em> WOW Tute</h1><p>පාඩම් 20ක කෙටි සටහන්, රචනා ප්‍රශ්න පිළිතුරු සමඟ, සහ MCQ 252ක් එකම තැනක. ප්‍රශ්නයක් ඔබපු ගමන් නිවැරදි පිළිතුර දැනගන්න.</p>';
  const c=el('div','cta');
  const cont=LAST&&L[LAST]?'<a class="btn" href="#lesson-'+LAST+'">දිගටම කරන්න · පාඩම '+LAST+' →</a>':'<a class="btn" href="#lesson-'+ids[0]+'">පටන් ගන්න →</a>';
  c.innerHTML=cont+'<a class="btn ghost" href="#finale">🏆 Grand Finale</a>';w.append(c);
  const pr=prog(allQ);const t=el('div','tiles');
  [[20,'පාඩම්'],[essN,'රචනා'],[allQ.length,'MCQ']].forEach(([n,x])=>{const d=el('div','tile');d.innerHTML='<b>'+n+'</b><span>'+x+'</span>';t.append(d)});
  const rt=el('div','tile ring');rt.append(ring(allQ.length?pr.d/allQ.length:0,54,'#fbbf24',Math.round(100*pr.d/allQ.length)+'%'));const rx=el('div');rx.innerHTML='<b style="font-size:18px">'+pr.d+' / '+allQ.length+'</b><span>පිළිතුරු දී ඇත</span>';rt.append(rx);t.append(rt);
  w.append(t);h.append(w);v.append(h);
  const m=el('div','wrap');
  D.units.forEach((u,i)=>{const col=HUES[i%6];const sec=el('section','sec');sec.style.setProperty('--u',col);
    const hh=el('h2');hh.append(el('i'),document.createTextNode(u.t));sec.append(hh,el('div','sub',u.s));const g=el('div','grid');
    u.l.forEach(k=>{const l=L[k],p=prog(l.mcq);const a=el('a','card');a.href='#lesson-'+k;
      a.innerHTML='<span class="no">පාඩම '+k+'</span><span class="nm"></span><span class="chips"><span class="chip">රචනා '+l.essays.length+'</span><span class="chip">MCQ '+l.mcq.length+'</span></span><span class="pb"><i style="width:'+(l.mcq.length?100*p.d/l.mcq.length:0)+'%"></i></span>';
      a.querySelector('.nm').textContent=l.name;g.append(a)});sec.append(g);m.append(sec)});
  const f=el('section','fin');f.innerHTML='<h2>🏆 Grand Finale</h2><p>පාඩම් 20ටම එක ප්‍රශ්නය බැගින්. විභාගයට පෙර අවසාන පරීක්ෂණය.</p><a class="btn" href="#finale">පටන් ගන්න →</a>';m.append(f);
  m.append(el('footer',null,'ඔබේ පිළිතුරු සුරැකෙන්නේ මෙම බ්‍රවුසරයේ පමණි.'));v.append(m);
}
function mk(p){
  if(/^\d+\.\d/.test(p)&&p.length<70)return el('div','h4',p);
  if(p.startsWith('📌')){const d=el('div','note def');const m=p.replace('📌','').trim();const i=m.indexOf(')');const head=i>0&&i<60?m.slice(0,i+1):'';d.append(el('h3',null,head||'අර්ථ දැක්වීම'),el('div',null,head?m.slice(i+1).trim():m));return d}
  if(p.startsWith('💡'))return el('div','note tip',p.replace('💡','').trim());
  if(p.startsWith('🔥'))return el('div','note fire','🔥 '+p.replace('🔥','').trim());
  const d=el('div','note'+(p.length>260?' full':''),p.replace(/^[▸•]\s*/,''));return d;
}
function notes(l){const w=el('div','notes');l.glance.concat(l.notes).forEach(p=>w.append(mk(p)));if(!w.children.length)w.append(el('div','empty','කෙටි සටහන් නැත.'));return w}
function essays(l){
  const w=el('div');if(!l.essays.length)w.append(el('div','empty','රචනා නැත.'));
  l.essays.forEach((e,i)=>{
    const d=el('details','ess');if(i===0)d.open=true;
    const sm=el('summary');const mkm=e.t.match(/ලකුණු\s*(\d+)/);
    sm.append(el('span','n',String(i+1)),el('span',null,e.t.replace(/^රචනා ප්‍රශ්නය\s*\d+\s*/,'').replace(/\s*ලකුණු\s*\d+\s*$/,'')||e.t));if(mkm)sm.append(el('span','mk','ලකුණු '+mkm[1]));d.append(sm);
    const inn=el('div','in');let ans=null;
    e.b.split('\n').forEach(ln=>{if(!ln.trim())return;
      if(ln.startsWith('පිළිතුර')){ans=el('details','ans');ans.append(el('summary',null,'පිළිතුර බලන්න'),el('div',null,ln.replace(/^පිළිතුර\s*/,'')));inn.append(ans);return}
      if(ans&&!/^\(([ivx]+|[a-zA-Z])\)/.test(ln)&&!/^\d\./.test(ln)){ans.lastChild.textContent+='\n'+ln;return}
      ans=null;inn.append(el('div','q',ln))});
    d.append(inn);w.append(d)});
  return w;
}
function mcqView(qs,col){
  const w=el('div');w.style.setProperty('--u',col);
  let only=null;
  const draw=()=>{w.innerHTML='';
    const list=only?qs.filter(q=>only.has(q.n)):qs;
    const tl=el('div','tools');const sc=el('span',null);sc.style.fontWeight='700';const mt=el('div','meter');const mi=el('i');mt.append(mi);
    const rs=el('button','sbtn','↺ නැවත පටන් ගන්න');tl.append(sc,mt,rs);w.append(tl);
    const resBox=el('div');w.append(resBox);
    const upd=()=>{const p=prog(qs);sc.textContent=p.d+' / '+qs.length+' · නිවැරදි '+p.c;mi.style.width=(qs.length?100*p.d/qs.length:0)+'%';
      resBox.innerHTML='';
      if(p.d===qs.length&&qs.length){const r=el('div','result');r.append(ring(p.c/qs.length,84,col,Math.round(100*p.c/qs.length)+'%'));const t=el('div');const pc=p.c/qs.length;
        t.append(el('h3',null,pc>=.8?'විශිෂ්ටයි! 🎉':pc>=.5?'හොඳයි, තව පොඩ්ඩක්!':'තව අභ්‍යාස කරමු'),el('p',null,'ප්‍රශ්න '+qs.length+' න් '+p.c+' ක් නිවැරදියි.'));
        const wrong=qs.filter(q=>q.o.length>=2&&P[q.n]!=null&&P[q.n]!==q.a&&P[q.n]!==-1);
        if(wrong.length){const b=el('button','sbtn','වැරදි '+wrong.length+' නැවත අභ්‍යාස කරන්න');b.onclick=()=>{only=new Set(wrong.map(q=>q.n));wrong.forEach(q=>delete P[q.n]);save();draw();window.scrollTo({top:0})};t.append(b)}
        r.append(t);resBox.append(r)}};
    list.forEach(q=>{
      const c=el('div','mq');c.append(el('span','n','ප්‍රශ්නය '+q.n),el('div','st',q.q));
      const ex=el('div','exp');ex.hidden=true;const btns=[];
      const show=()=>{const ch=P[q.n];btns.forEach((b,i)=>{b.disabled=true;b.classList.toggle('ok',i+1===q.a);b.classList.toggle('no',i+1===ch&&ch!==q.a)});ex.hidden=false;ex.innerHTML='';
        if(q.a){const s=el('strong',ch===q.a?'g':'b',ch===q.a?'✔ නිවැරදියි. ':'✘ නිවැරදි පිළිතුර ('+q.a+'). ');ex.append(s)}ex.append(document.createTextNode(q.e))};
      if(q.o.length>=2){q.o.forEach((t,i)=>{const b=el('button','opt');b.append(el('b',null,String(i+1)),el('span',null,t));b.onclick=()=>{P[q.n]=i+1;save();show();upd()};btns.push(b);c.append(b)})}
      else{const b=el('button','sbtn','පිළිතුර බලන්න (රූපයක් අදාළ වේ)');b.onclick=()=>{ex.hidden=false;ex.textContent=q.e||'';b.hidden=true;P[q.n]=-1;save();upd()};c.append(b)}
      c.append(ex);if(P[q.n]!=null&&P[q.n]!==-1&&q.o.length>=2)show();w.append(c)});
    rs.onclick=()=>{qs.forEach(q=>delete P[q.n]);only=null;save();draw()};
    upd();
  };
  draw();return w;
}

  const go=t=>{[...tabs.children].forEach((b,i)=>b.setAttribute('aria-selected',T[i][0]===t));body.innerHTML='';body.append(t==='notes'?notes(l):t==='essay'?essays(l):mcqView(l.mcq,col))};
  T.forEach(([t,n])=>{const b=el('button',null,n);b.setAttribute('role','tab');b.onclick=()=>{history.replaceState(null,'','#lesson-'+k+'-'+t);go(t)};tabs.append(b)});
  m.append(tabs,body);go(['notes','essay','mcq'].includes(tab)?tab:'notes');
  const order=D.units.flatMap(u=>u.l),i=order.indexOf(k);const pn=el('div','pn');
  if(i>0){const a=el('a');a.href='#lesson-'+order[i-1];a.append(el('small',null,'← කලින් පාඩම'),el('b',null,L[order[i-1]].name));pn.append(a)}

  m.append(pn,el('footer'));
}

function results(t){
  const q=t.toLowerCase();const out=[];
  const add=(h,s,x)=>{if(out.length<14)out.push([h,s,x])};
  ids.forEach(k=>{const l=L[k];if(l.name.includes(t))add('#lesson-'+k,'පාඩම '+k,l.name);
    l.mcq.forEach(m=>{if((m.q+' '+m.e+' '+m.o.join(' ')).toLowerCase().includes(q))add('#lesson-'+k+'-mcq','පාඩම '+k+' · MCQ '+m.n,m.q.slice(0,120))});
    l.essays.forEach(e=>{if((e.t+' '+e.b).toLowerCase().includes(q))add('#lesson-'+k+'-essay','පාඩම '+k+' · රචනා',e.t.slice(0,120))});
    l.notes.forEach(p=>{if(p.toLowerCase().includes(q))add('#lesson-'+k+'-notes','පාඩම '+k+' · සටහන',p.slice(0,120))})});
  return out;
}
const qi=document.getElementById('q'),rb=document.getElementById('res');let tm;
